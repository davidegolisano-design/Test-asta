name: LIVEASTA DEV clean35 timer settings audit
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean35-timer-settings-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: npm install --no-save espree
      - name: Run CLEAN-35 audit
        run: node dev/tools/clean35_timer_settings_audit.mjs
      - name: Validate JavaScript
        run: for f in dev/scripts/*.js; do node --check "$f"; done
      - name: Commit report and self-remove
        run: |
          rm -f .github/workflows/liveasta-clean35-timer-settings-audit.yml dev/tools/clean35_timer_settings_audit.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/CLEANUP_AUDIT_CLEAN35_TIMER_SETTINGS.txt .github/workflows/liveasta-clean35-timer-settings-audit.yml dev/tools/clean35_timer_settings_audit.mjs
          git commit -m "LIVEASTA DEV clean35 timer settings audit"
          git push
