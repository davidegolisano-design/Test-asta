name: Apply random ALL semantics
on:
  push:
    paths:
      - '.github/workflows/apply-random-all-semantics.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/patch_random_all_semantics.py
      - name: Validate
        run: |
          node --check scripts/app.js
          node --check scripts/mantra-auction.js
          grep -q "TUTTI I DISPONIBILI" scripts/mantra-auction.js
          grep -q "TURNO LIBERO" scripts/app.js
      - name: Commit
        run: |
          git config user.name liveasta-release-bot
          git config user.email liveasta-release-bot@users.noreply.github.com
          git add scripts/app.js scripts/mantra-auction.js index.html
          git rm .github/patch_random_all_semantics.py .github/workflows/apply-random-all-semantics.yml
          git commit -m 'Fix random ALL semantics and Classic free-turn mode'
          git push
