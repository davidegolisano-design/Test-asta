name: Apply v0.76 desktop board layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v076-desktop-board-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch desktop auctioneer board
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('v0.75', 'v0.76')

          marker = '/* LIVEASTA v0.76 — BANDITORE DESKTOP TOOLBAR + GIÀ BANDITI */'
          if marker not in s:
              css = r'''\n<style id="liveasta-v076-desktop-board">\n/* LIVEASTA v0.76 — BANDITORE DESKTOP TOOLBAR + GIÀ BANDITI */\n@media (min-width:761px){\n  /* ONLINE x/x sempre visibile nella testata desktop */\n  #screen-auctioneer-board #auction-dashboard.mode-pc ~ * {}\n  #screen-auctioneer-board > .session-nav .auction-session-center{\n    display:flex!important;\n    flex-direction:row!important;\n    align-items:center!important;\n    justify-content:center!important;\n    gap:8px!important;\n    min-width:0!important;\n    overflow:visible!important;\n  }\n  #screen-auctioneer-board > .session-nav .auction-online-pill{\n    display:inline-flex!important;\n    align-items:center!important;\n    flex:0 0 auto!important;\n    width:auto!important;\n    min-width:max-content!important;\n    height:28px!important;\n    min-height:28px!important;\n    padding:0 10px!important;\n    gap:6px!important;\n    overflow:visible!important;\n    white-space:nowrap!important;\n  }\n  #screen-auctioneer-board > .session-nav #auction-online-count{\n    display:inline!important;\n    visibility:visible!important;\n    opacity:1!important;\n    width:auto!important;\n    max-width:none!important;\n    overflow:visible!important;\n    color:#35d96f!important;\n    font-weight:950!important;\n    white-space:nowrap!important;\n  }\n\n  /* Unica riga desktop: Cerca | random | buste | ruoli | ordinamento */\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list .dashboard-left{\n    display:grid!important;\n    grid-template-columns:minmax(220px,1fr) 50px minmax(118px,150px) minmax(290px,360px) minmax(280px,350px)!important;\n    grid-template-rows:50px auto minmax(0,1fr) auto auto!important;\n    column-gap:7px!important;\n    row-gap:6px!important;\n    align-items:stretch!important;\n    min-height:0!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list .auction-list-toolbar,\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #list-filters-board,\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #list-filters-board .unified-filter-controls{\n    display:contents!important;\n    margin:0!important;\n    padding:0!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list .auction-list-toolbar .toolbar-roster-btn{\n    display:none!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list .auction-list-toolbar #player-search,\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list .auction-list-toolbar .toolbar-icon-btn,\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list .auction-list-toolbar .toolbar-sealed-mode-btn{\n    height:50px!important;\n    min-height:50px!important;\n    max-height:50px!important;\n    margin:0!important;\n    box-sizing:border-box!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list .auction-list-toolbar .toolbar-icon-btn{\n    width:50px!important;\n    min-width:50px!important;\n    padding:0!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list .auction-list-toolbar .toolbar-sealed-mode-btn{\n    width:100%!important;\n    min-width:0!important;\n    padding:0 12px!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #list-filters-board .unified-role-row{\n    height:50px!important;\n    min-height:50px!important;\n    display:grid!important;\n    grid-auto-flow:column!important;\n    grid-auto-columns:minmax(48px,1fr)!important;\n    gap:6px!important;\n    flex-wrap:nowrap!important;\n    align-items:stretch!important;\n    overflow:hidden!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #list-filters-board .unified-role-row > button{\n    width:100%!important;\n    min-width:0!important;\n    max-width:none!important;\n    height:50px!important;\n    min-height:50px!important;\n    max-height:50px!important;\n    margin:0!important;\n    padding:0 7px!important;\n    border-radius:9px!important;\n    box-sizing:border-box!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #list-filters-board .unified-sort-row{\n    height:50px!important;\n    min-height:50px!important;\n    display:grid!important;\n    grid-template-columns:auto minmax(0,1fr) 50px!important;\n    gap:6px!important;\n    align-items:stretch!important;\n    margin:0!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #list-filters-board .unified-sort-row label{\n    display:flex!important;\n    align-items:center!important;\n    height:50px!important;\n    margin:0!important;\n    white-space:nowrap!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #list-filters-board .unified-sort-row select,\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #list-filters-board .unified-direction{\n    height:50px!important;\n    min-height:50px!important;\n    max-height:50px!important;\n    margin:0!important;\n    box-sizing:border-box!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #list-filters-board .unified-direction{\n    width:50px!important;\n    min-width:50px!important;\n    padding:0!important;\n  }\n\n  /* Le sezioni della tabella continuano a occupare tutta la larghezza */\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list .list-section-title:not(.auctioned-section-head){\n    grid-column:1 / -1!important;\n    grid-row:2!important;\n    margin:0 2px!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list .table-container{\n    grid-column:1 / -1!important;\n    grid-row:3!important;\n    min-height:0!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list .auctioned-section-head{\n    grid-column:1 / -1!important;\n    grid-row:4!important;\n    display:grid!important;\n    grid-template-columns:minmax(0,1fr) auto!important;\n    gap:7px!important;\n    margin:0!important;\n    align-items:stretch!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list .auctioned-section-head .collapsed-toggle,\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list .auctioned-section-head .restore-all-btn{\n    height:40px!important;\n    min-height:40px!important;\n    max-height:40px!important;\n    margin:0!important;\n    box-sizing:border-box!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list .auctioned-section-head .restore-all-btn,\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list .auctioned-section-head .restore-all-btn:is(:hover,:focus,:active){\n    background:#D9434E!important;\n    background-image:none!important;\n    border-color:#B9323C!important;\n    color:#FFFFFF!important;\n    box-shadow:none!important;\n  }\n\n  /* GIÀ BANDITI desktop: tabella compatta e allineata */\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #auctioned-list{\n    grid-column:1 / -1!important;\n    grid-row:5!important;\n    width:100%!important;\n    min-height:0!important;\n    box-sizing:border-box!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #auctioned-list.collapsed{\n    display:none!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #auctioned-list:not(.collapsed){\n    display:block!important;\n    height:auto!important;\n    max-height:220px!important;\n    overflow-y:auto!important;\n    padding:0!important;\n    border:1px solid var(--theme-border)!important;\n    border-radius:8px!important;\n    background:var(--theme-input)!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #auctioned-list .auctioned-row{\n    display:grid!important;\n    grid-template-columns:62px minmax(0,1.3fr) minmax(0,1fr) 100px!important;\n    gap:10px!important;\n    align-items:center!important;\n    width:100%!important;\n    min-height:42px!important;\n    height:42px!important;\n    margin:0!important;\n    padding:4px 10px!important;\n    box-sizing:border-box!important;\n    border-bottom:1px solid var(--theme-border)!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #auctioned-list .auctioned-row:last-child{\n    border-bottom:0!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #auctioned-list .auctioned-row .role-badge{\n    width:38px!important;\n    min-width:38px!important;\n    max-width:38px!important;\n    margin:0!important;\n    padding:3px 5px!important;\n    justify-self:start!important;\n    border-radius:999px!important;\n    font-size:.72rem!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #auctioned-list .auctioned-name,\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #auctioned-list .auctioned-team{\n    min-width:0!important;\n    white-space:nowrap!important;\n    overflow:hidden!important;\n    text-overflow:ellipsis!important;\n    font-size:.88rem!important;\n    line-height:1!important;\n    text-align:left!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #auctioned-list .auctioned-name{\n    font-weight:850!important;\n    color:var(--theme-text)!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #auctioned-list .auctioned-team{\n    color:var(--theme-muted)!important;\n  }\n  #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #auctioned-list .restore-btn{\n    width:96px!important;\n    min-width:96px!important;\n    height:32px!important;\n    min-height:32px!important;\n    margin:0!important;\n    padding:0 8px!important;\n    justify-self:end!important;\n    font-size:.72rem!important;\n  }\n}\n</style>\n'''
              s = s.replace('</head>', css + '\n</head>', 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit v0.76
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'v0.76 optimize desktop auctioneer board toolbar and auctioned list'
          git push origin main
