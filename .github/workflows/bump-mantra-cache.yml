name: Bump Mantra cache
on:
  push:
    paths:
      - '.github/workflows/bump-mantra-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='./scripts/mantra-filter-ui.js?v=105'
          new='./scripts/mantra-filter-ui.js?v=109'
          if old not in s:
              raise SystemExit('old mantra-filter-ui reference not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name liveasta-release-bot
          git config user.email liveasta-release-bot@users.noreply.github.com
          git add index.html
          git commit -m 'Bump Mantra UI cache key'
          git push
