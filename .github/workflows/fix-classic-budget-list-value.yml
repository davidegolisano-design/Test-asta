name: Fix classic budget and player list value
on:
  push:
    paths: ['.github/workflows/fix-classic-budget-list-value.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/mantra-auction.js')
          s=p.read_text()
          anchor="    defaultPlayerBudgetPlan=function(){"
          helper=("    function ensureClassicBudgetRows(){\n"
                  "        const box=document.getElementById('player-budget-rows');\n"
                  "        if(!box||isMantraRoom())return;\n"
                  "        box.querySelector('[data-role=\\\"T\\\"]')?.remove();\n"
                  "        box.dataset.mode='classic';\n"
                  "        const copy=document.querySelector('#player-budget-overlay .player-budget-toggle-row small');\n"
                  "        if(copy)copy.textContent='Colora crediti e slot in base al piano P / D / C / A.';\n"
                  "        const note=document.querySelector('#player-budget-overlay .player-budget-note');\n"
                  "        if(note)note.textContent='Quando il budget è attivo, un reparto è verde se il budget residuo può ancora coprire gli slot mancanti (almeno 1 credito per slot); altrimenti diventa rosso.';\n"
                  "    }\n\n")
          if 'function ensureClassicBudgetRows()' not in s:
              if anchor not in s: raise SystemExit('budget anchor not found')
              s=s.replace(anchor,helper+anchor,1)
          s=s.replace("        if(!isMantraRoom())return baseOpenPlayerBudgetManager();","        if(!isMantraRoom()){ensureClassicBudgetRows();return baseOpenPlayerBudgetManager();}",1)
          s=s.replace("        if(!isMantraRoom())return baseRenderPlayerBudgetManager();","        if(!isMantraRoom()){ensureClassicBudgetRows();return baseRenderPlayerBudgetManager();}",1)
          p.write_text(s)

          p=Path('styles/mantra-filter-ui.css')
          s=p.read_text()
          s=s.replace('#player-listone-overlay#hlayer-listone-overlay','#player-listone-overlay#player-listone-overlay')
          s=s.replace('grid-template-columns:24px 76px minmax(0,1fr) 44px!important;','grid-template-columns:24px 76px minmax(0,1fr) auto 44px!important;')
          s=s.replace('grid-template-columns:22px 70px minmax(0,1fr) 40px!important;','grid-template-columns:22px 70px minmax(0,1fr) auto 40px!important;')
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('mantra-filter-ui.css?v=107','mantra-filter-ui.css?v=108')
          s=s.replace('mantra-auction.js?v=106','mantra-auction.js?v=108')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q "ensureClassicBudgetRows" scripts/mantra-auction.js
          grep -q "grid-template-columns:24px 76px minmax(0,1fr) auto 44px" styles/mantra-filter-ui.css
          grep -q "mantra-filter-ui.css?v=108" index.html
          grep -q "mantra-auction.js?v=108" index.html
      - name: Commit
        run: |
          git config user.name liveasta-release-bot
          git config user.email liveasta-release-bot@users.noreply.github.com
          git add index.html scripts/mantra-auction.js styles/mantra-filter-ui.css
          git rm .github/workflows/fix-classic-budget-list-value.yml
          git commit -m 'Fix classic budget roles and Mantra list value layout'
          git push
