name: Fix classic budget and player list value
on:
  push:
    paths: ['.github/workflows/fix-classic-budget-list-value.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Restore classic budget UI after visiting a Mantra room in the same session.
          p=Path('scripts/mantra-auction.js')
          s=p.read_text()
          anchor="    defaultPlayerBudgetPlan=function(){"
          helper="""    function ensureClassicBudgetRows(){
        const box=document.getElementById('player-budget-rows');
        if(!box||isMantraRoom())return;
        box.querySelector('[data-role=\"T\"]')?.remove();
        box.dataset.mode='classic';
        const copy=document.querySelector('#player-budget-overlay .player-budget-toggle-row small');
        if(copy)copy.textContent='Colora crediti e slot in base al piano P / D / C / A.';
        const note=document.querySelector('#player-budget-overlay .player-budget-note');
        if(note)note.textContent='Quando il budget è attivo, un reparto è verde se il budget residuo può ancora coprire gli slot mancanti (almeno 1 credito per slot); altrimenti diventa rosso.';
    }

"""
          if 'function ensureClassicBudgetRows()' not in s:
              if anchor not in s: raise SystemExit('budget anchor not found')
              s=s.replace(anchor,helper+anchor,1)
          old="        if(!isMantraRoom())return baseOpenPlayerBudgetManager();"
          new="        if(!isMantraRoom()){ensureClassicBudgetRows();return baseOpenPlayerBudgetManager();}"
          if old in s: s=s.replace(old,new,1)
          old="        if(!isMantraRoom())return baseRenderPlayerBudgetManager();"
          new="        if(!isMantraRoom()){ensureClassicBudgetRows();return baseRenderPlayerBudgetManager();}"
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)

          # 2) Player list: 5 real grid items, value must stay on the first row/right side.
          p=Path('styles/mantra-filter-ui.css')
          s=p.read_text().replace('#player-listone-overlay#hlayer-listone-overlay','#player-listone-overlay#player-listone-overlay')
          s += r'''

/* Player list has five DOM items: priority | roles | player | owner/status | value. */
html body.liveasta-mantra #player-listone-overlay#player-listone-overlay #player-listone-list#player-listone-list .player-listone-row{
  grid-template-columns:24px 76px minmax(0,1fr) auto 44px!important;
  grid-template-rows:1fr!important;
  align-items:center!important;
}
html body.liveasta-mantra #player-listone-overlay#player-listone-overlay #player-listone-list#player-listone-list .player-listone-row .player-listone-priority{grid-column:1!important;grid-row:1!important;}
html body.liveasta-mantra #player-listone-overlay#player-listone-overlay #player-listone-list#player-listone-list .player-listone-row > .role-badge{grid-column:2!important;grid-row:1!important;}
html body.liveasta-mantra #player-listone-overlay#player-listone-overlay #player-listone-list#player-listone-list .player-listone-row .player-listone-main{grid-column:3!important;grid-row:1!important;min-width:0!important;}
html body.liveasta-mantra #player-listone-overlay#player-listone-overlay #player-listone-list#player-listone-list .player-listone-row .player-listone-owner{
  grid-column:4!important;grid-row:1!important;
  max-width:64px!important;min-width:0!important;
  overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important;
  font-size:.56rem!important;
}
html body.liveasta-mantra #player-listone-overlay#player-listone-overlay #player-listone-list#player-listone-list .player-listone-row .player-listone-value{
  grid-column:5!important;grid-row:1!important;
  justify-self:end!important;align-self:center!important;
  white-space:nowrap!important;
}
@media(max-width:380px){
  html body.liveasta-mantra #player-listone-overlay#player-listone-overlay #player-listone-list#player-listone-list .player-listone-row{
    grid-template-columns:22px 70px minmax(0,1fr) auto 40px!important;
    gap:5px!important;
  }
  html body.liveasta-mantra #player-listone-overlay#player-listone-overlay #player-listone-list#player-listone-list .player-listone-row .player-listone-owner{max-width:48px!important;font-size:.50rem!important;}
}
'''
          p.write_text(s)

          # 3) Cache refresh, visible home version stays v1.0.
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('mantra-filter-ui.css?v=107','mantra-filter-ui.css?v=108')
          s=s.replace('mantra-auction.js?v=106','mantra-auction.js?v=108')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q "ensureClassicBudgetRows" scripts/mantra-auction.js
          grep -q "grid-template-columns:24px 76px minmax(0,1fr) auto 44px" styles/mantra-filter-ui.css
          grep -q "mantra-filter-ui.css?v=108" index.html
          grep -q "mantra-auction.js?v=108" index.html
      - name: Commit
        run: |
          git config user.name liveasta-release-bot
          git config user.email liveasta-release-bot@users.noreply.github.com
          git add index.html scripts/mantra-auction.js styles/mantra-filter-ui.css
          git rm .github/workflows/fix-classic-budget-list-value.yml
          git commit -m 'Fix classic budget roles and Mantra list value layout'
          git push
