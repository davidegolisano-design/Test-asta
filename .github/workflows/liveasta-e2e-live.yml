name: LIVEASTA controlled live E2E
on:
  push:
    paths:
      - '.github/workflows/liveasta-e2e-live.yml'
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 >/tmp/liveasta-http.log 2>&1 & sleep 2
      - run: node dev/tests/e2e-live-smoke.mjs
# e2e harness revision 2
