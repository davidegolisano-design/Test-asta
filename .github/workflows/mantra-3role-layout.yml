name: Mantra three-role layout
on:
  push:
    paths: ['.github/workflows/mantra-3role-layout.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch Mantra list geometry
        run: |
          cat >> styles/mantra-filter-ui.css <<'CSS'

/* === Mantra: list geometry for up to three real-role badges === */
html body.liveasta-mantra .nomination-player-row{
  grid-template-columns:22px 76px minmax(0,1fr) 42px!important;
  gap:6px!important;
}
html body.liveasta-mantra .nomination-player-row > .role-badge.role-badge-mantra{
  width:74px!important;
  min-width:74px!important;
  max-width:74px!important;
  justify-self:start!important;
  justify-content:flex-start!important;
  gap:2px!important;
  overflow:visible!important;
  clip-path:none!important;
}
html body.liveasta-mantra .nomination-player-row > .role-badge.role-badge-mantra .mantra-role-token{
  width:23px!important;
  height:23px!important;
  min-width:23px!important;
  min-height:23px!important;
  flex:0 0 23px!important;
  font-size:8px!important;
}
html body.liveasta-mantra .nomination-player-row .nomination-player-main{
  min-width:0!important;
  padding-left:0!important;
}

html body.liveasta-mantra #player-listone-overlay#player-listone-overlay #player-listone-list#player-listone-list .player-listone-row{
  grid-template-columns:24px 76px minmax(0,1fr) 44px!important;
}
html body.liveasta-mantra #player-listone-overlay#player-listone-overlay #player-listone-list#player-listone-list .player-listone-row > .role-badge.role-badge-mantra{
  width:74px!important;
  min-width:74px!important;
  max-width:74px!important;
  gap:2px!important;
  justify-content:flex-start!important;
}
html body.liveasta-mantra #player-listone-overlay#player-listone-overlay #player-listone-list#player-listone-list .player-listone-row > .role-badge.role-badge-mantra .mantra-role-token{
  width:23px!important;
  height:23px!important;
  min-width:23px!important;
  min-height:23px!important;
  flex:0 0 23px!important;
  font-size:8px!important;
}

html body.liveasta-mantra .roster-row{
  grid-template-columns:72px minmax(0,1fr) auto!important;
}
html body.liveasta-mantra .roster-player-line{
  grid-template-columns:72px minmax(0,1fr) auto!important;
}
html body.liveasta-mantra .player-room-roster-line{
  grid-template-columns:72px minmax(0,1fr) 48px!important;
}
html body.liveasta-mantra .auctioned-row{
  grid-template-columns:72px minmax(0,1fr) auto!important;
}
html body.liveasta-mantra :is(.roster-row,.roster-player-line,.player-room-roster-line,.auctioned-row) .role-badge.role-badge-mantra{
  width:70px!important;
  min-width:70px!important;
  max-width:70px!important;
  gap:2px!important;
  justify-content:flex-start!important;
  overflow:visible!important;
}
html body.liveasta-mantra :is(.roster-row,.roster-player-line,.player-room-roster-line,.auctioned-row) .role-badge.role-badge-mantra .mantra-role-token{
  width:22px!important;
  height:22px!important;
  min-width:22px!important;
  min-height:22px!important;
  flex:0 0 22px!important;
  font-size:7.5px!important;
}

/* Auctioneer mobile table: reserve enough real width for three badges. */
html body.liveasta-mantra #screen-auctioneer-board .mode-mobile th:nth-child(1),
html body.liveasta-mantra #screen-auctioneer-board .mode-mobile td:nth-child(1){
  width:23%!important;
  padding-left:4px!important;
  padding-right:4px!important;
  overflow:visible!important;
}
html body.liveasta-mantra #screen-auctioneer-board .mode-mobile th:nth-child(2){width:34%!important;}
html body.liveasta-mantra #screen-auctioneer-board .mode-mobile th:nth-child(3){width:25%!important;}
html body.liveasta-mantra #screen-auctioneer-board .mode-mobile th:nth-child(4){width:18%!important;}
html body.liveasta-mantra #screen-auctioneer-board .mode-mobile td:nth-child(1) .role-badge-mantra{
  gap:2px!important;
  width:max-content!important;
  max-width:none!important;
}
html body.liveasta-mantra #screen-auctioneer-board .mode-mobile td:nth-child(1) .mantra-role-token{
  width:21px!important;
  height:21px!important;
  min-width:21px!important;
  min-height:21px!important;
  flex:0 0 21px!important;
  font-size:7px!important;
}

@media(max-width:380px){
  html body.liveasta-mantra .nomination-player-row{
    grid-template-columns:20px 70px minmax(0,1fr) 38px!important;
    gap:5px!important;
  }
  html body.liveasta-mantra .nomination-player-row > .role-badge.role-badge-mantra{
    width:68px!important;
    min-width:68px!important;
    max-width:68px!important;
  }
  html body.liveasta-mantra .nomination-player-row > .role-badge.role-badge-mantra .mantra-role-token{
    width:21px!important;height:21px!important;min-width:21px!important;min-height:21px!important;flex:0 0 21px!important;font-size:7px!important;
  }
  html body.liveasta-mantra #player-listone-overlay#player-listone-overlay #player-listone-list#player-listone-list .player-listone-row{
    grid-template-columns:22px 70px minmax(0,1fr) 40px!important;
  }
  html body.liveasta-mantra #player-listone-overlay#player-listone-overlay #player-listone-list#player-listone-list .player-listone-row > .role-badge.role-badge-mantra{
    width:68px!important;min-width:68px!important;max-width:68px!important;
  }
  html body.liveasta-mantra #player-listone-overlay#player-listone-overlay #player-listone-list#player-listone-list .player-listone-row > .role-badge.role-badge-mantra .mantra-role-token{
    width:21px!important;height:21px!important;min-width:21px!important;min-height:21px!important;flex:0 0 21px!important;font-size:7px!important;
  }
}
CSS
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('mantra-filter-ui.css?v=105','mantra-filter-ui.css?v=107')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q "Mantra: list geometry for up to three" styles/mantra-filter-ui.css
          grep -q "mantra-filter-ui.css?v=107" index.html
      - name: Commit
        run: |
          git config user.name liveasta-release-bot
          git config user.email liveasta-release-bot@users.noreply.github.com
          git add index.html styles/mantra-filter-ui.css
          git rm .github/workflows/mantra-3role-layout.yml
          git commit -m 'Support three Mantra role badges in lists'
          git push
