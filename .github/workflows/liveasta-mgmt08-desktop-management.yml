name: LIVEASTA MGMT-08 desktop management layout
on:
  push:
    paths:
      - '.github/workflows/liveasta-mgmt08-desktop-management.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply desktop-only management layout
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('dev/index.html')
          s = index.read_text(encoding='utf-8')
          if 'v1.01 MGMT-07' not in s:
              raise SystemExit('Expected DEV v1.01 MGMT-07 marker not found')
          s = s.replace('v1.01 MGMT-07', 'v1.02 MGMT-08')
          s = s.replace('101-mgmt07', '102-mgmt08')
          index.write_text(s, encoding='utf-8')

          css = Path('dev/styles/management.css')
          s = css.read_text(encoding='utf-8')
          marker = '/* === MGMT-08: desktop-only management page alignment === */'
          if marker in s:
              raise SystemExit('MGMT-08 block already present')
          s = s.replace('canonical Gestione UI · v1.00 MGMT-06', 'canonical Gestione UI · v1.02 MGMT-08', 1)
          s += r'''

/* === MGMT-08: desktop-only management page alignment === */
/* Scope is intentionally tied to the auctioneer desktop mode. Smartphone rules remain untouched. */
body.auctioneer-desktop #screen-room-control .mg-page.control-grid{
  display:flex!important;
  flex-direction:column!important;
  gap:0!important;
  width:100%!important;
  min-width:0!important;
  max-width:none!important;
  height:auto!important;
  min-height:100%!important;
  max-height:none!important;
  margin:0!important;
  padding:0!important;
  overflow:visible!important;
}

body.auctioneer-desktop #screen-room-control .mg-header{
  width:100%!important;
  min-width:0!important;
  min-height:62px;
  flex:0 0 auto;
  flex-direction:row!important;
  align-items:center!important;
  justify-content:space-between!important;
  gap:20px!important;
  padding:10px max(24px,calc((100vw - 1240px)/2))!important;
}
body.auctioneer-desktop #screen-room-control .mg-header-main{
  flex:1 1 auto!important;
  min-width:0!important;
}
body.auctioneer-desktop #screen-room-control .mg-heading{
  flex:0 1 auto!important;
  min-width:0!important;
}
body.auctioneer-desktop #screen-room-control .mg-header-actions{
  display:flex!important;
  flex:0 0 auto!important;
  align-items:center!important;
  justify-content:flex-end!important;
  grid-template-columns:none!important;
  width:auto!important;
  min-width:0!important;
  gap:8px!important;
}
body.auctioneer-desktop #screen-room-control .mg-header-actions .btn{
  width:auto!important;
  min-width:96px!important;
  min-height:38px!important;
  margin:0!important;
  padding:8px 12px!important;
  white-space:nowrap!important;
}

body.auctioneer-desktop #screen-room-control .mg-content{
  flex:0 0 auto!important;
  align-self:center!important;
  width:min(1240px,calc(100% - 40px))!important;
  max-width:1240px!important;
  margin:0 auto!important;
  padding:24px 0 48px!important;
}
'''
          css.write_text(s, encoding='utf-8')
          PY
      - name: Validate desktop scope
        run: |
          python - <<'PY'
          from pathlib import Path
          h = Path('dev/index.html').read_text(encoding='utf-8')
          c = Path('dev/styles/management.css').read_text(encoding='utf-8')
          assert 'v1.02 MGMT-08' in h
          assert '102-mgmt08' in h
          assert 'MGMT-08: desktop-only management page alignment' in c
          assert 'body.auctioneer-desktop #screen-room-control .mg-page.control-grid' in c
          assert 'body.auctioneer-mobile #screen-room-control .mg-page.control-grid' not in c
          assert 'display:flex!important;' in c
          print('MGMT-08 validation OK')
          PY
      - name: Commit DEV-only changes
        run: |
          rm -f .github/workflows/liveasta-mgmt08-desktop-management.yml
          git config user.name 'liveasta-dev-bot'
          git config user.email 'liveasta-dev-bot@users.noreply.github.com'
          git add dev/index.html dev/styles/management.css .github/workflows/liveasta-mgmt08-desktop-management.yml
          git commit -m 'Fix DEV desktop management layout MGMT-08'
          git push origin main
