name: Apply v0.86 role badges
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v086-role-badges.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8',errors='ignore')
          s=s.replace('<link rel="stylesheet" href="./role-badges-v085.css?v=085">','<link rel="stylesheet" href="./role-badges-v086.css?v=086">')
          s=s.replace('v0.85','v0.86').replace('V0.85','V0.86')
          s=s.replace('<script src="./pwa-install.js?v=085"></script>','<script src="./pwa-install.js?v=086"></script>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "v0.86 fix desktop auctioned and player listone role badges" && git push)
