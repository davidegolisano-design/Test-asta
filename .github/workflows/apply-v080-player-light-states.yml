name: Apply v0.80 player light states

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v080-player-light-states.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable v0.80 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for old in ('v0.79','V0.79'):
              s=s.replace(old,'v0.80' if old[0]=='v' else 'V0.80')
          tag='<script src="./player-light-states-v080.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "v0.80 enable light-theme player win lose column styling"
            git push
          fi
