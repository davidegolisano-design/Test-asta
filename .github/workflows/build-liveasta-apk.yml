name: Build Liveasta APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/build-liveasta-apk.yml"

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android platform
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug --stacktrace

      - name: Verify packaged launcher icon
        run: |
          set -euxo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          AAPT2="/usr/local/lib/android/sdk/build-tools/36.0.0/aapt2"

          echo "=== BADGING ==="
          "$AAPT2" dump badging "$APK" | grep -E "application:|application-icon" || true

          echo "=== PACKAGED ICON RESOURCES ==="
          unzip -l "$APK" | grep -E "ic_launcher_liveasta|launcher_liveasta" || true

          # Require both the adaptive icon XML (Android 8+) and PNG fallback.
          unzip -l "$APK" | grep -E "res/mipmap-anydpi-v26/ic_launcher_liveasta\.xml|res/mipmap-anydpi-v26/.+ic_launcher_liveasta" || exit 1
          unzip -l "$APK" | grep -E "res/mipmap-nodpi(-v4)?/ic_launcher_liveasta\.png|res/mipmap-nodpi(-v4)?/.+ic_launcher_liveasta" || exit 1

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Liveasta.apk

      - name: Upload Liveasta APK
        uses: actions/upload-artifact@v4
        with:
          name: Liveasta-APK
          path: Liveasta.apk
          if-no-files-found: error
          retention-days: 14

