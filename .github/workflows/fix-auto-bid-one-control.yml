name: Fix auto bid one control
on:
  push:
    paths:
      - '.github/workflows/fix-auto-bid-one-control.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch control markup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('<label class="mg-inline-setting nomination-auto-bid-one-option">')
          end=s.index('<div class="nomination-turn-nav',start)
          block=s[start:end]
          block=block.replace('<label class="mg-inline-setting nomination-auto-bid-one-option">','<div class="mg-inline-setting nomination-auto-bid-one-option">',1)
          block=block.replace('<span class="mg-switch-label">','<label class="mg-switch-label" for="nomination-auto-bid-one">',1)
          marker='<span class="mg-switch-ui" aria-hidden="true"></span>'
          pos=block.index(marker)+len(marker)
          close_span=block.index('</span>',pos)
          block=block[:close_span]+'</label>'+block[close_span+7:]
          outer_close=block.rfind('</label>')
          if outer_close<0:
              raise SystemExit('outer label close not found')
          block=block[:outer_close]+'</div>'+block[outer_close+8:]
          s=s[:start]+block+s[end:]
          p.write_text(s)
          PY
      - name: Validate and commit
        run: |
          grep -q '<div class="mg-inline-setting nomination-auto-bid-one-option">' index.html
          grep -q '<label class="mg-switch-label" for="nomination-auto-bid-one">' index.html
          git config user.name liveasta-release-bot
          git config user.email liveasta-release-bot@users.noreply.github.com
          git add index.html
          git rm .github/workflows/fix-auto-bid-one-control.yml
          git commit -m 'Fix Offerta 1 banditore switch interaction'
          git push
