name: LIVEASTA DEV clean09 canonical player PIN access
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean09-player-pin.yml'
permissions:
  contents: write
jobs:
  clean09:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate player PIN access into canonical app logic
        run: python .github/clean09.py
      - name: Validate application sources
        run: |
          for f in dev/scripts/*.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          app=Path('dev/scripts/app.js').read_text(encoding='utf-8')
          mg=Path('dev/scripts/management.js').read_text(encoding='utf-8')
          assert app.count('function toggleAuctioneerPlayerMode') == 1, 'toggle owner count mismatch'
          assert 'protectBanditorePlayerMode' not in mg, 'legacy wrapper still present'
          assert 'verifyPlayerPinAccess' in app, 'canonical PIN verifier missing'
          print('JS ownership checks: OK')
          PY
      - name: Commit and self-remove workflow
        run: |
          rm -f .github/workflows/liveasta-clean09-player-pin.yml .github/clean09.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev .github/workflows/liveasta-clean09-player-pin.yml .github/clean09.py
          git commit -m "LIVEASTA DEV v0.94 clean09 canonical player PIN access"
          git push