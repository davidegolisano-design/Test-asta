name: Apply v0.81 desktop theme cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v081-desktop-theme.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable v0.81 stylesheet and bump version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for old in ('v0.80','V0.80'):
              s=s.replace(old,'v0.81' if old[0]=='v' else 'V0.81')
          tag='<link rel="stylesheet" href="./auctioneer-desktop-theme-v081.css">'
          if tag not in s:
              s=s.replace('</head>',tag+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "v0.81 enable coherent desktop auctioneer theming"
            git push
          fi
