name: LIVEASTA DEV clean38 css hotspot audit
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean38-css-hotspot-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: npm install --no-save postcss
      - name: Run CLEAN-38 audit
        run: node dev/tools/clean38_css_hotspots.mjs
      - name: Commit report and self-remove
        run: |
          rm -f .github/workflows/liveasta-clean38-css-hotspot-audit.yml dev/tools/clean38_css_hotspots.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/CLEANUP_AUDIT_CLEAN38_CSS_HOTSPOTS.txt .github/workflows/liveasta-clean38-css-hotspot-audit.yml dev/tools/clean38_css_hotspots.mjs
          git commit -m "LIVEASTA DEV clean38 css hotspot audit"
          git push
