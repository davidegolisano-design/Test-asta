name: Fix random role and free turn picker
on:
  push:
    paths:
      - '.github/workflows/fix-random-role-turn-free.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/fix_random_role_turn_free.py
      - name: Validate
        run: |
          node --check scripts/list-filters.js
          node --check scripts/mantra-auction.js
      - name: Commit
        run: |
          git config user.name 'liveasta-release-bot'
          git config user.email 'liveasta-release-bot@users.noreply.github.com'
          git add scripts/list-filters.js scripts/mantra-auction.js index.html
          git rm .github/fix_random_role_turn_free.py .github/workflows/fix-random-role-turn-free.yml
          git commit -m 'Fix automatic random role filters and free-turn picker'
          git push