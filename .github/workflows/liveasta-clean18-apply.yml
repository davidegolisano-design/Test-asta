name: LIVEASTA DEV clean18 orphan CSS branch cleanup
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean18-apply.yml'
permissions:
  contents: write
jobs:
  clean18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CLEAN-18
        run: python .github/clean18_apply.py
      - name: Validate application sources
        run: |
          for f in dev/scripts/*.js; do node --check "$f"; done
          grep -q 'CLEAN-18' dev/index.html
          ! grep -q 'v090-menu-header' dev/styles/ui.css
      - name: Commit and self-remove temporary files
        run: |
          rm -f .github/clean18_apply.py .github/workflows/liveasta-clean18-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev .github/clean18_apply.py .github/workflows/liveasta-clean18-apply.yml
          git commit -m "LIVEASTA DEV v0.94 clean18 remove orphan management CSS branch"
          git push
