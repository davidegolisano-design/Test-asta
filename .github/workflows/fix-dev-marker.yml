name: Fix LIVEASTA DEV marker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-dev-marker.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make DEV marker static and bust DEV asset cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('dev/index.html')
          s=p.read_text(encoding='utf-8',errors='ignore')

          marker='''<div id="liveasta-dev-static-marker" style="width:100%;box-sizing:border-box;margin:0 0 16px;padding:11px 12px;border:2px solid #ffb300;border-radius:12px;background:#332400;color:#ffd54f;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:900;letter-spacing:.04em;line-height:1.2;box-shadow:0 0 0 2px rgba(255,179,0,.12) inset;"><strong style="display:block;font-size:14px;">⚠ AMBIENTE DEV · v0.94 CLEAN-02</strong><span style="display:block;margin-top:4px;font-size:11px;letter-spacing:.09em;color:#fff3c4;">NON È LA VERSIONE PUBBLICA</span></div>'''

          if 'liveasta-dev-static-marker' not in s:
              needle='<div class="setup-card">'
              if needle not in s:
                  raise SystemExit('Home setup-card not found')
              s=s.replace(needle, needle+'\n            '+marker, 1)

          s=s.replace('<title>LIVEASTA DEV CLEAN</title>','<title>LIVEASTA DEV · v0.94 CLEAN-02</title>')

          token='094-clean02c'
          s=re.sub(r'(href="\./styles/[^"?]+\.css)(?:\?[^\"]*)?(\")', rf'\1?dev={token}\2', s)
          s=re.sub(r'(src="\./scripts/[^"?]+\.js)(?:\?[^\"]*)?(\")', rf'\1?dev={token}\2', s)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate DEV marker
        run: |
          grep -q 'AMBIENTE DEV' dev/index.html
          grep -q 'NON È LA VERSIONE PUBBLICA' dev/index.html
          grep -q '094-clean02c' dev/index.html

      - name: Commit DEV patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-dev-marker.yml
          git add -A dev/index.html .github/workflows/fix-dev-marker.yml
          git diff --cached --quiet || (git commit -m "Make LIVEASTA DEV marker static and bust cache" && git push)
