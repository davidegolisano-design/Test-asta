name: LIVEASTA management UI normalization

on:
  push:
    paths:
      - '.github/workflows/liveasta-management-v2.yml'

permissions:
  contents: write

jobs:
  normalize-management:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build management visual system
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css = r'''/* LIVEASTA DEV · Management visual system v1
             Scope: screen-room-control only. Functional/semantic colors remain explicit where needed. */

          #screen-room-control.mg-system {
            --mg-bg: var(--theme-bg, var(--bg-main));
            --mg-card: var(--theme-card, var(--bg-card));
            --mg-panel: var(--theme-panel, var(--bg-hover));
            --mg-hover: var(--theme-hover, var(--bg-hover));
            --mg-input: var(--theme-input, var(--bg-main));
            --mg-border: var(--theme-border, var(--border-color));
            --mg-text: var(--theme-text, var(--text-main));
            --mg-muted: var(--theme-muted, var(--text-muted));
            --mg-soft: var(--theme-soft, var(--text-muted));
            --mg-primary: var(--theme-primary, var(--accent-blue));
            --mg-primary-hover: var(--theme-primary-hover, var(--accent-blue-hover));
            --mg-danger: var(--theme-danger, var(--accent-red));
            height: 100dvh !important;
            min-height: 0 !important;
            max-height: 100dvh !important;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            align-items: stretch !important;
            justify-content: flex-start !important;
            padding: 0 !important;
            background: var(--mg-bg) !important;
            color: var(--mg-text) !important;
            scrollbar-gutter: stable;
          }

          #screen-room-control.mg-system .control-grid {
            display: grid !important;
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            grid-auto-rows: max-content !important;
            align-content: start !important;
            align-items: start !important;
            gap: 14px !important;
            width: 100% !important;
            max-width: 1280px !important;
            height: auto !important;
            min-height: 0 !important;
            margin: 0 auto !important;
            padding: 18px 20px 34px !important;
            box-sizing: border-box !important;
            overflow: visible !important;
          }

          #screen-room-control.mg-system .control-grid > .control-title {
            order: 0;
            grid-column: 1 / -1 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            flex-wrap: wrap !important;
            gap: 12px !important;
            position: sticky !important;
            top: 0 !important;
            z-index: 20 !important;
            margin: 0 !important;
            padding: 14px 16px !important;
            background: color-mix(in srgb, var(--mg-card) 94%, transparent) !important;
            border: 1px solid var(--mg-border) !important;
            border-radius: 14px !important;
            backdrop-filter: blur(10px);
            box-sizing: border-box !important;
          }

          #screen-room-control.mg-system .control-grid > .control-title h1 {
            margin: 0 !important;
            color: var(--mg-text) !important;
            font-size: 20px !important;
            line-height: 1.2 !important;
            letter-spacing: 0 !important;
            text-transform: none !important;
          }

          #screen-room-control.mg-system #control-room-pill {
            margin-top: 5px !important;
            color: var(--mg-muted) !important;
          }

          #screen-room-control.mg-system .control-grid > .control-title .toolbar-row {
            display: flex !important;
            flex-wrap: wrap !important;
            justify-content: flex-end !important;
            gap: 7px !important;
            width: auto !important;
            margin: 0 !important;
          }

          #screen-room-control.mg-system .mg-section-label {
            grid-column: 1 / -1 !important;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px;
            min-width: 0;
            padding: 10px 2px 0;
            text-align: left;
            color: var(--mg-text);
          }
          #screen-room-control.mg-system .mg-section-label strong {
            font-size: 12px;
            line-height: 1.2;
            letter-spacing: .10em;
            text-transform: uppercase;
          }
          #screen-room-control.mg-system .mg-section-label span {
            color: var(--mg-muted);
            font-size: 12px;
            line-height: 1.35;
            text-align: right;
          }
          #screen-room-control.mg-system .mg-section-room { order: 5; }
          #screen-room-control.mg-system .mg-section-auction { order: 15; }
          #screen-room-control.mg-system .mg-section-data { order: 29; }

          #screen-room-control.mg-system .control-card {
            min-width: 0 !important;
            margin: 0 !important;
            padding: 17px !important;
            background: var(--mg-card) !important;
            color: var(--mg-text) !important;
            border: 1px solid var(--mg-border) !important;
            border-radius: 14px !important;
            box-shadow: none !important;
            box-sizing: border-box !important;
            overflow: visible !important;
          }

          #screen-room-control.mg-system .room-rules-card { order: 10; grid-column: 1 / -1 !important; }
          #screen-room-control.mg-system .ready-control-card { order: 20; }
          #screen-room-control.mg-system .self-raise-control-card { order: 21; }
          #screen-room-control.mg-system .auto-random-control-card { order: 22; }
          #screen-room-control.mg-system .auctioneer-player-control-card { order: 23; }
          #screen-room-control.mg-system .nomination-control-card { order: 24; grid-column: 1 / -1 !important; }
          #screen-room-control.mg-system .online-players-card { order: 25; grid-column: 1 / -1 !important; }
          #screen-room-control.mg-system .teams-card { order: 30; grid-column: 1 / -1 !important; }
          #screen-room-control.mg-system .purchases-card { order: 31; grid-column: 1 / -1 !important; }

          #screen-room-control.mg-system .control-card > .control-title {
            display: flex !important;
            flex-direction: row !important;
            align-items: flex-start !important;
            justify-content: space-between !important;
            gap: 14px !important;
            margin: 0 0 12px !important;
            padding: 0 !important;
            background: transparent !important;
            border: 0 !important;
          }
          #screen-room-control.mg-system .control-card > .control-title > div:first-child {
            flex: 1 1 auto !important;
            min-width: 0 !important;
            width: auto !important;
          }
          #screen-room-control.mg-system .control-card h3 {
            margin: 0 !important;
            color: var(--mg-text) !important;
            font-family: Inter, system-ui, sans-serif !important;
            font-size: 16px !important;
            font-weight: 800 !important;
            line-height: 1.25 !important;
            letter-spacing: 0 !important;
            text-transform: none !important;
          }

          #screen-room-control.mg-system :is(
            .self-raise-control-note,
            .auctioneer-player-note,
            .ready-control-note,
            .auto-random-note,
            .nomination-control-note,
            .online-players-note,
            .audio-mixer-subtitle,
            .nomination-auto-bid-one-copy small,
            .nomination-order-head small
          ) {
            display: block !important;
            margin-top: 5px !important;
            color: var(--mg-muted) !important;
            font-size: 12px !important;
            font-weight: 500 !important;
            line-height: 1.45 !important;
            opacity: 1 !important;
          }

          #screen-room-control.mg-system :is(
            #self-raise-control-badge,
            #auctioneer-player-badge,
            #ready-control-badge,
            #nomination-control-badge
          ) { display: none !important; }

          #screen-room-control.mg-system .field-label {
            display: block !important;
            margin: 0 0 6px !important;
            min-height: 0 !important;
            color: var(--mg-muted) !important;
            font-size: 12px !important;
            font-weight: 650 !important;
            line-height: 1.3 !important;
            letter-spacing: 0 !important;
            text-transform: none !important;
          }

          #screen-room-control.mg-system :is(input:not([type=checkbox]):not([type=range]), select, textarea, .minimal-input) {
            box-sizing: border-box !important;
            width: 100% !important;
            min-width: 0 !important;
            max-width: 100% !important;
            min-height: 44px !important;
            height: 44px !important;
            margin: 0 !important;
            padding: 9px 11px !important;
            background: var(--mg-input) !important;
            color: var(--mg-text) !important;
            border: 1px solid var(--mg-border) !important;
            border-radius: 9px !important;
            box-shadow: none !important;
            font: 600 14px/1.25 Inter, system-ui, sans-serif !important;
            text-align: left !important;
          }
          #screen-room-control.mg-system textarea { height: auto !important; min-height: 82px !important; }
          #screen-room-control.mg-system :is(input, select, textarea, button):focus-visible {
            outline: 2px solid var(--mg-primary) !important;
            outline-offset: 2px !important;
          }

          #screen-room-control.mg-system .room-rules-card .setup-grid {
            display: grid !important;
            grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
            gap: 12px !important;
            margin: 14px 0 !important;
          }
          #screen-room-control.mg-system .room-rules-card .setup-grid > div { min-width: 0 !important; }
          #screen-room-control.mg-system .setup-grid-4 {
            display: grid !important;
            grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
            gap: 12px !important;
            margin: 12px 0 !important;
          }
          #screen-room-control.mg-system .room-system-badge-row { margin: 12px 0 6px !important; }

          #screen-room-control.mg-system .btn {
            box-sizing: border-box !important;
            width: auto !important;
            min-height: 42px !important;
            height: auto !important;
            margin: 0 !important;
            padding: 9px 12px !important;
            background: var(--mg-hover) !important;
            color: var(--mg-text) !important;
            border: 1px solid var(--mg-border) !important;
            border-radius: 9px !important;
            box-shadow: none !important;
            font: 800 12px/1.25 Inter, system-ui, sans-serif !important;
            letter-spacing: 0 !important;
            text-transform: none !important;
            white-space: normal !important;
            transition: transform .08s ease, background-color .12s ease, border-color .12s ease !important;
            -webkit-tap-highlight-color: transparent;
          }
          #screen-room-control.mg-system .btn:hover:not(:disabled) {
            background: color-mix(in srgb, var(--mg-primary) 10%, var(--mg-hover)) !important;
            border-color: color-mix(in srgb, var(--mg-primary) 50%, var(--mg-border)) !important;
          }
          #screen-room-control.mg-system .btn:active:not(:disabled) {
            transform: translateY(1px) scale(.985) !important;
            box-shadow: none !important;
          }
          #screen-room-control.mg-system :is(.btn-green, button[onclick="saveRoomConfig()"], .manual-assign-btn, .control-action-csv) {
            background: var(--mg-primary) !important;
            color: var(--theme-bg-deep, #101418) !important;
            border-color: var(--mg-primary) !important;
          }
          #screen-room-control.mg-system :is(.btn-green, button[onclick="saveRoomConfig()"], .manual-assign-btn, .control-action-csv):hover:not(:disabled) {
            background: var(--mg-primary-hover) !important;
            border-color: var(--mg-primary-hover) !important;
          }
          #screen-room-control.mg-system :is(.btn-danger, .control-action-reset) {
            background: color-mix(in srgb, var(--mg-danger) 15%, var(--mg-card)) !important;
            color: var(--mg-danger) !important;
            border-color: color-mix(in srgb, var(--mg-danger) 45%, var(--mg-border)) !important;
          }
          #screen-room-control.mg-system button:disabled {
            background: var(--mg-hover) !important;
            color: var(--mg-soft) !important;
            border-color: var(--mg-border) !important;
            opacity: .62 !important;
            transform: none !important;
          }

          #screen-room-control.mg-system .control-grid > .control-title .toolbar-row .btn {
            min-height: 40px !important;
            padding: 8px 11px !important;
          }

          /* Canonical ON/OFF control used by READY, autorilancio, banditore giocatore and turn nomination. */
          #screen-room-control.mg-system .mg-state-switch {
            position: relative !important;
            display: block !important;
            flex: 0 0 54px !important;
            width: 54px !important;
            min-width: 54px !important;
            max-width: 54px !important;
            height: 32px !important;
            min-height: 32px !important;
            max-height: 32px !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            background: color-mix(in srgb, var(--mg-muted) 32%, var(--mg-hover)) !important;
            color: transparent !important;
            border: 1px solid var(--mg-border) !important;
            border-radius: 999px !important;
            box-shadow: none !important;
            font-size: 0 !important;
            line-height: 0 !important;
            cursor: pointer !important;
          }
          #screen-room-control.mg-system .mg-state-switch::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--mg-card);
            box-shadow: 0 1px 4px rgba(0,0,0,.28);
            transition: transform .16s ease, background-color .16s ease;
          }
          #screen-room-control.mg-system .mg-state-switch[aria-checked="true"] {
            background: var(--mg-primary) !important;
            border-color: var(--mg-primary) !important;
          }
          #screen-room-control.mg-system .mg-state-switch[aria-checked="true"]::after {
            transform: translateX(22px);
            background: var(--theme-bg-deep, #101418);
          }
          #screen-room-control.mg-system .mg-state-switch > * { display: none !important; }
          #screen-room-control.mg-system .mg-state-switch:active:not(:disabled) { transform: scale(.96) !important; }

          /* AUTO RANDOM master switch uses its existing checkbox but the same visual grammar. */
          #screen-room-control.mg-system .auto-random-master-switch.mg-state-switch-wrap {
            position: relative !important;
            display: block !important;
            flex: 0 0 54px !important;
            width: 54px !important;
            min-width: 54px !important;
            height: 32px !important;
            min-height: 32px !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            background: color-mix(in srgb, var(--mg-muted) 32%, var(--mg-hover)) !important;
            border: 1px solid var(--mg-border) !important;
            border-radius: 999px !important;
            cursor: pointer !important;
          }
          #screen-room-control.mg-system .auto-random-master-switch.mg-state-switch-wrap > input {
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            opacity: 0 !important;
            cursor: pointer !important;
          }
          #screen-room-control.mg-system .auto-random-master-switch.mg-state-switch-wrap > span { display: none !important; }
          #screen-room-control.mg-system .auto-random-master-switch.mg-state-switch-wrap::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--mg-card);
            box-shadow: 0 1px 4px rgba(0,0,0,.28);
            pointer-events: none;
            transition: transform .16s ease, background-color .16s ease;
          }
          #screen-room-control.mg-system .auto-random-master-switch.mg-state-switch-wrap:has(input:checked) {
            background: var(--mg-primary) !important;
            border-color: var(--mg-primary) !important;
          }
          #screen-room-control.mg-system .auto-random-master-switch.mg-state-switch-wrap:has(input:checked)::after {
            transform: translateX(22px);
            background: var(--theme-bg-deep, #101418);
          }

          /* Inline option switch: Offerta 1 banditore. */
          #screen-room-control.mg-system .nomination-auto-bid-one-option {
            display: flex !important;
            flex-direction: row-reverse !important;
            align-items: center !important;
            justify-content: space-between !important;
            gap: 14px !important;
            margin: 12px 0 !important;
            padding: 11px 12px !important;
            background: var(--mg-input) !important;
            border: 1px solid var(--mg-border) !important;
            border-radius: 10px !important;
          }
          #screen-room-control.mg-system #nomination-auto-bid-one {
            appearance: none !important;
            -webkit-appearance: none !important;
            position: relative !important;
            flex: 0 0 48px !important;
            width: 48px !important;
            min-width: 48px !important;
            height: 28px !important;
            min-height: 28px !important;
            margin: 0 !important;
            padding: 0 !important;
            background: color-mix(in srgb, var(--mg-muted) 32%, var(--mg-hover)) !important;
            border: 1px solid var(--mg-border) !important;
            border-radius: 999px !important;
            cursor: pointer !important;
          }
          #screen-room-control.mg-system #nomination-auto-bid-one::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--mg-card) !important;
            box-shadow: 0 1px 3px rgba(0,0,0,.25);
            transition: transform .16s ease;
          }
          #screen-room-control.mg-system #nomination-auto-bid-one:checked {
            background: var(--mg-primary) !important;
            border-color: var(--mg-primary) !important;
          }
          #screen-room-control.mg-system #nomination-auto-bid-one:checked::after {
            transform: translateX(20px);
            background: var(--theme-bg-deep, #101418) !important;
          }

          #screen-room-control.mg-system .self-raise-control-row {
            display: block !important;
            margin-top: 2px !important;
          }
          #screen-room-control.mg-system #self-raise-enabled { display: none !important; }

          #screen-room-control.mg-system :is(
            .self-raise-control-status,
            .auctioneer-player-status,
            .ready-control-status,
            .nomination-control-status,
            .auto-random-status
          ) {
            display: block !important;
            margin: 10px 0 0 !important;
            padding: 9px 10px !important;
            background: var(--mg-input) !important;
            color: var(--mg-muted) !important;
            border: 1px solid var(--mg-border) !important;
            border-radius: 9px !important;
            font-size: 12px !important;
            line-height: 1.4 !important;
          }

          #screen-room-control.mg-system .auctioneer-player-control-row {
            display: block !important;
            margin-top: 12px !important;
          }
          #screen-room-control.mg-system .auctioneer-player-control-row > div { width: 100% !important; }

          /* Random roles are choices, not generic switches: keep P/D/C/A semantic colors. */
          #screen-room-control.mg-system .auto-random-role-grid {
            display: grid !important;
            grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
            gap: 8px !important;
            margin: 12px 0 0 !important;
          }
          #screen-room-control.mg-system .auto-random-role {
            position: relative !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            min-height: 44px !important;
            padding: 7px !important;
            background: var(--mg-input) !important;
            border: 1px solid var(--mg-border) !important;
            border-radius: 9px !important;
            cursor: pointer !important;
            overflow: hidden !important;
          }
          #screen-room-control.mg-system .auto-random-role > input {
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            opacity: 0 !important;
            cursor: pointer !important;
          }
          #screen-room-control.mg-system .auto-random-role > span {
            position: relative;
            z-index: 1;
            font-size: 14px !important;
            font-weight: 900 !important;
            line-height: 1 !important;
          }
          #screen-room-control.mg-system .auto-random-role.role-P > span { color: #EAB308 !important; }
          #screen-room-control.mg-system .auto-random-role.role-D > span { color: #22C55E !important; }
          #screen-room-control.mg-system .auto-random-role.role-C > span { color: #3B82F6 !important; }
          #screen-room-control.mg-system .auto-random-role.role-A > span { color: #EF4444 !important; }
          #screen-room-control.mg-system .auto-random-role:has(input:checked) {
            border-color: var(--mg-primary) !important;
            background: color-mix(in srgb, var(--mg-primary) 11%, var(--mg-input)) !important;
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--mg-primary) 45%, transparent) !important;
          }

          #screen-room-control.mg-system .nomination-turn-nav,
          #screen-room-control.mg-system .nomination-control-actions {
            display: grid !important;
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            gap: 8px !important;
            margin-top: 10px !important;
          }
          #screen-room-control.mg-system .nomination-turn-nav .btn,
          #screen-room-control.mg-system .nomination-control-actions .btn { width: 100% !important; }

          #screen-room-control.mg-system .nomination-order-box {
            margin-top: 12px !important;
            padding: 12px !important;
            background: var(--mg-input) !important;
            border: 1px solid var(--mg-border) !important;
            border-radius: 10px !important;
          }
          #screen-room-control.mg-system .nomination-order-head {
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            gap: 10px !important;
            margin-bottom: 10px !important;
          }
          #screen-room-control.mg-system .nomination-order-list {
            display: flex !important;
            flex-direction: column !important;
            gap: 8px !important;
            max-height: none !important;
            overflow: visible !important;
          }
          #screen-room-control.mg-system .nomination-order-row {
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            gap: 10px !important;
            min-height: 44px !important;
            background: var(--mg-card) !important;
            color: var(--mg-text) !important;
            border: 1px solid var(--mg-border) !important;
            border-radius: 9px !important;
          }
          #screen-room-control.mg-system .nomination-order-row.current {
            border-color: var(--mg-primary) !important;
            background: color-mix(in srgb, var(--mg-primary) 9%, var(--mg-card)) !important;
          }

          #screen-room-control.mg-system .online-player-list {
            margin-top: 8px !important;
            min-height: 36px !important;
            height: auto !important;
          }

          #screen-room-control.mg-system .team-create-row {
            display: grid !important;
            grid-template-columns: minmax(0, 1fr) auto !important;
            gap: 8px !important;
            margin: 12px 0 !important;
          }
          #screen-room-control.mg-system .team-create-row .btn { min-width: 160px !important; }

          #screen-room-control.mg-system .control-table-wrap {
            width: 100% !important;
            max-width: 100% !important;
            overflow-x: auto !important;
            border: 1px solid var(--mg-border) !important;
            border-radius: 10px !important;
            background: var(--mg-input) !important;
          }
          #screen-room-control.mg-system .control-table {
            width: 100% !important;
            font-size: 13px !important;
          }
          #screen-room-control.mg-system .control-table th {
            color: var(--mg-muted) !important;
            font-size: 11px !important;
            letter-spacing: .04em !important;
          }

