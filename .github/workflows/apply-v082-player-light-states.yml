name: Apply v0.82 player light states

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v082-player-light-states.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable v0.82 stylesheet and bump version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('v0.81','v0.82').replace('V0.81','V0.82')
          old='<script src="./player-light-states-v080.js"></script>'
          s=s.replace(old,'')
          tag='<link rel="stylesheet" href="./player-light-states-v082.css">'
          if tag not in s:
              s=s.replace('</head>',tag+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "v0.82 fix player win lose colors on light themes"
            git push
          fi
