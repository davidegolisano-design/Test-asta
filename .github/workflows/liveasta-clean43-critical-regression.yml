name: LIVEASTA DEV clean43 critical regression
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean43-critical-regression.yml'
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Validate JavaScript syntax
        run: for f in dev/scripts/*.js; do node --check "$f"; done
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/liveasta-http.log 2>&1 &
          sleep 2
      - name: General browser smoke
        run: node dev/tests/smoke.mjs
      - name: Shared module regression
        run: node dev/tests/regression-smoke.mjs
      - name: Team economics regression
        run: node dev/tests/team-logic-smoke.mjs
      - name: Timer settings regression
        run: node dev/tests/timer-settings-smoke.mjs
      - name: List filters regression
        run: node dev/tests/list-filters-smoke.mjs
      - name: Critical auction rules regression
        run: node dev/tests/auction-rules-smoke.mjs
      - name: Write report and self-remove
        run: |
          cat > dev/CLEANUP_REPORT_CLEAN43_CRITICAL_REGRESSION.txt <<'EOF'
          LIVEASTA CLEAN-43 - CRITICAL BEHAVIOR REGRESSION
          =================================================
          No application code changed.

          Passed browser suites:
           - general home/access smoke
           - shared extracted modules
           - team counts and max-bid economics (Classic/Mantra)
           - room timer settings and clamps
           - list filters/sorting (Classic/Mantra)
           - READY/SKIP eligibility and resolution
           - all SKIP => unsold at 0
           - mixed READY/SKIP => auction starts for all eligible teams
           - sealed READY resolution
           - normal bid max boundary and full-role block
           - self-raise disabled block
           - nomination eligibility Classic/Mantra

          Network/Supabase writes were not used by the critical-rule test.
          EOF
          rm -f .github/workflows/liveasta-clean43-critical-regression.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/tests/auction-rules-smoke.mjs dev/CLEANUP_REPORT_CLEAN43_CRITICAL_REGRESSION.txt .github/workflows/liveasta-clean43-critical-regression.yml
          git commit -m "LIVEASTA DEV clean43 critical behavior regression"
          git push
