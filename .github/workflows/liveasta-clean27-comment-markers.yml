name: LIVEASTA DEV clean27 comment marker cleanup
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean27-comment-markers.yml'
permissions:
  contents: write
jobs:
  clean27:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parsers and Playwright
        run: |
          npm install --no-save espree postcss playwright
          npx playwright install --with-deps chromium
      - name: Apply CLEAN-27 comment cleanup
        run: node dev/tools/clean27_comment_markers.mjs
      - name: Validate sources
        run: |
          for f in dev/scripts/*.js; do node --check "$f"; done
          grep -q 'CLEAN-27' dev/index.html
          grep -q '094-clean27a' dev/index.html
          test -s dev/CLEANUP_REPORT_CLEAN27_COMMENT_MARKERS.txt
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/liveasta-http.log 2>&1 &
          sleep 2
      - name: Run browser smoke
        run: node dev/tests/smoke.mjs
      - name: Commit and self-remove temporary files
        run: |
          rm -f .github/workflows/liveasta-clean27-comment-markers.yml dev/tools/clean27_comment_markers.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/index.html dev/scripts dev/styles dev/CLEANUP_REPORT_CLEAN27_COMMENT_MARKERS.txt .github/workflows/liveasta-clean27-comment-markers.yml dev/tools/clean27_comment_markers.mjs
          git commit -m "LIVEASTA DEV clean27 normalize legacy version comments"
          git push
