name: LIVEASTA DEV clean24 extract roles
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean24-extract-roles.yml'
permissions:
  contents: write
jobs:
  clean24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Apply CLEAN-24 role extraction
        run: node dev/tools/clean24_extract_roles.mjs
      - name: Validate JavaScript and ownership
        run: |
          for f in dev/scripts/*.js; do node --check "$f"; done
          grep -q 'scripts/roles.js?dev=094-clean24a' dev/index.html
          grep -q 'const MANTRA_ROLE_ORDER' dev/scripts/roles.js
          grep -q 'function normalizeMantraRole' dev/scripts/roles.js
          grep -q 'function playerRole' dev/scripts/roles.js
          ! grep -q 'const MANTRA_ROLE_ORDER' dev/scripts/app.js
          ! grep -q 'function normalizeMantraRole' dev/scripts/app.js
          grep -q 'function updateCreateRoomModeUI' dev/scripts/app.js
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/liveasta-http.log 2>&1 &
          sleep 2
      - name: Run general browser smoke
        run: node dev/tests/smoke.mjs
      - name: Run role domain browser smoke
        run: |
          cat > dev/tests/clean24-roles-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173/dev/index.html?roles-smoke=1',{waitUntil:'domcontentloaded'});
          await page.waitForTimeout(1000);
          const result=await page.evaluate(()=>{
            const functions=['roomGameMode','isMantraRoom','normalizeMantraRole','mantraRoleTokens','mantraRoleFromPlayer','playerRole','playerIsGoalkeeper','mantraRosterMax','mantraRosterMin','mantraMinGoalkeepers','listoneHasMantraRoles','activeRoleLabel','mantraRoleMatches'];
            const missing=functions.filter(n=>typeof window[n]!=='function');
            const old=currentRoom;
            currentRoom={game_mode:'mantra'};
            const mantraMatch=mantraRoleMatches({RM:'Dc;B',R:'D'},'Dc');
            const mantraActive=activeRoleLabel('dc / p');
            currentRoom=old;
            return {
              missing,
              order:MANTRA_ROLE_ORDER.join(','),
              classicMode:roomGameMode({game_mode:'classic'}),
              mantraMode:roomGameMode({game_mode:'MANTRA'}),
              normalized:normalizeMantraRole(' p / DC ; w '),
              tokens:mantraRoleTokens('Por;Dc;W'),
              fromPlayer:mantraRoleFromPlayer({'Ruolo Mantra':'dc / m'}),
              classicRole:playerRole({R:'d'},{game_mode:'classic'}),
              mantraRole:playerRole({R:'D',RM:'dc / b'},{game_mode:'mantra'}),
              classicGK:playerIsGoalkeeper('P',{game_mode:'classic'}),
              mantraGK:playerIsGoalkeeper('Por',{game_mode:'mantra'}),
              maxDefault:mantraRosterMax({}), maxLow:mantraRosterMax({mantra_max_roster:1}), maxHigh:mantraRosterMax({mantra_max_roster:200}),
              minDefault:mantraRosterMin({}), minLow:mantraRosterMin({mantra_min_roster:1}), minHigh:mantraRosterMin({mantra_min_roster:200}),
              gkDefault:mantraMinGoalkeepers({}), gkLow:mantraMinGoalkeepers({mantra_min_goalkeepers:1}), gkHigh:mantraMinGoalkeepers({mantra_min_goalkeepers:99}),
              listone:listoneHasMantraRoles([{R:'D'},{RM:'Dc'}]),
              mantraMatch,mantraActive
            };
          });
          if(result.missing.length) throw new Error('Missing role functions: '+result.missing.join(','));
          if(result.order!=='Por,Dc,B,Dd,Ds,E,M,C,W,T,A,Pc') throw new Error('Role order changed');
          if(result.classicMode!=='classic'||result.mantraMode!=='mantra') throw new Error('Game mode normalization changed');
          if(result.normalized!=='Por;Dc;W') throw new Error('Mantra normalization changed: '+result.normalized);
          if(result.tokens.join('|')!=='Por|Dc|W') throw new Error('Tokenization changed');
          if(result.fromPlayer!=='Dc;M') throw new Error('Player mantra field parsing changed');
          if(result.classicRole!=='D'||result.mantraRole!=='Dc;B') throw new Error('Player role resolution changed');
          if(!result.classicGK||!result.mantraGK) throw new Error('Goalkeeper recognition changed');
          if(result.maxDefault!==30||result.maxLow!==23||result.maxHigh!==90) throw new Error('Mantra max roster clamp changed');
          if(result.minDefault!==23||result.minLow!==23||result.minHigh!==90) throw new Error('Mantra min roster clamp changed');
          if(result.gkDefault!==2||result.gkLow!==2||result.gkHigh!==15) throw new Error('Goalkeeper minimum clamp changed');
          if(!result.listone||!result.mantraMatch||result.mantraActive!=='Dc;Por') throw new Error('Mantra helper behavior changed');
          if(errors.length) throw new Error('Page errors: '+errors.join(' | '));
          console.log('LIVEASTA role domain browser smoke: OK');
          await browser.close();
          EOF
          node dev/tests/clean24-roles-smoke.mjs
      - name: Commit and self-remove temporary files
        run: |
          rm -f dev/tests/clean24-roles-smoke.mjs
          rm -f .github/workflows/liveasta-clean24-extract-roles.yml dev/tools/clean24_extract_roles.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/index.html dev/scripts/app.js dev/scripts/roles.js dev/CLEANUP_REPORT_CLEAN24_ROLES.txt .github/workflows/liveasta-clean24-extract-roles.yml dev/tools/clean24_extract_roles.mjs
          git commit -m "LIVEASTA DEV clean24 extract role domain module"
          git push
