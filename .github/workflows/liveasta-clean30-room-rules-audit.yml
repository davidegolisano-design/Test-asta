name: LIVEASTA DEV clean30 room rules audit
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean30-room-rules-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: npm install --no-save espree
      - name: Run CLEAN-30 room rules audit
        run: node dev/tools/clean30_room_rules_audit.mjs
      - name: Validate sources
        run: |
          for f in dev/scripts/*.js; do node --check "$f"; done
          test -s dev/CLEANUP_AUDIT_CLEAN30_ROOM_RULES.txt
      - name: Commit report and self-remove
        run: |
          rm -f .github/workflows/liveasta-clean30-room-rules-audit.yml dev/tools/clean30_room_rules_audit.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/CLEANUP_AUDIT_CLEAN30_ROOM_RULES.txt .github/workflows/liveasta-clean30-room-rules-audit.yml dev/tools/clean30_room_rules_audit.mjs
          git commit -m "LIVEASTA DEV clean30 room rules dependency audit"
          git push
