name: LIVEASTA DEV clean41 final structure audit
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean41-final-structure-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parsers
        run: npm install --no-save espree postcss
      - name: Run CLEAN-41 final structure audit
        run: node dev/tools/clean41_final_structure_audit.mjs
      - name: Validate JavaScript syntax
        run: for f in dev/scripts/*.js; do node --check "$f"; done
      - name: Commit report and self-remove
        run: |
          rm -f .github/workflows/liveasta-clean41-final-structure-audit.yml dev/tools/clean41_final_structure_audit.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/CLEANUP_AUDIT_CLEAN41_FINAL_STRUCTURE.txt .github/workflows/liveasta-clean41-final-structure-audit.yml dev/tools/clean41_final_structure_audit.mjs
          git commit -m "LIVEASTA DEV clean41 final structure audit"
          git push
