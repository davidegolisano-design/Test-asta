name: Fix auto random strict sequence and nomination close
on:
  push:
    paths:
      - '.github/workflows/fix-auto-random-sequence-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/fix-auto-random-sequence-v2.py
      - name: Validate
        run: |
          node --check scripts/app.js
          grep -q "autoRandomClassicCurrentSequenceRole" scripts/app.js
          grep -q "nomination-close-btn" index.html
          grep -q "v1.0.115" styles/ui.css
      - name: Commit
        run: |
          git config user.name 'liveasta-release-bot'
          git config user.email 'liveasta-release-bot@users.noreply.github.com'
          git add index.html scripts/app.js styles/ui.css
          git rm .github/fix-auto-random-sequence-v2.py .github/workflows/fix-auto-random-sequence-v2.yml
          git commit -m 'Enforce strict auto random role sequence and fix picker close'
          git push
