name: LIVEASTA visual audit artifact
on:
  push:
    paths:
      - '.github/workflows/liveasta-visual-artifact.yml'
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: liveasta-visual-audit
          path: dev/visual-audit/contact-sheet.jpg
          if-no-files-found: error
