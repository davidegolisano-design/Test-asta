name: LIVEASTA DEV clean11 access flow audit
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean11-access-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit access function ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          names=['openPlayerLobby','openAuctioneerAccess','openPlayerAccess','setAuctioneerRoomMode','resetAuctioneerRoomMode','playerAccessWizardBack','playerAccessWizardNext','auctionAccessWizardBack','auctionAccessWizardNext']
          out=['LIVEASTA CLEAN-11 ACCESS FLOW AUDIT','=================================','No application behavior changed.','']
          for path in sorted(Path('dev/scripts').glob('*.js')):
              txt=path.read_text(encoding='utf-8')
              hits=[]
              for name in names:
                  for m in re.finditer(r'(?m)^.*\b'+re.escape(name)+r'\b.*$',txt):
                      line=txt.count('\n',0,m.start())+1
                      s=m.group(0).strip()
                      if 'function' in s or 'window.'+name in s or name+'=' in s or 'const old' in s:
                          hits.append((line,name,s[:240]))
              if hits:
                  out.append(f'[{path.name}]')
                  for line,name,s in hits: out.append(f'{line}: {name}: {s}')
                  out.append('')
          Path('dev/CLEANUP_AUDIT_CLEAN11_ACCESS.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Validate sources
        run: |
          for f in dev/scripts/*.js; do node --check "$f"; done
      - name: Commit report and self-remove workflow
        run: |
          rm -f .github/workflows/liveasta-clean11-access-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/CLEANUP_AUDIT_CLEAN11_ACCESS.txt .github/workflows/liveasta-clean11-access-audit.yml
          git commit -m "Audit LIVEASTA DEV access flow ownership"
          git push