name: LIVEASTA visual package source
on:
  push:
    paths:
      - '.github/workflows/liveasta-visual-package-source.yml'
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: liveasta-visual-package-source
          path: |
            dev/visual-audit/contact-sheet.jpg
            dev/visual-audit/detail-contact-sheet.jpg
          if-no-files-found: error
