name: Build LIVEASTA APK
on:
  push:
    branches: [main]
    paths:
      - 'android/app/**'
      - 'android/*.gradle'
      - 'android/gradle.properties'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKMANAGER" --licenses || test "${PIPESTATUS[1]}" -eq 0
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Verify APK and launcher icons
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep -q 'ic_launcher_foreground.png'
          unzip -l "$APK" | grep -q 'mipmap-anydpi-v26/ic_launcher.xml'
      - uses: actions/upload-artifact@v4
        with:
          name: LIVEASTA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish APK
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p android/download
          cp android/app/build/outputs/apk/debug/app-debug.apk android/download/LIVEASTA.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/download/LIVEASTA.apk
          git commit -m 'Build LIVEASTA Android APK'
          git pull --rebase origin main
          git push origin HEAD:main
