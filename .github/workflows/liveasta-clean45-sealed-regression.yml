name: LIVEASTA DEV clean45 sealed regression
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean45-sealed-regression.yml'
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Validate JavaScript syntax
        run: for f in dev/scripts/*.js; do node --check "$f"; done
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/liveasta-http.log 2>&1 &
          sleep 2
      - name: General browser smoke
        run: node dev/tests/smoke.mjs
      - name: Shared module regression
        run: node dev/tests/regression-smoke.mjs
      - name: Team economics regression
        run: node dev/tests/team-logic-smoke.mjs
      - name: Timer settings regression
        run: node dev/tests/timer-settings-smoke.mjs
      - name: List filters regression
        run: node dev/tests/list-filters-smoke.mjs
      - name: Critical auction rules regression
        run: node dev/tests/auction-rules-smoke.mjs
      - name: Sealed auction rules regression
        run: node dev/tests/sealed-rules-smoke.mjs
      - name: Write report and self-remove
        run: |
          cat > dev/CLEANUP_REPORT_CLEAN45_SEALED_REGRESSION.txt <<'EOF'
          LIVEASTA CLEAN-45 - SEALED AUCTION REGRESSION
          ==============================================
          No application code changed.

          Existing regression suites passed plus sealed-auction characterization for:
           - sealed ranking order (amount, timestamp, stable original order)
           - Classic eligibility through maxBidForTeam
           - wrong token rejection
           - one definitive bid per team
           - over-max bid rejection
           - early close when all eligible teams delivered
           - late bid rejection after authority deadline
           - top tie isolation for next tie-break round
           - zero-bid immediate finalize without reveal countdown

          Final Supabase RPC assignment is intentionally not mocked as proof of end-to-end success; it remains a live integration check.
          EOF
          rm -f .github/workflows/liveasta-clean45-sealed-regression.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/tests/sealed-rules-smoke.mjs dev/CLEANUP_REPORT_CLEAN45_SEALED_REGRESSION.txt .github/workflows/liveasta-clean45-sealed-regression.yml
          git commit -m "LIVEASTA DEV clean45 sealed auction regression"
          git push
