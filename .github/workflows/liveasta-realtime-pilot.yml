name: LIVEASTA Realtime pilot
on:
  push:
    paths:
      - '.github/workflows/liveasta-realtime-pilot.yml'
permissions:
  contents: write
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start DEV locally
        run: |
          python3 -m http.server 4173 >/tmp/liveasta-http.log 2>&1 &
          sleep 2
      - name: Run minimal Realtime pilot
        run: node dev/tests/realtime-pilot.mjs
      - name: Commit report and self-remove
        run: |
          rm -f .github/workflows/liveasta-realtime-pilot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add dev/tests/realtime-pilot.mjs dev/REALTIME_PILOT_REPORT.json .github/workflows/liveasta-realtime-pilot.yml
          git commit -m "LIVEASTA DEV realtime pilot report"
          git push
