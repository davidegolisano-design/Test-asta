name: LIVEASTA DEV clean29 extract wake lock
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean29-extract-wakelock.yml'
permissions:
  contents: write
jobs:
  clean29:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser and Playwright
        run: |
          npm install --no-save espree playwright
          npx playwright install --with-deps chromium
      - name: Apply CLEAN-29 wake-lock extraction
        run: node dev/tools/clean29_extract_wakelock.mjs
      - name: Validate JavaScript and ownership
        run: |
          for f in dev/scripts/*.js; do node --check "$f"; done
          grep -q 'scripts/screen-wake-lock.js?dev=094-clean29a' dev/index.html
          grep -q 'function requestScreenWakeLock' dev/scripts/screen-wake-lock.js
          grep -q 'function releaseScreenWakeLock' dev/scripts/screen-wake-lock.js
          grep -q 'function installScreenWakeLock' dev/scripts/screen-wake-lock.js
          grep -q 'let screenWakeLock = null' dev/scripts/screen-wake-lock.js
          ! grep -q 'function requestScreenWakeLock' dev/scripts/app.js
          ! grep -q 'let screenWakeLock = null' dev/scripts/app.js
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/liveasta-http.log 2>&1 &
          sleep 2
      - name: Run home/access smoke
        run: node dev/tests/smoke.mjs
      - name: Run module regression smoke
        run: node dev/tests/regression-smoke.mjs
      - name: Run wake-lock smoke
        run: |
          cat > dev/tests/clean29-wakelock-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173/dev/index.html?wakelock-smoke=1',{waitUntil:'domcontentloaded'});
          await page.waitForTimeout(900);
          const result=await page.evaluate(async()=>{
            const types={
              request:typeof window.requestScreenWakeLock,
              release:typeof window.releaseScreenWakeLock,
              install:typeof window.installScreenWakeLock
            };
            let requestResult;
            try{requestResult=await requestScreenWakeLock();}catch(e){requestResult='THREW:'+String(e);}
            let releaseResult='ok';
            try{await releaseScreenWakeLock();}catch(e){releaseResult='THREW:'+String(e);}
            return {types,requestResult,releaseResult};
          });
          if(result.types.request!=='function'||result.types.release!=='function'||result.types.install!=='function') throw new Error('Wake-lock API missing');
          if(String(result.requestResult).startsWith('THREW:')) throw new Error('requestScreenWakeLock threw: '+result.requestResult);
          if(String(result.releaseResult).startsWith('THREW:')) throw new Error('releaseScreenWakeLock threw: '+result.releaseResult);
          if(errors.length) throw new Error('Page errors: '+errors.join(' | '));
          console.log('LIVEASTA wake-lock browser smoke: OK');
          await browser.close();
          EOF
          node dev/tests/clean29-wakelock-smoke.mjs
      - name: Commit and self-remove temporary files
        run: |
          rm -f dev/tests/clean29-wakelock-smoke.mjs
          rm -f .github/workflows/liveasta-clean29-extract-wakelock.yml dev/tools/clean29_extract_wakelock.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/index.html dev/scripts/app.js dev/scripts/screen-wake-lock.js dev/CLEANUP_REPORT_CLEAN29_WAKELOCK.txt .github/workflows/liveasta-clean29-extract-wakelock.yml dev/tools/clean29_extract_wakelock.mjs
          git commit -m "LIVEASTA DEV clean29 extract screen wake-lock module"
          git push
