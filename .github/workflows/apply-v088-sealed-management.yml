name: Apply v0.88 sealed and management
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v088-sealed-management.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v0.88
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8',errors='ignore')

          css='<link rel="stylesheet" href="./management-v088.css?v=088">'
          if css not in s:
              s=s.replace('</head>',css+'\n</head>',1)

          sealed_js='<script src="./sealed-v088.js?v=088"></script>'
          mg_js='<script src="./management-v088.js?v=088"></script>'
          if sealed_js not in s:
              s=s.replace('</body>',sealed_js+'\n</body>',1)
          if mg_js not in s:
              s=s.replace('</body>',mg_js+'\n</body>',1)

          old="document.getElementById('countdown-display').textContent=winner?String(currentAuctionValue):'0';"
          new="document.getElementById('countdown-display').textContent='0';"
          if old not in s:
              raise SystemExit('sealed result countdown assignment not found')
          s=s.replace(old,new,1)

          s=s.replace('v0.87','v0.88').replace('V0.87','V0.88')
          s=s.replace('pwa-install.js?v=087','pwa-install.js?v=088')
          p.write_text(s,encoding='utf-8')

          p=Path('pwa-install.js')
          s=p.read_text(encoding='utf-8',errors='ignore')
          s=s.replace("document.title='v0.79 TEST';","document.title='v0.88 TEST';")
          s=s.replace('liveasta-v079-runtime-style','liveasta-v088-runtime-style')
          p.write_text(s,encoding='utf-8')

          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"liveasta-test-v\d+-pwa1","liveasta-test-v088-pwa1",s)
          p.write_text(s,encoding='utf-8')

          p=Path('manifest-v22.webmanifest')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'"start_url"\s*:\s*"[^"]*"','"start_url": "./?v=088-test"',s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pwa-install.js service-worker.js manifest-v22.webmanifest
          git diff --cached --quiet || (git commit -m "v0.88 fix sealed countdown and refine management UI" && git push)
