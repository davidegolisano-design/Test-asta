name: LIVEASTA MGMT-06 apply
on:
  push:
    paths:
      - '.github/workflows/liveasta-mgmt06-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply MGMT-06 patch
        run: python tools/apply_mgmt06.py
      - name: Validate JavaScript syntax
        run: node --check dev/scripts/app.js
      - name: Validate DEV structure
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('dev/index.html').read_text()
          j=Path('dev/scripts/app.js').read_text()
          assert 'v1.00 MGMT-06' in h
          assert 'auto-random-role-btn-P' in h
          assert 'nomination-role-order-list' in h
          assert "role_order:['P','D','C','A']" in j
          assert 'requestManualAssignPrice' in j
          assert 'toggleAutoRandomRoleButton' in j
          assert 'function moveNominationRole' in j
          print('MGMT-06 static checks OK')
          PY
      - name: Commit DEV-only changes and remove temporary files
        run: |
          git config user.name 'liveasta-dev-bot'
          git config user.email 'liveasta-dev-bot@users.noreply.github.com'
          rm -f tools/apply_mgmt06.py .github/workflows/liveasta-mgmt06-inspect.yml .github/workflows/liveasta-mgmt06-apply.yml
          git add dev/index.html dev/scripts/app.js dev/styles/management.css dev/styles/ui.css tools/apply_mgmt06.py .github/workflows/liveasta-mgmt06-inspect.yml .github/workflows/liveasta-mgmt06-apply.yml
          git commit -m 'Implement DEV MGMT-06 auction controls' || exit 0
          git push