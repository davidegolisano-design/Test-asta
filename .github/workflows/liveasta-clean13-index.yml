name: LIVEASTA DEV clean13 index structural cleanup
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean13-index.yml'
permissions:
  contents: write
jobs:
  clean13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply index cleanup
        run: python .github/clean13.py
      - name: Validate application sources
        run: |
          for f in dev/scripts/*.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('dev/index.html').read_text(encoding='utf-8')
          for n in ['mobile-web-app-capable','apple-mobile-web-app-capable','apple-mobile-web-app-status-bar-style']:
              assert len(re.findall(r'<meta\s+name="'+re.escape(n)+r'"',s)) == 1, n
          ids=re.findall(r'\bid="([^"]+)"',s)
          assert len(ids)==len(set(ids)), 'duplicate static HTML ids'
          assert 'CLEAN-13' in s and '094-clean13a' in s
          print('Index structural checks: OK')
          PY
      - name: Commit and self-remove temporary files
        run: |
          rm -f .github/clean13.py .github/workflows/liveasta-clean13-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev .github/clean13.py .github/workflows/liveasta-clean13-index.yml
          git commit -m "LIVEASTA DEV v0.94 clean13 normalize index structure"
          git push
