name: LIVEASTA DEV clean28 regression suite
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean28-regression.yml'
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Validate JavaScript syntax
        run: for f in dev/scripts/*.js; do node --check "$f"; done
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/liveasta-http.log 2>&1 &
          sleep 2
      - name: Home and access smoke
        run: node dev/tests/smoke.mjs
      - name: Audio smoke
        run: node dev/tests/audio-smoke.mjs
      - name: Responsive UI fit smoke
        run: node dev/tests/ui-fit-smoke.mjs
      - name: Shared module regression smoke
        run: node dev/tests/regression-smoke.mjs
      - name: Write report
        run: |
          cat > dev/CLEANUP_REPORT_CLEAN28_REGRESSION.txt <<'EOF'
          LIVEASTA CLEAN-28 - AUTOMATED REGRESSION CHECKPOINT
          ==================================================
          No application code changed in this step.

          Passed suites:
           - smoke.mjs: home, DEV marker, Banditore device choice, Giocatore wizard, return navigation, fatal page errors
           - audio-smoke.mjs: audio module ownership, mixer open/close, default volumes
           - ui-fit-smoke.mjs: responsive name fitting module
           - regression-smoke.mjs: shared utils, Classic/Mantra roles, player assets/fallbacks, theme application/fallback

          All dev/scripts/*.js also passed node --check.

          This checkpoint does not replace later live-room regression for Supabase/realtime, READY, bids, sealed auction, purchases and budget flows.
          EOF
      - name: Commit report and self-remove
        run: |
          rm -f .github/workflows/liveasta-clean28-regression.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/tests/regression-smoke.mjs dev/CLEANUP_REPORT_CLEAN28_REGRESSION.txt .github/workflows/liveasta-clean28-regression.yml
          git commit -m "LIVEASTA DEV clean28 automated regression checkpoint"
          git push
