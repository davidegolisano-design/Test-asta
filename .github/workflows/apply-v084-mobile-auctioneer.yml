name: Apply v0.84 mobile auctioneer fixes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v084-mobile-auctioneer.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="./mobile-auctioneer-v084.css">'
          if css not in s: s=s.replace('</head>',css+'\n</head>',1)
          s=s.replace('v0.83','v0.84').replace('V0.83','V0.84')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "v0.84 unify smartphone auctioneer role badge and thumbnail" && git push)
