name: LIVEASTA DEV clean26 architecture audit
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean26-architecture-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install audit parsers
        run: npm install --no-save espree postcss
      - name: Run CLEAN-26 architecture audit
        run: node dev/tools/clean26_architecture_audit.mjs
      - name: Validate sources
        run: |
          for f in dev/scripts/*.js; do node --check "$f"; done
          test -s dev/CLEANUP_AUDIT_CLEAN26_ARCHITECTURE.txt
      - name: Commit report and self-remove
        run: |
          rm -f .github/workflows/liveasta-clean26-architecture-audit.yml dev/tools/clean26_architecture_audit.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/CLEANUP_AUDIT_CLEAN26_ARCHITECTURE.txt .github/workflows/liveasta-clean26-architecture-audit.yml dev/tools/clean26_architecture_audit.mjs
          git commit -m "LIVEASTA DEV clean26 architecture audit"
          git push
