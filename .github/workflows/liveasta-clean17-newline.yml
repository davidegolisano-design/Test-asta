name: LIVEASTA DEV clean17 literal newline fix
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean17-newline.yml'
permissions:
  contents: write
jobs:
  clean17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CLEAN-17
        run: python .github/clean17_fix_literal_newlines.py
      - name: Validate application sources
        run: |
          for f in dev/scripts/*.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          s=Path('dev/index.html').read_text(encoding='utf-8')
          assert '\\n<link rel="stylesheet"' not in s
          assert 'css?dev=094-clean17a">\\n' not in s
          assert 'CLEAN-17' in s
          print('Literal newline checks: OK')
          PY
      - name: Commit and self-remove temporary files
        run: |
          rm -f .github/clean17_fix_literal_newlines.py .github/workflows/liveasta-clean17-newline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev .github/clean17_fix_literal_newlines.py .github/workflows/liveasta-clean17-newline.yml
          git commit -m "LIVEASTA DEV v0.94 clean17 remove visible newline artifacts"
          git push
