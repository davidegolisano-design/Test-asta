name: Export v0.84 stable index
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-v084-index.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare stable file
        run: cp index.html LIVEASTA_v0.84_STABILE.html
      - uses: actions/upload-artifact@v4
        with:
          name: LIVEASTA_v0.84_STABILE
          path: LIVEASTA_v0.84_STABILE.html
          retention-days: 1
