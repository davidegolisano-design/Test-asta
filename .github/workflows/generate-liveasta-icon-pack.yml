name: Generate Liveasta Icon Pack

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-liveasta-icon-pack.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python3 -m pip install --upgrade pillow

      - name: Generate complete icon pack from the original source
        shell: python
        run: |
          from PIL import Image
          from pathlib import Path
          import json, re, shutil, zipfile

          SOURCE = Path("liveasta-icon-source.png")
          OUT = Path("icons")
          OUT.mkdir(exist_ok=True)

          src = Image.open(SOURCE).convert("RGBA")
          if src.size != (512, 512):
              raise SystemExit(f"Unexpected source size: {src.size}")

          def exact(size, path):
              im = src.resize((size, size), Image.Resampling.LANCZOS)
              # Rebuild pixels so old metadata never propagates.
              rgba = Image.frombytes("RGBA", im.size, im.tobytes())
              rgba.save(path, format="PNG", optimize=False, compress_level=6)

          def padded(size, scale, path, background=(0,0,0,255), transparent=False):
              bg = (0,0,0,0) if transparent else background
              canvas = Image.new("RGBA", (size, size), bg)
              inner = round(size * scale)
              art = src.resize((inner, inner), Image.Resampling.LANCZOS)
              art = Image.frombytes("RGBA", art.size, art.tobytes())
              pos = ((size-inner)//2, (size-inner)//2)
              canvas.alpha_composite(art, pos)
              canvas.save(path, format="PNG", optimize=False, compress_level=6)

          # Browser / PWA. Same original artwork, with a modest black safe border.
          padded(192, 0.86, OUT/"liveasta-pwa-any-192.png")
          padded(512, 0.86, OUT/"liveasta-pwa-any-512.png")

          # Maskable PWA: conservative safe-area so Samsung/Android masks cannot cut the art.
          padded(192, 0.62, OUT/"liveasta-pwa-maskable-192.png")
          padded(512, 0.62, OUT/"liveasta-pwa-maskable-512.png")

          # Browser / Apple support.
          exact(32, OUT/"liveasta-favicon-32.png")
          exact(48, OUT/"liveasta-favicon-48.png")
          padded(180, 0.86, OUT/"liveasta-apple-touch-180.png")

          # Android adaptive icon.
          # Foreground is transparent and deliberately inside Android's safe zone.
          padded(
              432, 0.62,
              Path("android-app/app/src/main/res/drawable-nodpi/ic_launcher_liveasta_foreground.png"),
              transparent=True
          )
          # Legacy fallback also gets a safe border.
          padded(
              512, 0.82,
              Path("android-app/app/src/main/res/mipmap-nodpi/ic_launcher_liveasta.png")
          )

          Path("android-app/app/src/main/res/drawable/ic_launcher_liveasta_background.xml").write_text(
          """<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#000000"/>
          </shape>
          """, encoding="utf-8")

          Path("android-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher_liveasta.xml").write_text(
          """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_liveasta_background"/>
              <foreground android:drawable="@drawable/ic_launcher_liveasta_foreground"/>
          </adaptive-icon>
          """, encoding="utf-8")

          # PWA manifest: any + maskable are intentionally separate files.
          manifest = {
              "id": "/",
              "name": "LIVEASTA",
              "short_name": "LIVEASTA",
              "description": "LIVEASTA - gestione aste fantacalcio in tempo reale",
              "start_url": "/",
              "scope": "/",
              "display": "standalone",
              "orientation": "portrait-primary",
              "background_color": "#11151B",
              "theme_color": "#11151B",
              "prefer_related_applications": False,
              "icons": [
                  {
                      "src": "/icons/liveasta-pwa-any-192.png",
                      "sizes": "192x192",
                      "type": "image/png",
                      "purpose": "any"
                  },
                  {
                      "src": "/icons/liveasta-pwa-any-512.png",
                      "sizes": "512x512",
                      "type": "image/png",
                      "purpose": "any"
                  },
                  {
                      "src": "/icons/liveasta-pwa-maskable-192.png",
                      "sizes": "192x192",
                      "type": "image/png",
                      "purpose": "maskable"
                  },
                  {
                      "src": "/icons/liveasta-pwa-maskable-512.png",
                      "sizes": "512x512",
                      "type": "image/png",
                      "purpose": "maskable"
                  }
              ]
          }
          Path("manifest.webmanifest").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )

          # HTML references. New paths + version prevent any old cached icon from being reused.
          p = Path("index.html")
          html = p.read_text(encoding="utf-8")
          html = re.sub(
              r'<link rel="icon" type="image/png" sizes="192x192" href="[^"]+">',
              '<link rel="icon" type="image/png" sizes="192x192" href="/icons/liveasta-pwa-any-192.png?v=140">',
              html
          )
          html = re.sub(
              r'<link rel="apple-touch-icon"[^>]*>',
              '<link rel="apple-touch-icon" sizes="180x180" href="/icons/liveasta-apple-touch-180.png?v=140">',
              html
          )
          html = re.sub(
              r'<link rel="manifest" href="[^"]+">',
              '<link rel="manifest" href="/manifest.webmanifest?v=140">',
              html
          )
          html = re.sub(
              r'<script src="\./scripts/pwa\.js\?v=[^"]+"></script>',
              '<script src="./scripts/pwa.js?v=140-iconpack"></script>',
              html
          )
          # Add explicit 32px favicon once.
          if 'liveasta-favicon-32.png' not in html:
              marker = '<link rel="icon" type="image/png" sizes="192x192" href="/icons/liveasta-pwa-any-192.png?v=140">'
              html = html.replace(
                  marker,
                  '<link rel="icon" type="image/png" sizes="32x32" href="/icons/liveasta-favicon-32.png?v=140">\n    ' + marker
              )
          p.write_text(html, encoding="utf-8")

          # New service-worker URL forces immediate update.
          p = Path("scripts/pwa.js")
          js = p.read_text(encoding="utf-8")
          js = re.sub(
              r"navigator\.serviceWorker\.register\('/service-worker\.js\?v=\d+'",
              "navigator.serviceWorker.register('/service-worker.js?v=140'",
              js
          )
          p.write_text(js, encoding="utf-8")

          p = Path("service-worker.js")
          sw = p.read_text(encoding="utf-8")
          sw = re.sub(
              r"const CACHE = '[^']+';",
              "const CACHE = 'liveasta-v1.04-140-original-icon-pack';",
              sw
          )
          p.write_text(sw, encoding="utf-8")

          # Android splash uses the same foreground generated from the source.
          p = Path("android-app/app/src/main/res/values-v31/styles.xml")
          s = p.read_text(encoding="utf-8")
          s = re.sub(
              r'<item name="android:windowSplashScreenAnimatedIcon">[^<]+</item>',
              '<item name="android:windowSplashScreenAnimatedIcon">@drawable/ic_launcher_liveasta_foreground</item>',
              s
          )
          p.write_text(s, encoding="utf-8")

          # Build a downloadable icon pack in the repo.
          readme = OUT/"README.txt"
          readme.write_text(
              """LIVEASTA ICON PACK
Generated automatically from liveasta-icon-source.png.

PWA:
- liveasta-pwa-any-192.png
- liveasta-pwa-any-512.png
- liveasta-pwa-maskable-192.png
- liveasta-pwa-maskable-512.png

Browser / Apple:
- liveasta-favicon-32.png
- liveasta-favicon-48.png
- liveasta-apple-touch-180.png

Android:
- drawable-nodpi/ic_launcher_liveasta_foreground.png
- drawable/ic_launcher_liveasta_background.xml
- mipmap-anydpi-v26/ic_launcher_liveasta.xml
- mipmap-nodpi/ic_launcher_liveasta.png

All artwork is generated from the single original source file.
""",
              encoding="utf-8"
          )

          zip_path = OUT/"liveasta-icon-pack.zip"
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as z:
              z.write(SOURCE, arcname="liveasta-icon-source.png")
              for f in sorted(OUT.glob("*.png")):
                  z.write(f, arcname=f.name)
              z.write(readme, arcname="README.txt")
              z.write(
                  "android-app/app/src/main/res/drawable-nodpi/ic_launcher_liveasta_foreground.png",
                  arcname="android/ic_launcher_liveasta_foreground.png"
              )
              z.write(
                  "android-app/app/src/main/res/drawable/ic_launcher_liveasta_background.xml",
                  arcname="android/ic_launcher_liveasta_background.xml"
              )
              z.write(
                  "android-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher_liveasta.xml",
                  arcname="android/ic_launcher_liveasta.xml"
              )
              z.write(
                  "android-app/app/src/main/res/mipmap-nodpi/ic_launcher_liveasta.png",
                  arcname="android/ic_launcher_liveasta_legacy.png"
              )

          # Validate all relevant images can be decoded.
          checks = [
              (OUT/"liveasta-pwa-any-192.png", (192,192)),
              (OUT/"liveasta-pwa-any-512.png", (512,512)),
              (OUT/"liveasta-pwa-maskable-192.png", (192,192)),
              (OUT/"liveasta-pwa-maskable-512.png", (512,512)),
              (OUT/"liveasta-apple-touch-180.png", (180,180)),
              (Path("android-app/app/src/main/res/drawable-nodpi/ic_launcher_liveasta_foreground.png"), (432,432)),
              (Path("android-app/app/src/main/res/mipmap-nodpi/ic_launcher_liveasta.png"), (512,512)),
          ]
          for path, expected in checks:
              im = Image.open(path)
              im.load()
              assert im.size == expected, (path, im.size)
              print(path, im.mode, im.size)

      - name: Commit complete icon replacement
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Liveasta Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add             icons/             manifest.webmanifest             index.html             scripts/pwa.js             service-worker.js             android-app/app/src/main/res/drawable-nodpi/ic_launcher_liveasta_foreground.png             android-app/app/src/main/res/drawable/ic_launcher_liveasta_background.xml             android-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher_liveasta.xml             android-app/app/src/main/res/mipmap-nodpi/ic_launcher_liveasta.png             android-app/app/src/main/res/values-v31/styles.xml
          git commit -m "Replace all app icons from original Liveasta artwork"
          git push origin HEAD:main

      - name: Wait for GitHub Pages
        shell: bash
        run: |
          set -euxo pipefail
          for i in $(seq 1 60); do
            body="$(curl -fsSL -H 'Cache-Control: no-cache' "https://liveasta.it/manifest.webmanifest?v=140&check=$i" || true)"
            if echo "$body" | grep -q "/icons/liveasta-pwa-maskable-512.png"; then
              echo "New icon pack is live."
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for Pages."
          exit 1

      - name: Verify PWA icon decoding and installability with Chrome
        shell: bash
        run: |
          set -euxo pipefail
          npm install chrome-remote-interface@0.33.3
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:9222/json/version >/dev/null && break
            sleep 1
          done
          node <<'NODE'
          const CDP=require('chrome-remote-interface');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const client=await CDP();
            const {Page,Runtime}=client;
            await Promise.all([Page.enable(),Runtime.enable()]);
            await Page.navigate({url:'https://liveasta.it/?icon-pack=140'});
            await Page.loadEventFired();
            await sleep(8000);

            const manifest=await Page.getAppManifest();
            const errors=await Page.getInstallabilityErrors();
            console.log('MANIFEST ERRORS',JSON.stringify(manifest.errors,null,2));
            console.log('INSTALLABILITY',JSON.stringify(errors,null,2));

            const decode=await Runtime.evaluate({
              expression:`Promise.all([
                '/icons/liveasta-pwa-any-192.png',
                '/icons/liveasta-pwa-any-512.png',
                '/icons/liveasta-pwa-maskable-192.png',
                '/icons/liveasta-pwa-maskable-512.png'
              ].map(src=>fetch(src+'?d='+Date.now(),{cache:'no-store'})
                .then(r=>r.blob())
                .then(async b=>{
                  const bm=await createImageBitmap(b);
                  const out={src,w:bm.width,h:bm.height,type:b.type,size:b.size};
                  bm.close();
                  return out;
                })))`,
              awaitPromise:true,
              returnByValue:true
            });
            console.log('DECODE',JSON.stringify(decode.result.value,null,2));

            const bad=(errors.installabilityErrors||[]).filter(e=>e.errorId==='no-acceptable-icon');
            if(bad.length) throw new Error('Chrome rejects generated icons');
            if(manifest.errors?.length) throw new Error('Manifest parse errors');
            await client.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
