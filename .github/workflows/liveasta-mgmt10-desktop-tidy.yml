name: LIVEASTA MGMT-10 desktop tidy
on:
  push:
    paths:
      - '.github/workflows/liveasta-mgmt10-desktop-tidy.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply desktop-only tidy rules
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('dev/styles/management.css')
          s = css.read_text(encoding='utf-8')
          marker = '/* === MGMT-10: desktop tidy === */'
          if marker not in s:
              s += '''\n\n/* === MGMT-10: desktop tidy === */\nbody.auctioneer-desktop #screen-room-control .auctioneer-player-control-card{\n  grid-column:1 / -1!important;\n  width:100%!important;\n  max-width:none!important;\n}\nbody.auctioneer-desktop #screen-room-control .self-raise-control-card,\nbody.auctioneer-desktop #screen-room-control .ready-control-card{\n  align-self:stretch!important;\n  height:100%!important;\n}\n'''
          s = s.replace('canonical Gestione UI · v1.02 MGMT-08','canonical Gestione UI · v1.04 MGMT-10',1)
          css.write_text(s,encoding='utf-8')

          index = Path('dev/index.html')
          h = index.read_text(encoding='utf-8')
          h = h.replace('LIVEASTA DEV · v1.03 MGMT-09','LIVEASTA DEV · v1.04 MGMT-10')
          h = h.replace('AMBIENTE DEV · v1.03 MGMT-09','AMBIENTE DEV · v1.04 MGMT-10')
          h = h.replace('            v1.03\n','            v1.04\n',1)
          h = h.replace('103-mgmt09','104-mgmt10')
          index.write_text(h,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'MGMT-10: desktop tidy' dev/styles/management.css
          grep -q 'auctioneer-player-control-card' dev/styles/management.css
          grep -q 'self-raise-control-card' dev/styles/management.css
          grep -q 'LIVEASTA DEV · v1.04 MGMT-10' dev/index.html
          grep -q '104-mgmt10' dev/index.html
      - name: Commit
        run: |
          rm -f .github/workflows/liveasta-mgmt10-desktop-tidy.yml
          git config user.name 'liveasta-dev-bot'
          git config user.email 'liveasta-dev-bot@users.noreply.github.com'
          git add dev/index.html dev/styles/management.css .github/workflows/liveasta-mgmt10-desktop-tidy.yml
          git commit -m 'Tidy DEV desktop management layout MGMT-10'
          git push origin main
