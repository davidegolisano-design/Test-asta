name: Integrate LIVEASTA v1.0 Mantra categories
on:
  push:
    paths:
      - '.github/workflows/release-v101-mantra-roles.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Mantra category module
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<title>LIVEASTA · v1.01</title>','<title>LIVEASTA · v1.0</title>')
          s=s.replace('            v1.01\n        </div>\n        <div class="setup-card">','            v1.0\n        </div>\n        <div class="setup-card">',1)
          s=s.replace('./styles/roles.css?v=101','./styles/roles.css?v=102')
          s=s.replace('./scripts/roles.js?v=101','./scripts/roles.js?v=102')
          s=s.replace('./scripts/list-filters.js?v=100','./scripts/list-filters.js?v=102')
          if './scripts/mantra-auction.js?v=102' not in s:
              s=s.replace('    <script src="./scripts/app.js?v=100"></script>','    <script src="./scripts/app.js?v=100"></script>\n    <script src="./scripts/mantra-auction.js?v=102"></script>',1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q 'LIVEASTA · v1.0' index.html
          grep -q 'styles/roles.css?v=102' index.html
          grep -q 'scripts/roles.js?v=102' index.html
          grep -q 'scripts/list-filters.js?v=102' index.html
          grep -q 'scripts/mantra-auction.js?v=102' index.html
      - name: Commit integration and remove temporary workflow
        run: |
          git config user.name 'liveasta-release-bot'
          git config user.email 'liveasta-release-bot@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/release-v101-mantra-roles.yml
          git commit -m 'Integrate Mantra categories into LIVEASTA v1.0'
          git push
