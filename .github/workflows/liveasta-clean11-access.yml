name: LIVEASTA DEV clean11 access consolidation
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean11-access.yml'
permissions:
  contents: write
jobs:
  clean11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CLEAN-11 access consolidation
        run: python dev/tools/clean11_access.py
      - name: Validate application sources
        run: |
          for f in dev/scripts/*.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          app=Path('dev/scripts/app.js').read_text(encoding='utf-8')
          boot=Path('dev/scripts/bootstrap.js').read_text(encoding='utf-8')
          banned=['oldOpenPlayerLobby','oldSetAuctioneerRoomMode','oldResetAuctioneerRoomMode','oldPlayerBack','oldAuctionBack','oldResetAuctionMode']
          for name in banned:
              assert name not in boot, f'legacy wrapper remains: {name}'
          assert app.count('async function openPlayerLobby()')==1
          assert app.count('async function setAuctioneerRoomMode(mode)')==1
          assert app.count('function resetAuctioneerRoomMode()')==1
          assert boot.count('window.playerAccessWizardBack=function')==1
          assert boot.count('window.auctionAccessWizardBack=function')==1
          assert 'window.resetPlayerAccessWizard=resetPlayerWizard;' in boot
          assert 'window.prepareAuctionAccessWizard=prepareAuctionWizard;' in boot
          assert 'window.renderAuctionAccessWizard=renderAuctionWizard;' in boot
          print('CLEAN-11 ownership checks: OK')
          PY
      - name: Commit and self-remove temporary files
        run: |
          rm -f .github/workflows/liveasta-clean11-access.yml dev/tools/clean11_access.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev .github/workflows/liveasta-clean11-access.yml
          git commit -m "LIVEASTA DEV v0.94 clean11 consolidate access flow ownership"
          git push