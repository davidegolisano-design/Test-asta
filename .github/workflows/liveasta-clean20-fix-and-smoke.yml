name: LIVEASTA DEV clean20 title fix and browser smoke
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean20-fix-and-smoke.yml'
permissions:
  contents: write
jobs:
  clean20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CLEAN-20 title cleanup
        run: python .github/clean20_brand_fix.py
      - name: Validate sources
        run: |
          for f in dev/scripts/*.js; do node --check "$f"; done
          ! grep -Rni --include='*.js' "document.title='v0.93'" dev/scripts
          grep -q 'CLEAN-20' dev/index.html
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/liveasta-http.log 2>&1 &
          sleep 2
      - name: Run browser smoke
        run: node dev/tests/smoke.mjs
      - name: Commit and self-remove temporary files
        run: |
          rm -f .github/clean20_brand_fix.py .github/workflows/liveasta-clean20-fix-and-smoke.yml .github/workflows/liveasta-clean20-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev .github/clean20_brand_fix.py .github/workflows/liveasta-clean20-fix-and-smoke.yml .github/workflows/liveasta-clean20-smoke.yml
          git commit -m "LIVEASTA DEV v0.94 clean20 fix title ownership and pass browser smoke"
          git push
