  html[data-auctioneer-ui="desktop"] #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #list-filters-board .unified-sort-row select,
  html[data-auctioneer-ui="desktop"] #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #list-filters-board .unified-direction{
