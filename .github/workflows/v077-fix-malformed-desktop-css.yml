    justify-self:start!important;
    border-radius:999px!important;
    font-size:.72rem!important;
  }
  html[data-auctioneer-ui="desktop"] #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #auctioned-list .auctioned-name,
  html[data-auctioneer-ui="desktop"] #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #auctioned-list .auctioned-team{
    min-width:0!important;
    white-space:nowrap!important;
    overflow:hidden!important;
    text-overflow:ellipsis!important;
    font-size:.88rem!important;
    line-height:1!important;
    text-align:left!important;
  }
  html[data-auctioneer-ui="desktop"] #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #auctioned-list .auctioned-name{
    font-weight:850!important;
    color:var(--theme-text)!important;
  }
  html[data-auctioneer-ui="desktop"] #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #auctioned-list .auctioned-team{
    color:var(--theme-muted)!important;
  }
  html[data-auctioneer-ui="desktop"] #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #auctioned-list .restore-btn{
