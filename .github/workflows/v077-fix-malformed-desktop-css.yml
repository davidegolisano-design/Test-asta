name: Apply v0.77 desktop fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v077-fix-malformed-desktop-css.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove malformed v0.76 block and apply valid desktop CSS
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = 'LIVEASTA v0.76 — BANDITORE DESKTOP TOOLBAR + GIÀ BANDITI'
          mi = s.find(marker)
          if mi != -1:
              start = s.rfind('<style', 0, mi)
              end = s.find('</style>', mi)
              if start != -1 and end != -1:
                  end += len('</style>')
                  # Include only malformed separator text immediately around the bad block.
                  pre = start
                  prev_style = s.rfind('</style>', 0, start)
                  if prev_style != -1:
                      gap = s[prev_style + len('</style>'):start]
                      if gap and all(ch in ' \t\r\n\\n' for ch in gap):
                          pre = prev_style + len('</style>')
                  post = end
                  next_tag = s.find('<', end)
                  if next_tag != -1:
                      gap = s[end:next_tag]
                      if gap and all(ch in ' \t\r\n\\n' for ch in gap):
                          post = next_tag
                  s = s[:pre] + '\n\n' + s[post:]

          # Remove any orphan literal escape text left immediately before a style tag.
          s = s.replace('\\n\\n<style id="liveasta-v076-desktop-board">', '<style id="liveasta-v076-desktop-board">')
          s = s.replace('\\n<style id="liveasta-v076-desktop-board">', '<style id="liveasta-v076-desktop-board">')

          s = s.replace('<title>v0.76 TEST</title>', '<title>v0.77 TEST</title>', 1)

          css = '''
<style id="liveasta-v077-desktop-board">
/* LIVEASTA v0.77 — BANDITORE DESKTOP TOOLBAR + GIÀ BANDITI */
