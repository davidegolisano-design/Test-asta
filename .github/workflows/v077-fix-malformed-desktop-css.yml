    min-height:0!important;
  }

  html[data-auctioneer-ui="desktop"] #screen-auctioneer-board #auction-dashboard.mode-pc #view-list .auction-list-toolbar,
  html[data-auctioneer-ui="desktop"] #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #list-filters-board,
  html[data-auctioneer-ui="desktop"] #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #list-filters-board .unified-filter-controls{
