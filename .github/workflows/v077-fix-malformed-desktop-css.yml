    display:grid!important;
    grid-template-columns:minmax(260px,1fr) 50px minmax(140px,170px) minmax(300px,360px) minmax(300px,380px)!important;
    grid-template-rows:50px auto minmax(0,1fr) auto auto!important;
    column-gap:7px!important;
    row-gap:6px!important;
