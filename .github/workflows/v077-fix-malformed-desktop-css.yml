  }
  html[data-auctioneer-ui="desktop"] #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #toolbar-sealed-mode-btn{
    grid-column:3!important;
    grid-row:1!important;
    width:100%!important;
    min-width:0!important;
    height:50px!important;
    min-height:50px!important;
    max-height:50px!important;
    margin:0!important;
    padding:0 12px!important;
    box-sizing:border-box!important;
  }

  html[data-auctioneer-ui="desktop"] #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #list-filters-board .unified-role-row{
    grid-column:4!important;
    grid-row:1!important;
    display:grid!important;
    grid-template-columns:repeat(5,minmax(0,1fr))!important;
    gap:6px!important;
    height:50px!important;
    min-height:50px!important;
    margin:0!important;
    align-items:stretch!important;
  }
  html[data-auctioneer-ui="desktop"] #screen-auctioneer-board #auction-dashboard.mode-pc #view-list #list-filters-board .unified-role-row > button{
    width:100%!important;
