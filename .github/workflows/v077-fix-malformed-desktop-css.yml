    min-height:0!important;
  }
  html[data-auctioneer-ui="desktop"] #screen-auctioneer-board #auction-dashboard.mode-pc #view-list .auctioned-section-head{
    grid-column:1 / -1!important;
    grid-row:4!important;
    display:grid!important;
    grid-template-columns:minmax(0,1fr) auto!important;
    gap:7px!important;
    margin:0!important;
    align-items:stretch!important;
  }
  html[data-auctioneer-ui="desktop"] #screen-auctioneer-board #auction-dashboard.mode-pc #view-list .auctioned-section-head .collapsed-toggle,
  html[data-auctioneer-ui="desktop"] #screen-auctioneer-board #auction-dashboard.mode-pc #view-list .auctioned-section-head .restore-all-btn{
    height:40px!important;
    min-height:40px!important;
    max-height:40px!important;
    margin:0!important;
    box-sizing:border-box!important;
  }
  html[data-auctioneer-ui="desktop"] #screen-auctioneer-board #auction-dashboard.mode-pc #view-list .auctioned-section-head .restore-all-btn,
  html[data-auctioneer-ui="desktop"] #screen-auctioneer-board #auction-dashboard.mode-pc #view-list .auctioned-section-head .restore-all-btn:is(:hover,:focus,:active){
    background:#D9434E!important;
