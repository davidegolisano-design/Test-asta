name: LIVEASTA DEV clean40 extract list filters
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean40-extract-list-filters.yml'
permissions:
  contents: write
jobs:
  clean40:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser and Playwright
        run: |
          npm install --no-save espree playwright
          npx playwright install --with-deps chromium
      - name: Validate current JavaScript
        run: for f in dev/scripts/*.js; do node --check "$f"; done
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/liveasta-http.log 2>&1 &
          sleep 2
      - name: Characterize list filters before extraction
        run: node dev/tests/list-filters-smoke.mjs
      - name: Apply CLEAN-40 list filters extraction
        run: node dev/tools/clean40_extract_list_filters.mjs
      - name: Validate JavaScript and ownership after extraction
        run: |
          for f in dev/scripts/*.js; do node --check "$f"; done
          grep -q 'scripts/list-filters.js?dev=094-clean40a' dev/index.html
          for symbol in listFilterViews listFilterLabels listFilterCache listFilterCollator listFilterTeamId; do
            grep -q "$symbol" dev/scripts/list-filters.js
          done
          for fn in listFilterRoles listFilterStorageKey listFilterState changeListFilter renderListFilters filterAndSortPlayers; do
            grep -q "function $fn" dev/scripts/list-filters.js
            ! grep -q "function $fn" dev/scripts/app.js
          done
          ! grep -q 'const listFilterViews' dev/scripts/app.js
          ! grep -q 'const listFilterLabels' dev/scripts/app.js
          ! grep -q 'const listFilterCache' dev/scripts/app.js
          ! grep -q 'const listFilterCollator' dev/scripts/app.js
          ! grep -q 'let listFilterTeamId' dev/scripts/app.js
      - name: Run general browser smoke
        run: node dev/tests/smoke.mjs
      - name: Run shared module regression
        run: node dev/tests/regression-smoke.mjs
      - name: Run team logic regression
        run: node dev/tests/team-logic-smoke.mjs
      - name: Run timer settings regression
        run: node dev/tests/timer-settings-smoke.mjs
      - name: Characterize list filters after extraction
        run: node dev/tests/list-filters-smoke.mjs
      - name: Commit and self-remove temporary files
        run: |
          rm -f .github/workflows/liveasta-clean40-extract-list-filters.yml dev/tools/clean40_extract_list_filters.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/index.html dev/scripts/app.js dev/scripts/list-filters.js dev/tests/list-filters-smoke.mjs dev/CLEANUP_REPORT_CLEAN40_LIST_FILTERS.txt .github/workflows/liveasta-clean40-extract-list-filters.yml dev/tools/clean40_extract_list_filters.mjs
          git commit -m "LIVEASTA DEV clean40 extract list filters module"
          git push
