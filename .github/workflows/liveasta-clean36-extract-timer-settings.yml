name: LIVEASTA DEV clean36 extract timer settings
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean36-extract-timer-settings.yml'
permissions:
  contents: write
jobs:
  clean36:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser and Playwright
        run: |
          npm install --no-save espree playwright
          npx playwright install --with-deps chromium
      - name: Validate current JavaScript
        run: for f in dev/scripts/*.js; do node --check "$f"; done
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/liveasta-http.log 2>&1 &
          sleep 2
      - name: Characterize timer settings before extraction
        run: node dev/tests/timer-settings-smoke.mjs
      - name: Apply CLEAN-36 timer settings extraction
        run: node dev/tools/clean36_extract_timer_settings.mjs
      - name: Validate JavaScript and ownership after extraction
        run: |
          for f in dev/scripts/*.js; do node --check "$f"; done
          grep -q 'scripts/timer-settings.js?dev=094-clean36a' dev/index.html
          for fn in auctionPrepStateKey loadAuctionPrepSeconds saveAuctionPrepSeconds sealedTimerStateKey loadSealedTimerSeconds saveSealedTimerSeconds sealedRevealStateKey loadSealedRevealSeconds saveSealedRevealSeconds; do
            grep -q "function $fn" dev/scripts/timer-settings.js
            ! grep -q "function $fn" dev/scripts/app.js
          done
          grep -q 'function loadRoomAuctionExtraSettings' dev/scripts/app.js
          grep -q 'function saveRoomAuctionExtraSettings' dev/scripts/app.js
      - name: Run general browser smoke
        run: node dev/tests/smoke.mjs
      - name: Run shared module regression
        run: node dev/tests/regression-smoke.mjs
      - name: Run team logic regression
        run: node dev/tests/team-logic-smoke.mjs
      - name: Characterize timer settings after extraction
        run: node dev/tests/timer-settings-smoke.mjs
      - name: Commit and self-remove temporary files
        run: |
          rm -f .github/workflows/liveasta-clean36-extract-timer-settings.yml dev/tools/clean36_extract_timer_settings.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/index.html dev/scripts/app.js dev/scripts/timer-settings.js dev/tests/timer-settings-smoke.mjs dev/CLEANUP_REPORT_CLEAN36_TIMER_SETTINGS.txt .github/workflows/liveasta-clean36-extract-timer-settings.yml dev/tools/clean36_extract_timer_settings.mjs
          git commit -m "LIVEASTA DEV clean36 extract room timer settings"
          git push
