name: LIVEASTA PLAYER-01 player contrast and role badge
on:
  push:
    paths:
      - '.github/workflows/liveasta-ui01-player-contrast.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply player-only UI fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('dev/styles/refinements.css')
          s = css.read_text(encoding='utf-8')
          marker = '/* === PLAYER-01: player auction contrast + nomination role badge === */'
          if marker not in s:
              s += r'''

/* === PLAYER-01: player auction contrast + nomination role badge === */
/* Player auction: stable readable text on the right information column. */
html[data-live-theme] #screen-player-buzzer .player-live-side :is(
  .player-timer-box span,
  .player-timer-box small,
  #player-auction-title,
  #player-current-winner,
  #player-countdown,
  #player-current-value,
  .bid-label,
  .credit-label
){
  color:#fff!important;
  -webkit-text-fill-color:#fff!important;
  opacity:1!important;
  text-shadow:0 1px 2px rgba(0,0,0,.72)!important;
}

/* On ordinary light-theme surfaces use dark ink. Semantic winning/losing panels keep white ink. */
:is(
  html[data-live-theme^="light-"],
  html[data-live-theme$="-daily"],
  html[data-live-theme="daily"]
) #screen-player-buzzer .phone-top-area:not(.player-winning):not(.player-losing) .player-live-side :is(
  .player-timer-box span,
  .player-timer-box small,
  #player-auction-title,
  #player-current-winner,
  #player-countdown,
  #player-current-value,
  .bid-label,
  .credit-label
){
  color:#14212b!important;
  -webkit-text-fill-color:#14212b!important;
  opacity:1!important;
  text-shadow:none!important;
}

/* Nomination picker: same circular role badge geometry used throughout LIVEASTA. */
html body #nomination-picker-overlay .nomination-player-row .role-badge{
  width:28px!important;
  min-width:28px!important;
  max-width:28px!important;
  height:28px!important;
  min-height:28px!important;
  max-height:28px!important;
  padding:0!important;
  margin:0!important;
  flex:0 0 28px!important;
  display:inline-flex!important;
  align-items:center!important;
  justify-content:center!important;
  border-radius:50%!important;
  line-height:1!important;
  font-size:12px!important;
  font-weight:900!important;
}
'''
          css.write_text(s, encoding='utf-8')

          index = Path('dev/index.html')
          h = index.read_text(encoding='utf-8')
          h = h.replace('LIVEASTA DEV · v1.04 MGMT-10','LIVEASTA DEV · v1.05 PLAYER-01')
          h = h.replace('AMBIENTE DEV · v1.04 MGMT-10','AMBIENTE DEV · v1.05 PLAYER-01')
          h = h.replace('            v1.04\n','            v1.05\n',1)
          h = h.replace('104-mgmt10','105-player01')
          h = h.replace('./styles/refinements.css?dev=094-clean40a','./styles/refinements.css?dev=105-player01')
          index.write_text(h,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'PLAYER-01: player auction contrast' dev/styles/refinements.css
          grep -q 'nomination-picker-overlay .nomination-player-row .role-badge' dev/styles/refinements.css
          grep -q 'LIVEASTA DEV · v1.05 PLAYER-01' dev/index.html
          grep -q 'refinements.css?dev=105-player01' dev/index.html
      - name: Commit
        run: |
          rm -f .github/workflows/liveasta-ui01-player-contrast.yml
          git config user.name 'liveasta-dev-bot'
          git config user.email 'liveasta-dev-bot@users.noreply.github.com'
          git add dev/index.html dev/styles/refinements.css .github/workflows/liveasta-ui01-player-contrast.yml
          git commit -m 'Fix DEV player contrast and role badge PLAYER-01'
          git push origin main