name: AR106
on:
  push:
    paths: ['.github/workflows/ar106.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('scripts/mantra-auction.js')
          s=p.read_text()
          old="const LABELS={P:'Portieri',D:'Difensori',C:'Centrocampisti',T:'Trequartisti',A:'Attaccanti'};"
          new=old+"\n    const SHORT_LABELS={P:'POR',D:'DIF',C:'CEN',T:'TRQ',A:'ATT'};"
          if old in s and 'const SHORT_LABELS=' not in s:
              s=s.replace(old,new,1)
          old_line="host.innerHTML=roles.map(role=>`<button id=\"auto-random-role-btn-${role}\" type=\"button\" class=\"unified-role role-${role}\" aria-pressed=\"false\" onclick=\"toggleAutoRandomRoleButton('${role}')\">${categoryLabel(role)}</button>`).join('');"
          new_line="host.innerHTML=roles.map(role=>`<button id=\"auto-random-role-btn-${role}\" type=\"button\" class=\"unified-role role-${role}\" aria-pressed=\"false\" aria-label=\"${categoryLabel(role)}\" title=\"${categoryLabel(role)}\" onclick=\"toggleAutoRandomRoleButton('${role}')\">${isMantraRoom()?(SHORT_LABELS[role]||role):categoryLabel(role)}</button>`).join('');"
          if old_line not in s:
              raise SystemExit('auto-random button template not found')
          s=s.replace(old_line,new_line,1)
          p.write_text(s)

          p=Path('styles/roles.css')
          s=p.read_text()
          old="  .liveasta-mantra .mantra-auto-random-role-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;}"
          new="  .liveasta-mantra .mantra-auto-random-role-grid{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:4px!important;}"
          if old not in s:
              raise SystemExit('mobile auto-random grid rule not found')
          s=s.replace(old,new,1)
          s += '''\n\n/* Compact five-category AUTO RANDOM controls. */\n.liveasta-mantra #screen-room-control .mantra-auto-random-role-grid{\n  display:grid!important;\n  grid-template-columns:repeat(5,minmax(0,1fr))!important;\n  gap:5px!important;\n  width:100%!important;\n}\n.liveasta-mantra #screen-room-control .mantra-auto-random-role-grid .unified-role{\n  min-width:0!important;\n  min-height:42px!important;\n  margin:0!important;\n  padding:6px 3px!important;\n  white-space:nowrap!important;\n  font-size:11px!important;\n  font-weight:950!important;\n  line-height:1!important;\n}\n@media(max-width:560px){\n  .liveasta-mantra #screen-room-control .mantra-auto-random-role-grid{gap:4px!important;}\n  .liveasta-mantra #screen-room-control .mantra-auto-random-role-grid .unified-role{\n    min-height:40px!important;\n    padding:5px 1px!important;\n    font-size:10px!important;\n    border-radius:9px!important;\n  }\n}\n'''
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('styles/roles.css?v=103','styles/roles.css?v=106')
          s=s.replace('scripts/mantra-auction.js?v=105','scripts/mantra-auction.js?v=106')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q "SHORT_LABELS" scripts/mantra-auction.js
          grep -q "mantra-auction.js?v=106" index.html
          grep -q "styles/roles.css?v=106" index.html
      - name: Commit
        run: |
          git config user.name liveasta-release-bot
          git config user.email liveasta-release-bot@users.noreply.github.com
          git add index.html scripts/mantra-auction.js styles/roles.css
          git rm .github/workflows/ar106.yml
          git commit -m 'Compact Mantra auto random controls'
          git push
