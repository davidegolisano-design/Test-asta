name: Integrate Mantra filter UI
on:
  push:
    paths:
      - '.github/workflows/integrate-mantra-filter-ui.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch public index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('./styles/roles.css?v=102','./styles/roles.css?v=103')
          tag='    <script src="./scripts/mantra-filter-ui.js?v=103"></script>'
          anchor='    <script src="./scripts/mantra-auction.js?v=102"></script>'
          if tag not in s:
              s=s.replace(anchor,anchor+'\n'+tag,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q 'styles/roles.css?v=103' index.html
          grep -q 'scripts/mantra-filter-ui.js?v=103' index.html
      - name: Commit integration
        run: |
          git config user.name 'liveasta-release-bot'
          git config user.email 'liveasta-release-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Enable Mantra long-press subfilters'
          git push
