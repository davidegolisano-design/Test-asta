name: Fix LIVEASTA v1 bootstrap guard
on:
  push:
    paths:
      - '.github/workflows/fix-bootstrap-v1.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch legacy management initializer safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/bootstrap.js')
          s=p.read_text(encoding='utf-8')
          old=""" const b=document.getElementById(id);b.classList.add('mg-switch');b.setAttribute('role','switch');b.setAttribute('aria-label',label);if(!b.hasAttribute('aria-checked'))b.setAttribute('aria-checked',String(initial));b.closest('.control-card').querySelector('.control-title').append(b);"""
          new=""" const b=document.getElementById(id);if(!b)return;b.setAttribute('role','switch');b.setAttribute('aria-label',label);if(!b.hasAttribute('aria-checked'))b.setAttribute('aria-checked',String(initial));if(b.closest('.mg-switch-label'))return;b.classList.add('mg-switch');const legacyTitle=b.closest('.control-card')?.querySelector('.control-title');if(legacyTitle)legacyTitle.append(b);"""
          if old not in s:
              raise SystemExit('Expected legacy bootstrap block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Bump bootstrap cache reference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('./scripts/bootstrap.js?v=100','./scripts/bootstrap.js?v=101',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          set -e
          grep -q "if(b.closest('.mg-switch-label'))return" scripts/bootstrap.js
          grep -q 'bootstrap.js?v=101' index.html
          rm .github/workflows/fix-bootstrap-v1.yml
          git config user.name 'liveasta-qa-bot'
          git config user.email 'liveasta-qa-bot@users.noreply.github.com'
          git add scripts/bootstrap.js index.html .github/workflows/fix-bootstrap-v1.yml
          git commit -m 'Fix v1 management bootstrap compatibility'
          git push