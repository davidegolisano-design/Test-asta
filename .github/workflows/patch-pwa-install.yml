name: Patch PWA install

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-pwa-install.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- LIVEASTA PWA INSTALL v0.74 -->'
          if marker not in s:
              block=r'''
<!-- LIVEASTA PWA INSTALL v0.74 -->
<style>
#liveasta-install-btn{
  position:fixed; right:14px; bottom:14px; z-index:999999;
  display:none; align-items:center; justify-content:center;
  min-height:44px; padding:10px 16px; border-radius:12px;
  border:1px solid var(--theme-border,rgba(255,255,255,.18));
  background:var(--theme-primary,#6c5cff); color:#fff;
  font:800 14px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  box-shadow:0 8px 24px rgba(0,0,0,.22); cursor:pointer;
}
#liveasta-install-btn.show{display:flex}
@media (display-mode:standalone){#liveasta-install-btn{display:none!important}}
</style>
<button id="liveasta-install-btn" type="button">Installa LIVEASTA</button>
<script>
(function(){
  let deferredPrompt=null;
  const btn=()=>document.getElementById('liveasta-install-btn');

  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('./service-worker.js',{scope:'./'})
        .catch(err=>console.warn('Service worker non registrato:',err));
    });
  }

  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();
    deferredPrompt=e;
    btn()?.classList.add('show');
  });

  document.addEventListener('click',async e=>{
    if(e.target?.id!=='liveasta-install-btn') return;
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    try{ await deferredPrompt.userChoice; }catch(_){ }
    deferredPrompt=null;
    btn()?.classList.remove('show');
  });

  window.addEventListener('appinstalled',()=>{
    deferredPrompt=null;
    btn()?.classList.remove('show');
  });
})();
</script>
'''
              if '</body>' not in s:
                  raise SystemExit('Tag </body> non trovato')
              s=s.replace('</body>',block+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enable PWA installation prompt'
          git push origin main
