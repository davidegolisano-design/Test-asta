name: Patch PWA install

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-pwa-install.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link PWA helper in index
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); tag='<script src=\"./pwa-install.js\"></script>'; p.write_text(s if tag in s else s.replace('</body>',tag+'\\n</body>',1),encoding='utf-8')"

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enable PWA installation prompt'
          git push origin main
