name: LIVEASTA DEV clean25 extract utils
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean25-extract-utils.yml'
permissions:
  contents: write
jobs:
  clean25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Apply CLEAN-25 utility extraction
        run: node dev/tools/clean25_extract_utils.mjs
      - name: Validate JavaScript and ownership
        run: |
          for f in dev/scripts/*.js; do node --check "$f"; done
          grep -q 'scripts/utils.js?dev=094-clean25a' dev/index.html
          grep -q 'function safeReadLocalJson' dev/scripts/utils.js
          grep -q 'function safeWriteLocalJson' dev/scripts/utils.js
          grep -q 'function normalizeRoomCode' dev/scripts/utils.js
          grep -q 'function escapeHtml' dev/scripts/utils.js
          ! grep -q 'function safeReadLocalJson' dev/scripts/app.js
          ! grep -q 'function escapeHtml' dev/scripts/app.js
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/liveasta-http.log 2>&1 &
          sleep 2
      - name: Run general browser smoke
        run: node dev/tests/smoke.mjs
      - name: Run utility browser smoke
        run: |
          cat > dev/tests/clean25-utils-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173/dev/index.html?utils-smoke=1',{waitUntil:'domcontentloaded'});
          await page.waitForTimeout(900);
          const result=await page.evaluate(()=>{
            const missing=['safeReadLocalJson','safeWriteLocalJson','normalizeRoomCode','escapeHtml'].filter(n=>typeof window[n]!=='function');
            localStorage.removeItem('__liveasta_clean25_test');
            const writeOk=safeWriteLocalJson('__liveasta_clean25_test',{a:1,b:'x'});
            const read=safeReadLocalJson('__liveasta_clean25_test');
            localStorage.setItem('__liveasta_clean25_bad','{bad json');
            const bad=safeReadLocalJson('__liveasta_clean25_bad');
            const cyclic={};cyclic.self=cyclic;
            const cyclicWrite=safeWriteLocalJson('__liveasta_clean25_cyclic',cyclic);
            localStorage.removeItem('__liveasta_clean25_test');
            localStorage.removeItem('__liveasta_clean25_bad');
            localStorage.removeItem('__liveasta_clean25_cyclic');
            return {
              missing,writeOk,read,bad,cyclicWrite,
              normalized:normalizeRoomCode('   Stanza    di   prova   molto lunga 1234567890   '),
              escaped:escapeHtml(`<tag a="x">Tom & Jerry's</tag>`)
            };
          });
          if(result.missing.length) throw new Error('Missing utility functions: '+result.missing.join(','));
          if(!result.writeOk||result.read?.a!==1||result.read?.b!=='x') throw new Error('Local JSON read/write changed');
          if(result.bad!==null) throw new Error('Invalid JSON behavior changed');
          if(result.cyclicWrite!==false) throw new Error('Write failure behavior changed');
          if(result.normalized.length>30||/\s{2,}/.test(result.normalized)||!result.normalized.startsWith('Stanza di prova')) throw new Error('Room normalization changed: '+result.normalized);
          if(result.escaped!=='&lt;tag a=&quot;x&quot;&gt;Tom &amp; Jerry&#39;s&lt;/tag&gt;') throw new Error('HTML escaping changed: '+result.escaped);
          if(errors.length) throw new Error('Page errors: '+errors.join(' | '));
          console.log('LIVEASTA utility browser smoke: OK');
          await browser.close();
          EOF
          node dev/tests/clean25-utils-smoke.mjs
      - name: Commit and self-remove temporary files
        run: |
          rm -f dev/tests/clean25-utils-smoke.mjs
          rm -f .github/workflows/liveasta-clean25-extract-utils.yml dev/tools/clean25_extract_utils.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/index.html dev/scripts/app.js dev/scripts/utils.js dev/CLEANUP_REPORT_CLEAN25_UTILS.txt .github/workflows/liveasta-clean25-extract-utils.yml dev/tools/clean25_extract_utils.mjs
          git commit -m "LIVEASTA DEV clean25 extract shared utility module"
          git push
