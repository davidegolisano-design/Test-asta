name: LIVEASTA DEV clean42 auction rules audit
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean42-auction-rules-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: npm install --no-save espree
      - name: Run CLEAN-42 audit
        run: node dev/tools/clean42_auction_rules_audit.mjs
      - name: Validate JavaScript syntax
        run: for f in dev/scripts/*.js; do node --check "$f"; done
      - name: Commit report and self-remove
        run: |
          rm -f .github/workflows/liveasta-clean42-auction-rules-audit.yml dev/tools/clean42_auction_rules_audit.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/CLEANUP_AUDIT_CLEAN42_AUCTION_RULES.txt .github/workflows/liveasta-clean42-auction-rules-audit.yml dev/tools/clean42_auction_rules_audit.mjs
          git commit -m "LIVEASTA DEV clean42 critical auction rules audit"
          git push
