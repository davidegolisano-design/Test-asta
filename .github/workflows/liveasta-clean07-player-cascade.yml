name: LIVEASTA DEV clean07 player cascade cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/liveasta-clean07-player-cascade.yml'

permissions:
  contents: write

jobs:
  clean07:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install parser
        run: npm install --no-save postcss@8

      - name: Remove dead earlier player CSS declarations
        run: |
          cat > clean07.js <<'JS'
          const fs=require('fs');
          const postcss=require('postcss');
          const file='dev/styles/core.css';
          const before=fs.readFileSync(file,'utf8');
          const root=postcss.parse(before,{from:file});

          const SAFE_PROPS=new Set([
            'font-size','line-height','font-weight','letter-spacing',
            'margin','margin-top','margin-right','margin-bottom','margin-left',
            'padding','padding-top','padding-right','padding-bottom','padding-left',
            'gap','row-gap','column-gap',
            'width','min-width','max-width','height','min-height','max-height',
            'grid-template-columns','grid-template-rows','grid-auto-columns','grid-auto-rows',
            'grid-column','grid-row','align-items','align-content','justify-content','justify-items',
            'flex','flex-basis','flex-grow','flex-shrink','flex-direction','flex-wrap',
            'border-radius','box-sizing','overflow','overflow-x','overflow-y',
            'text-align','white-space','text-overflow','opacity'
          ]);

          function contextKey(rule){
            const chain=[]; let p=rule.parent;
            while(p&&p.type!=='root'){
              if(p.type==='atrule') chain.unshift('@'+p.name+' '+String(p.params||'').trim());
              p=p.parent;
            }
            return chain.join(' > ');
          }
          function valueIsSafe(v){
            const s=String(v).toLowerCase();
            if(s.includes('var(')||s.includes('env(')||s.includes('revert')||s.includes('initial')||s.includes('inherit')) return false;
            if(s.includes('-webkit-')||s.includes('-moz-')) return false;
            return true;
          }

          const groups=new Map();
          root.walkRules(rule=>{
            if(!String(rule.selector||'').includes('#screen-player-buzzer')) return;
            const ctx=contextKey(rule);
            for(const n of (rule.nodes||[])){
              if(n.type!=='decl'||!SAFE_PROPS.has(n.prop)||!valueIsSafe(n.value)) continue;
              const key=ctx+'\u0000'+rule.selector+'\u0000'+n.prop;
              if(!groups.has(key)) groups.set(key,[]);
              groups.get(key).push(n);
            }
          });

          let removed=0, groupsCleaned=0;
          const details=[];
          for(const [key,decls] of groups){
            if(decls.length<2) continue;
            const variants=[...new Set(decls.map(d=>(d.important?'!':'')+d.value))];
            if(variants.length<2) continue;

            // Same selector, property and at-rule context. Cascade winner is the last !important,
            // or the last declaration if no !important exists.
            const important=decls.filter(d=>d.important);
            const winner=(important.length?important[important.length-1]:decls[decls.length-1]);

            const [ctx,selector,prop]=key.split('\u0000');
            let localRemoved=0;
            for(const d of decls){
              if(d===winner) continue;
              d.remove(); removed++; localRemoved++;
            }
            if(localRemoved){
              groupsCleaned++;
              details.push({selector,prop,ctx,count:decls.length,winner:winner.value+(winner.important?' !important':''),removed:localRemoved});
            }
          }

          root.walkRules(rule=>{
            const hasDecl=(rule.nodes||[]).some(n=>n.type==='decl'||n.type==='atrule'||n.type==='rule');
            if(!hasDecl) rule.remove();
          });

          const after=root.toString();
          // Parse the resulting stylesheet before writing.
          postcss.parse(after,{from:file});
          fs.writeFileSync(file,after,'utf8');

          const report=[];
          report.push('LIVEASTA CLEAN-07 - PLAYER CSS CASCADE CLEANUP');
          report.push('================================================');
          report.push('Scope: core.css rules containing #screen-player-buzzer only.');
          report.push('Only standard typography/spacing/layout properties were considered.');
          report.push('For identical selector + property + at-rule context, all declarations except the actual cascade winner were removed.');
          report.push('No winning value was changed.');
          report.push('');
          report.push(`Groups consolidated: ${groupsCleaned}`);
          report.push(`Dead declarations removed: ${removed}`);
          report.push(`core.css: ${before.length.toLocaleString()} -> ${after.length.toLocaleString()} chars`);
          report.push('');
          report.push('TOP CONSOLIDATED GROUPS');
          details.sort((a,b)=>b.count-a.count||a.selector.localeCompare(b.selector));
          for(const d of details.slice(0,120)) report.push(`- x${d.count} ${d.ctx?`(${d.ctx}) `:''}${d.selector} :: ${d.prop} => ${d.winner}`);
          fs.writeFileSync('dev/CLEANUP_REPORT_CLEAN07.txt',report.join('\n')+'\n','utf8');
          JS
          node clean07.js
          rm clean07.js

          python - <<'PY'
          from pathlib import Path
          idx=Path('dev/index.html')
          html=idx.read_text(encoding='utf-8',errors='ignore')
          html=html.replace('CLEAN-05','CLEAN-07').replace('094-clean05a','094-clean07a')
          idx.write_text(html,encoding='utf-8')
          p=Path('dev/scripts/pwa.js')
          if p.exists():
              t=p.read_text(encoding='utf-8',errors='ignore').replace('CLEAN-05','CLEAN-07').replace('094-clean05a','094-clean07a')
              p.write_text(t,encoding='utf-8')
          PY

      - name: Validate all application sources
        run: |
          set -e
          for f in dev/scripts/*.js; do node --check "$f"; done
          node - <<'JS'
          const fs=require('fs'),postcss=require('postcss');
          for(const f of fs.readdirSync('dev/styles').filter(x=>x.endsWith('.css'))){postcss.parse(fs.readFileSync('dev/styles/'+f,'utf8'),{from:f});}
          console.log('All CSS parses');
          JS
          grep -q 'LIVEASTA DEV · v0.94 CLEAN-07' dev/index.html
          test -s dev/CLEANUP_REPORT_CLEAN07.txt

      - name: Commit and self-remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/liveasta-clean07-player-cascade.yml
          git add -A dev .github/workflows/liveasta-clean07-player-cascade.yml
          git diff --cached --quiet || (git commit -m "LIVEASTA DEV v0.94 clean07 consolidate player CSS cascade" && git push)
