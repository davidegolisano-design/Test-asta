name: LIVEASTA MGMT-03 validation

on:
  push:
    paths:
      - '.github/workflows/liveasta-mgmt03-validate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate MGMT-03
        run: |
          node --check dev/scripts/app.js
          node --check dev/scripts/management.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('dev/index.html').read_text()
          css=Path('dev/styles/management.css').read_text()
          js=Path('dev/scripts/management.js').read_text()
          assert 'v0.97 MGMT-03' in html
          for token in ['control-team-list','management-team-detail','mg-team-detail-name','mg-team-detail-credits']:
              assert f'id="{token}"' in html, token
          assert 'control-teams-body' not in html
          assert 'nomination-order-list' not in html
          assert 'renderManagementTeamList' in js
          assert 'moveNominationOrder' in js
          assert 'mg-team-state-bar' in css
          ids=re.findall(r'id="([^"]+)"',html)
          dup=[x for x in set(ids) if ids.count(x)>1]
          assert not dup, dup
          print('MGMT-03 validation OK')
          PY
      - name: Remove validation workflow
        run: |
          rm -f .github/workflows/liveasta-mgmt03-validate.yml
          git config user.name 'liveasta-dev-bot'
          git config user.email 'liveasta-dev-bot@users.noreply.github.com'
          git add .github/workflows/liveasta-mgmt03-validate.yml
          git commit -m 'Remove temporary MGMT-03 validation workflow'
          git pull --rebase origin main
          git push origin main
