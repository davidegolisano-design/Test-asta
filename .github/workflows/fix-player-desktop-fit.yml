name: Fix player desktop reminder and name fit
on:
  push:
    paths:
      - '.github/workflows/fix-player-desktop-fit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/fix-player-desktop-fit.py
      - name: Validate
        run: |
          node --check scripts/app.js
          grep -q "player main name single-line auto fit" scripts/app.js
          grep -q "player desktop nomination reminder" styles/ui.css
          grep -q "app.js?v=117" index.html
          grep -q "ui.css?v=117" index.html
          grep -q "liveasta-v1.0-117" service-worker.js
      - name: Commit
        run: |
          git config user.name 'liveasta-release-bot'
          git config user.email 'liveasta-release-bot@users.noreply.github.com'
          git add index.html service-worker.js scripts/app.js styles/ui.css
          git rm .github/fix-player-desktop-fit.py .github/workflows/fix-player-desktop-fit.yml
          git commit -m 'Fit player desktop reminder and long player names'
          git push
