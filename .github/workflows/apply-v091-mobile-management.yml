name: Apply v0.91 mobile management
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v091-mobile-management.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v0.91
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8',errors='ignore')

          css1='<link rel="stylesheet" href="./management-mobile-v091.css?v=091">'
          css2='<link rel="stylesheet" href="./auction-complete-theme-v091.css?v=091">'
          if css1 not in s:
              s=s.replace('</head>',css1+'\n'+css2+'\n</head>',1)
          elif css2 not in s:
              s=s.replace('</head>',css2+'\n</head>',1)

          js='<script src="./management-mobile-v091.js?v=091"></script>'
          if js not in s:
              s=s.replace('</body>',js+'\n</body>',1)

          s=s.replace('v0.90','v0.91').replace('V0.90','V0.91')
          s=s.replace('pwa-install.js?v=090','pwa-install.js?v=091')
          p.write_text(s,encoding='utf-8')

          p=Path('pwa-install.js')
          s=p.read_text(encoding='utf-8',errors='ignore')
          s=s.replace("document.title='v0.90 TEST';","document.title='v0.91 TEST';")
          s=s.replace('liveasta-v090-runtime-style','liveasta-v091-runtime-style')
          p.write_text(s,encoding='utf-8')

          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"liveasta-test-v\d+-pwa1","liveasta-test-v091-pwa1",s)
          p.write_text(s,encoding='utf-8')

          p=Path('manifest-v22.webmanifest')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'"start_url"\s*:\s*"[^"]*"','"start_url": "./?v=091-test"',s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pwa-install.js service-worker.js manifest-v22.webmanifest
          git diff --cached --quiet || (git commit -m "v0.91 optimize mobile management and theme auction complete" && git push)
