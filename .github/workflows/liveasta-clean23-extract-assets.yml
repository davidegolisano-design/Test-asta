name: LIVEASTA DEV clean23 extract player assets
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean23-extract-assets.yml'
permissions:
  contents: write
jobs:
  clean23:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Apply CLEAN-23 asset extraction
        run: node dev/tools/clean23_extract_assets.mjs
      - name: Validate JavaScript and ownership
        run: |
          for f in dev/scripts/*.js; do node --check "$f"; done
          grep -q 'scripts/player-assets.js?dev=094-clean23a' dev/index.html
          grep -q 'function genericPlayerImage' dev/scripts/player-assets.js
          grep -q 'function playerImageFallback' dev/scripts/player-assets.js
          ! grep -q 'function genericPlayerImage' dev/scripts/app.js
          ! grep -q 'const LIVEASTA_ASSET_BASE' dev/scripts/app.js
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/liveasta-http.log 2>&1 &
          sleep 2
      - name: Run general browser smoke
        run: node dev/tests/smoke.mjs
      - name: Run player asset browser smoke
        run: |
          cat > dev/tests/clean23-assets-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173/dev/index.html?assets-smoke=1',{waitUntil:'domcontentloaded'});
          await page.waitForTimeout(1000);
          for(const name of ['genericPlayerImage','playerImageUrl','setPlayerImage','playerImageFallback']){
            if(!(await page.evaluate(n=>typeof window[n]==='function',name))) throw new Error(name+' missing');
          }
          const result=await page.evaluate(()=>{
            const p=genericPlayerImage('P');
            const por=genericPlayerImage('Por');
            const a=genericPlayerImage('A');
            const id=playerImageUrl('123','A');
            const fake={dataset:{},_src:'',set src(v){this._src=v},get src(){return this._src},getAttribute(n){return n==='src'?this._src:null}};
            setPlayerImage(fake,'999','P');
            const initial={src:fake.src,role:fake.dataset.role,fallback:fake.dataset.localFallback};
            playerImageFallback(fake);
            const fallback={src:fake.src,role:fake.dataset.role,fallback:fake.dataset.localFallback};
            playerImageFallback(fake);
            return {p,por,a,id,initial,fallback,second:fake.src};
          });
          if(!result.p.endsWith('/assets/players/generic-goalkeeper.webp')) throw new Error('Classic goalkeeper fallback wrong');
          if(!result.por.endsWith('/assets/players/generic-goalkeeper.webp')) throw new Error('Mantra goalkeeper fallback wrong');
          if(!result.a.endsWith('/assets/players/generic-player.webp')) throw new Error('Generic player fallback wrong');
          if(!result.id.endsWith('/assets/players/123.webp')) throw new Error('Player URL wrong');
          if(result.initial.role!=='P' || result.initial.fallback!=='0' || !result.initial.src.endsWith('/assets/players/999.webp')) throw new Error('setPlayerImage state wrong');
          if(result.fallback.fallback!=='1' || !result.fallback.src.endsWith('/assets/players/generic-goalkeeper.webp')) throw new Error('playerImageFallback wrong');
          if(result.second!==result.fallback.src) throw new Error('Repeated fallback changed source');
          if(errors.length) throw new Error('Page errors: '+errors.join(' | '));
          console.log('LIVEASTA player asset browser smoke: OK');
          await browser.close();
          EOF
          node dev/tests/clean23-assets-smoke.mjs
      - name: Commit and self-remove temporary files
        run: |
          rm -f dev/tests/clean23-assets-smoke.mjs
          rm -f .github/workflows/liveasta-clean23-extract-assets.yml dev/tools/clean23_extract_assets.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/index.html dev/scripts/app.js dev/scripts/player-assets.js dev/CLEANUP_REPORT_CLEAN23_ASSETS.txt .github/workflows/liveasta-clean23-extract-assets.yml dev/tools/clean23_extract_assets.mjs
          git commit -m "LIVEASTA DEV clean23 extract player asset module"
          git push
