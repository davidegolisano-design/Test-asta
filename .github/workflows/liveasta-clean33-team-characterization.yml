name: LIVEASTA DEV clean33 team characterization
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean33-team-characterization.yml'
permissions:
  contents: write
jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Validate JavaScript
        run: for f in dev/scripts/*.js; do node --check "$f"; done
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/liveasta-http.log 2>&1 &
          sleep 2
      - name: Run general regression
        run: |
          node dev/tests/smoke.mjs
          node dev/tests/regression-smoke.mjs
      - name: Characterize team logic with snapshot
        run: node dev/tests/team-logic-smoke.mjs
      - name: Write report
        run: |
          cat > dev/CLEANUP_REPORT_CLEAN33_TEAM_CHARACTERIZATION.txt <<'EOF'
          LIVEASTA CLEAN-33 - TEAM LOGIC CHARACTERIZATION
          =================================================
          No application code changed.

          Added persistent test: tests/team-logic-smoke.mjs
          Characterized current behavior for:
           - teamPurchases team filtering
           - teamCounts in Classic and Mantra
           - findTeamByName
           - maxBidForTeam with Classic role caps/reserved credits
           - maxBidForTeam with Mantra goalkeeper-feasibility constraint

          General smoke and shared module regression also passed.
          This test is intended to guard the next team-logic module extraction.
          EOF
      - name: Commit report and self-remove
        run: |
          rm -f .github/workflows/liveasta-clean33-team-characterization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/tests/team-logic-smoke.mjs dev/CLEANUP_REPORT_CLEAN33_TEAM_CHARACTERIZATION.txt .github/workflows/liveasta-clean33-team-characterization.yml
          git commit -m "LIVEASTA DEV clean33 characterize team logic"
          git push
