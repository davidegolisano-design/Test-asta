name: Apply v0.87 management UX
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v087-management.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8',errors='ignore')
          css='<link rel="stylesheet" href="./management-v087.css?v=087">'
          if css not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          js='<script src="./management-v087.js?v=087"></script>'
          if js not in s:
              s=s.replace('</body>',js+'\n</body>',1)
          s=s.replace("setTimeout(()=>search?.focus({preventScroll:true}),60);","search?.blur();")
          s=s.replace('v0.86','v0.87').replace('V0.86','V0.87')
          s=s.replace('pwa-install.js?v=086','pwa-install.js?v=087')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "v0.87 collapsible responsive management and mobile role badge" && git push)
