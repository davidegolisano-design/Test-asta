name: LIVEASTA PLAYER-02 canonical red timer
on:
  push:
    paths:
      - '.github/workflows/liveasta-player02-red.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize final countdown red
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dev/styles/refinements.css')
          s=p.read_text(encoding='utf-8')
          marker='/* === PLAYER-02: player theme palette + final countdown 3-0 === */'
          head,tail=s.split(marker,1)
          tail=tail.replace('color:var(--theme-danger)!important;','color:#FF334F!important;',1)
          tail=tail.replace('-webkit-text-fill-color:var(--theme-danger)!important;','-webkit-text-fill-color:#FF334F!important;',1)
          tail=tail.replace('text-shadow:0 0 14px color-mix(in srgb,var(--theme-danger) 38%,transparent)!important;','text-shadow:0 0 14px rgba(255,51,79,.34)!important;',1)
          p.write_text(head+marker+tail,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'color:#FF334F!important' dev/styles/refinements.css
          grep -q 'PLAYER-02: player theme palette' dev/styles/refinements.css
      - name: Commit
        run: |
          rm -f .github/workflows/liveasta-player02-red.yml
          git config user.name 'liveasta-dev-bot'
          git config user.email 'liveasta-dev-bot@users.noreply.github.com'
          git add dev/styles/refinements.css .github/workflows/liveasta-player02-red.yml
          git commit -m 'Normalize PLAYER-02 final countdown red'
          git push origin main
