name: LIVEASTA DEV clean15 dead PWA runtime cleanup
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean15-pwa.yml'
permissions:
  contents: write
jobs:
  clean15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CLEAN-15
        run: python .github/clean15.py
      - name: Validate application sources
        run: |
          for f in dev/scripts/*.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          p=Path('dev/scripts/pwa.js').read_text(encoding='utf-8')
          i=Path('dev/index.html').read_text(encoding='utf-8')
          assert 'cleanupMalformedLegacy' not in p
          assert 'liveasta-v076-desktop-board' not in p
          assert 'document.title=' not in p
          assert 'CLEAN-15' in i and '094-clean15a' in i
          print('CLEAN-15 checks: OK')
          PY
      - name: Commit and self-remove temporary files
        run: |
          rm -f .github/clean15.py .github/workflows/liveasta-clean15-pwa.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev .github/clean15.py .github/workflows/liveasta-clean15-pwa.yml
          git commit -m "LIVEASTA DEV v0.94 clean15 remove dead PWA runtime cleanup"
          git push
