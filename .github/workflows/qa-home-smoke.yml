name: LIVEASTA QA smoke
on:
  push:
    paths:
      - 'qa/live-lib.mjs'
      - 'qa/three-team-core.mjs'
      - '.github/workflows/qa-home-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y && npm install playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node qa/three-team-core.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liveasta-three-team-core
          path: qa-output/
          retention-days: 1