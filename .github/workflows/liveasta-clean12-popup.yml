name: LIVEASTA DEV clean12 popup ownership cleanup
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean12-popup.yml'
permissions:
  contents: write
jobs:
  clean12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply popup consolidation
        run: python .github/scripts/liveasta_clean12_popup.py
      - name: Validate application sources
        run: |
          for f in dev/scripts/*.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          s=Path('dev/scripts/runtime.js').read_text(encoding='utf-8')
          assert s.count('window.appConfirm=function') == 1
          assert s.count('window.appAlert=function') == 1
          assert s.count('window.alert=function') == 1
          assert 'originalAppAlert' not in s
          assert 'originalAppConfirm' not in s
          print('Popup ownership checks: OK')
          PY
      - name: Commit and self-remove temporary files
        run: |
          rm -f .github/workflows/liveasta-clean12-popup.yml .github/scripts/liveasta_clean12_popup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev .github/workflows/liveasta-clean12-popup.yml .github/scripts/liveasta_clean12_popup.py
          git commit -m "LIVEASTA DEV v0.94 clean12 consolidate popup ownership"
          git push