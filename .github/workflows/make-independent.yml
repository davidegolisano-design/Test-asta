name: Make Test-asta independent

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/make-independent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-independent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Test-asta
        uses: actions/checkout@v4
        with:
          path: target

      - name: Checkout source assets
        uses: actions/checkout@v4
        with:
          repository: davidegolisano-design/live-asta
          ref: main
          path: source

      - name: Copy local assets
        shell: bash
        run: |
          set -e
          rm -rf target/assets
          cp -a source/assets target/assets
          cp source/buzz.mp3 target/buzz.mp3
          cp source/fischio.mp3 target/fischio.mp3
          cp source/gong.mp3 target/gong.mp3
          cp source/preparazione.mp3 target/preparazione.mp3
          cp source/icon-192.png target/icon-192.png
          cp source/icon-256.png target/icon-256.png
          cp source/icon-512.png target/icon-512.png
          cp source/service-worker.js target/service-worker.js

      - name: Convert app to local asset paths
        shell: python
        run: |
          from pathlib import Path
          import json

          root = Path('target')
          remote = 'https://raw.githubusercontent.com/davidegolisano-design/live-asta/main'

          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          text = text.replace(remote, '.')
          index.write_text(text, encoding='utf-8')

          manifest = root / 'manifest-v22.webmanifest'
          data = json.loads(manifest.read_text(encoding='utf-8'))
          for icon in data.get('icons', []):
              src = str(icon.get('src', ''))
              if src.startswith(remote + '/'):
                  icon['src'] = src[len(remote)+1:]
              elif src.startswith('./'):
                  icon['src'] = src[2:]
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme = root / 'README_PRIMA_INSTALLAZIONE.txt'
          if readme.exists():
              r = readme.read_text(encoding='utf-8')
              r = r.replace(
                  'Per questo test miniature, audio e icone vengono letti dal repository live-asta esistente.\nNon devi quindi duplicare adesso la cartella assets o i file MP3 nel repository Test-asta.\nIl nuovo Supabase e tutta la logica dell\'app restano invece separati.\n\nQuando questa versione sarà stabile possiamo fare il pacchetto completamente indipendente\ncopiando anche tutti gli asset.\n',
                  'Questa installazione è completamente indipendente: miniature, audio, icone e service worker sono contenuti direttamente nel repository Test-asta.\n'
              )
              readme.write_text(r, encoding='utf-8')

      - name: Commit independent assets
        working-directory: target
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest-v22.webmanifest README_PRIMA_INSTALLAZIONE.txt assets buzz.mp3 fischio.mp3 gong.mp3 preparazione.mp3 icon-192.png icon-256.png icon-512.png service-worker.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Make Test-asta fully independent'
          git push origin main
