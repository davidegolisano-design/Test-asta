name: LIVEASTA DEV clean21 extract audio
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean21-extract-audio.yml'
permissions:
  contents: write
jobs:
  clean21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser and Playwright
        run: |
          npm install --no-save espree playwright
          npx playwright install --with-deps chromium
      - name: Apply CLEAN-21 audio extraction
        run: node dev/tools/clean21_extract_audio.mjs
      - name: Validate JavaScript and ownership
        run: |
          for f in dev/scripts/*.js; do node --check "$f"; done
          grep -q 'scripts/audio.js?dev=094-clean21a' dev/index.html
          ! grep -q 'function playSound' dev/scripts/app.js
          grep -q 'function playSound' dev/scripts/audio.js
          ! grep -q "const AUDIO_SETTINGS_KEY" dev/scripts/app.js
          grep -q "const AUDIO_SETTINGS_KEY" dev/scripts/audio.js
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/liveasta-http.log 2>&1 &
          sleep 2
      - name: Run existing browser smoke
        run: node dev/tests/smoke.mjs
      - name: Run audio browser smoke
        run: |
          cat > /tmp/audio-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173/dev/index.html?audio-smoke=1',{waitUntil:'domcontentloaded'});
          await page.waitForTimeout(1200);
          for(const name of ['openAudioMixer','closeAudioMixer','loadAudioSettings','saveAudioSettings','playSound','speakBidValue','playAuctionFinalCountdown']){
            if(!(await page.evaluate(n=>typeof window[n]==='function',name))) throw new Error(name+' missing');
          }
          await page.evaluate(()=>openAudioMixer());
          const modal=page.locator('#audio-mixer-modal');
          if(!(await modal.evaluate(el=>el.classList.contains('open')))) throw new Error('Audio mixer did not open');
          const prep=await page.locator('#vol-audio-prep').inputValue();
          const voice=await page.locator('#vol-bid-voice').inputValue();
          if(prep!=='70' || voice!=='100') throw new Error(`Unexpected defaults prep=${prep} voice=${voice}`);
          await page.evaluate(()=>closeAudioMixer());
          if(await modal.evaluate(el=>el.classList.contains('open'))) throw new Error('Audio mixer did not close');
          if(errors.length) throw new Error('Page errors: '+errors.join(' | '));
          console.log('LIVEASTA audio browser smoke: OK');
          await browser.close();
          EOF
          node /tmp/audio-smoke.mjs
      - name: Commit and self-remove temporary files
        run: |
          rm -f .github/workflows/liveasta-clean21-extract-audio.yml dev/tools/clean21_extract_audio.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/index.html dev/scripts/app.js dev/scripts/audio.js dev/CLEANUP_REPORT_CLEAN21_AUDIO.txt .github/workflows/liveasta-clean21-extract-audio.yml dev/tools/clean21_extract_audio.mjs
          git commit -m "LIVEASTA DEV clean21 extract audio module"
          git push
