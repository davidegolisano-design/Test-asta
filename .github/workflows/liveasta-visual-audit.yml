name: LIVEASTA DEV visual audit
on:
  push:
    paths:
      - '.github/workflows/liveasta-visual-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright and image tools
        run: |
          npm install --no-save playwright sharp
          npx playwright install --with-deps chromium
      - name: Start DEV locally
        run: |
          python3 -m http.server 4173 >/tmp/liveasta-http.log 2>&1 &
          sleep 2
      - name: Run visual audit
        run: node dev/tests/visual-audit.mjs
      - name: Commit audit baseline and self-remove workflow
        run: |
          rm -f .github/workflows/liveasta-visual-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/visual-audit dev/tests/visual-audit.mjs .github/workflows/liveasta-visual-audit.yml
          git commit -m "LIVEASTA DEV visual audit baseline"
          git push
