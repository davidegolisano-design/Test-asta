name: LIVEASTA DEV clean19 extract CSV utilities
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean19-extract-csv.yml'
permissions:
  contents: write
jobs:
  clean19:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: npm install --no-save acorn
      - name: Apply CLEAN-19 extraction
        run: node .github/clean19_extract_csv.js
      - name: Validate syntax and ownership
        run: |
          for f in dev/scripts/*.js; do node --check "$f"; done
          node - <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const app=fs.readFileSync('dev/scripts/app.js','utf8');
          const util=fs.readFileSync('dev/scripts/csv-import-utils.js','utf8');
          const names=['csvImportNormalize','csvImportDetectDelimiter','parseCsvRows','csvImportHeaderIndex','csvImportLooksLikeHeader','csvImportColumnMap','csvImportPrice'];
          for(const n of names){
            if(new RegExp('function\\s+'+n+'\\s*\\(').test(app)) throw new Error(n+' still in app.js');
            if(!new RegExp('function\\s+'+n+'\\s*\\(').test(util)) throw new Error(n+' missing in csv-import-utils.js');
          }
          const ctx={}; vm.createContext(ctx); vm.runInContext(util,ctx);
          if(ctx.csvImportNormalize(' À B-C ')!=='abc') throw new Error('normalize regression');
          const parsed=ctx.parseCsvRows('Team;ID;Prezzo\nA;1;10');
          if(parsed.delimiter!==';' || parsed.rows.length!==2 || parsed.rows[1][2]!=='10') throw new Error('CSV parser regression');
          if(ctx.csvImportPrice(' 10,4 € ')!==10) throw new Error('price regression');
          const html=fs.readFileSync('dev/index.html','utf8');
          if(html.indexOf('csv-import-utils.js')<0 || html.indexOf('csv-import-utils.js')>html.indexOf('scripts/app.js')) throw new Error('script order regression');
          console.log('CLEAN-19 module checks: OK');
          NODE
      - name: Commit and self-remove temporary files
        run: |
          rm -f .github/clean19_extract_csv.js .github/workflows/liveasta-clean19-extract-csv.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev .github/clean19_extract_csv.js .github/workflows/liveasta-clean19-extract-csv.yml
          git commit -m "LIVEASTA DEV v0.94 clean19 extract CSV parsing utilities"
          git push
