name: Apply v0.92 smartphone management
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v092-mobile-management.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v0.92
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8',errors='ignore')
          s=s.replace('<link rel="stylesheet" href="./management-mobile-v091.css?v=091">','<link rel="stylesheet" href="./management-mobile-v092.css?v=092">')
          if '<link rel="stylesheet" href="./management-mobile-v092.css?v=092">' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="./management-mobile-v092.css?v=092">\n</head>',1)
          s=s.replace('<script src="./management-mobile-v091.js?v=091"></script>','<script src="./management-mobile-v092.js?v=092"></script>')
          if '<script src="./management-mobile-v092.js?v=092"></script>' not in s:
              s=s.replace('</body>','<script src="./management-mobile-v092.js?v=092"></script>\n</body>',1)
          s=s.replace('v0.91','v0.92').replace('V0.91','V0.92')
          s=s.replace('pwa-install.js?v=091','pwa-install.js?v=092')
          p.write_text(s,encoding='utf-8')

          p=Path('pwa-install.js')
          s=p.read_text(encoding='utf-8',errors='ignore')
          s=s.replace("document.title='v0.91 TEST';","document.title='v0.92 TEST';")
          s=s.replace('liveasta-v091-runtime-style','liveasta-v092-runtime-style')
          p.write_text(s,encoding='utf-8')

          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"liveasta-test-v\d+-pwa1","liveasta-test-v092-pwa1",s)
          p.write_text(s,encoding='utf-8')

          p=Path('manifest-v22.webmanifest')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'"start_url"\s*:\s*"[^"]*"','"start_url": "./?v=092-test"',s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pwa-install.js service-worker.js manifest-v22.webmanifest
          git diff --cached --quiet || (git commit -m "v0.92 reorganize smartphone management" && git push)
