name: Add all-role options
on:
  push:
    paths:
      - '.github/workflows/add-all-role-options.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/patch_all_roles.py
      - name: Validate and commit
        run: |
          node --check scripts/app.js
          node --check scripts/mantra-auction.js
          grep -q 'toggleNominationAllRoles' scripts/app.js
          grep -q 'auto-random-role-btn-ALL' scripts/mantra-auction.js
          grep -q 'TUTTI I RUOLI' scripts/app.js
          git config user.name liveasta-release-bot
          git config user.email liveasta-release-bot@users.noreply.github.com
          git add scripts/app.js scripts/mantra-auction.js styles/management.css index.html
          git rm .github/workflows/add-all-role-options.yml .github/patch_all_roles.py
          git commit -m 'Add all-role options to random and Classic turn mode'
          git push