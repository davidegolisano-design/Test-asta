name: LIVEASTA DEV clean04 exact CSS dedupe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/liveasta-clean04.yml'

permissions:
  contents: write

jobs:
  clean04:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove only exact duplicate sibling CSS rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_files=sorted(Path('dev/styles').glob('*.css'))

          def strip_comments_ws(s):
              s=re.sub(r'/\*.*?\*/','',s,flags=re.S)
              return re.sub(r'\s+',' ',s).strip()

          def find_matching(text, start):
              depth=0; i=start; quote=None; comment=False
              while i < len(text):
                  if comment:
                      if text.startswith('*/',i): comment=False; i+=2; continue
                      i+=1; continue
                  if quote:
                      if text[i]=='\\': i+=2; continue
                      if text[i]==quote: quote=None
                      i+=1; continue
                  if text.startswith('/*',i): comment=True; i+=2; continue
                  ch=text[i]
                  if ch in ('"',"'"): quote=ch; i+=1; continue
                  if ch=='{': depth+=1
                  elif ch=='}':
                      depth-=1
                      if depth==0: return i
                  i+=1
              raise ValueError('unmatched brace')

          def split_siblings(text):
              # returns chunks: raw text outside rule + complete block rules / statements
              out=[]; pos=0; i=0; n=len(text); quote=None; comment=False
              while i<n:
                  if comment:
                      if text.startswith('*/',i): comment=False; i+=2; continue
                      i+=1; continue
                  if quote:
                      if text[i]=='\\': i+=2; continue
                      if text[i]==quote: quote=None
                      i+=1; continue
                  if text.startswith('/*',i): comment=True; i+=2; continue
                  ch=text[i]
                  if ch in ('"',"'"): quote=ch; i+=1; continue
                  if ch=='{':
                      # prelude starts after previous top-level ; or } but include comments/space from pos
                      end=find_matching(text,i)
                      out.append(('block',text[pos:end+1]))
                      pos=end+1; i=end+1; continue
                  if ch==';':
                      # at top level statement/import/custom declaration; preserve as its own item
                      out.append(('stmt',text[pos:i+1])); pos=i+1
                  i+=1
              if pos<n: out.append(('tail',text[pos:]))
              return out

          def dedupe_level(text):
              items=split_siblings(text)
              seen=set(); kept_rev=[]; removed=0
              # Keep last exact duplicate, because it is the authoritative cascade occurrence.
              for typ,raw in reversed(items):
                  if typ!='block':
                      kept_rev.append((typ,raw)); continue
                  brace=raw.find('{')
                  if brace<0:
                      kept_rev.append((typ,raw)); continue
                  pre=raw[:brace]
                  end=raw.rfind('}')
                  body=raw[brace+1:end]
                  # recursively dedupe children only for at-rules containing nested rule blocks
                  if pre.lstrip().startswith('@') and '{' in body:
                      try:
                          newbody,r=dedupe_level(body)
                          removed+=r
                          raw=raw[:brace+1]+newbody+raw[end:]
                          body=newbody
                      except Exception:
                          pass
                  key=strip_comments_ws(pre)+'{'+strip_comments_ws(body)+'}'
                  if key in seen and key.strip()!='{}':
                      removed+=1
                      # Preserve leading whitespace/comments only if meaningful comments exist.
                      comments=''.join(re.findall(r'/\*.*?\*/',raw[:brace],flags=re.S))
                      if comments.strip(): kept_rev.append(('tail',comments+'\n'))
                      continue
                  seen.add(key)
                  kept_rev.append((typ,raw))
              return ''.join(raw for _,raw in reversed(kept_rev)),removed

          report=['LIVEASTA CLEAN-04 - EXACT CSS DEDUPE','===================================','Only byte/whitespace-equivalent sibling rules in the same nesting level are removed.','']
          total=0
          for f in css_files:
              before=f.read_text(encoding='utf-8',errors='ignore')
              try:
                  after,removed=dedupe_level(before)
              except Exception as e:
                  report.append(f'{f.name}: skipped ({e})')
                  continue
              if removed:
                  f.write_text(after,encoding='utf-8')
              total+=removed
              report.append(f'{f.name}: removed {removed} exact duplicate rule blocks; {len(before):,} -> {len(after):,} chars')
          report.append('')
          report.append(f'TOTAL EXACT DUPLICATE RULE BLOCKS REMOVED: {total}')
          Path('dev/CLEANUP_REPORT_CLEAN04.txt').write_text('\n'.join(report)+'\n',encoding='utf-8')

          # Version/cache marker only; no public root changes.
          idx=Path('dev/index.html')
          html=idx.read_text(encoding='utf-8',errors='ignore')
          html=html.replace('CLEAN-03','CLEAN-04').replace('094-clean03a','094-clean04a')
          idx.write_text(html,encoding='utf-8')
          p=Path('dev/scripts/pwa.js')
          js=p.read_text(encoding='utf-8',errors='ignore').replace('CLEAN-03','CLEAN-04')
          p.write_text(js,encoding='utf-8')
          PY

      - name: Validate JS and DEV marker
        run: |
          set -e
          for f in dev/scripts/*.js; do node --check "$f"; done
          grep -q 'AMBIENTE DEV · v0.94 CLEAN-04' dev/index.html
          test -f dev/CLEANUP_REPORT_CLEAN04.txt

      - name: Commit and self-remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/liveasta-clean04.yml
          git add -A dev .github/workflows/liveasta-clean04.yml
          git diff --cached --quiet || (git commit -m "LIVEASTA DEV v0.94 clean04 exact CSS dedupe" && git push)
