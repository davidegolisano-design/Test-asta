name: LIVEASTA DEV clean22 extract UI fit
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean22-extract-ui-fit.yml'
permissions:
  contents: write
jobs:
  clean22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser and Playwright
        run: |
          npm install --no-save espree playwright
          npx playwright install --with-deps chromium
      - name: Apply CLEAN-22 UI fit extraction
        run: node dev/tools/clean22_extract_ui_fit.mjs
      - name: Validate JavaScript and ownership
        run: |
          for f in dev/scripts/*.js; do node --check "$f"; done
          grep -q 'scripts/ui-fit.js?dev=094-clean22a' dev/index.html
          ! grep -q 'function fitAuctionNames' dev/scripts/app.js
          grep -q 'function fitAuctionNames' dev/scripts/ui-fit.js
          ! grep -q 'function fitTextToBox' dev/scripts/app.js
          grep -q 'function fitTextToBox' dev/scripts/ui-fit.js
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/liveasta-http.log 2>&1 &
          sleep 2
      - name: Run browser smoke
        run: node dev/tests/smoke.mjs
      - name: Run audio smoke
        run: node dev/tests/audio-smoke.mjs
      - name: Run UI fit smoke
        run: node dev/tests/ui-fit-smoke.mjs
      - name: Commit and self-remove temporary files
        run: |
          rm -f .github/workflows/liveasta-clean22-extract-ui-fit.yml dev/tools/clean22_extract_ui_fit.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/index.html dev/scripts/app.js dev/scripts/ui-fit.js dev/tests/ui-fit-smoke.mjs dev/CLEANUP_REPORT_CLEAN22_UI_FIT.txt .github/workflows/liveasta-clean22-extract-ui-fit.yml dev/tools/clean22_extract_ui_fit.mjs
          git commit -m "LIVEASTA DEV clean22 extract UI fit module"
          git push
