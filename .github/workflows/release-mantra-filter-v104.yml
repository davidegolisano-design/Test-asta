name: Publish Mantra filter UI
on:
  push:
    paths:
      - '.github/workflows/release-mantra-filter-v104.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire Mantra filter UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if './styles/mantra-filter-ui.css?v=104' not in s:
              s=s.replace('    <link rel="stylesheet" href="./styles/roles.css?v=103">','    <link rel="stylesheet" href="./styles/roles.css?v=103">\n    <link rel="stylesheet" href="./styles/mantra-filter-ui.css?v=104">',1)
          s=s.replace('./scripts/mantra-filter-ui.js?v=103','./scripts/mantra-filter-ui.js?v=104')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q 'styles/mantra-filter-ui.css?v=104' index.html
          grep -q 'scripts/mantra-filter-ui.js?v=104' index.html
          grep -q 'v1.0' index.html
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'liveasta-release-bot'
          git config user.email 'liveasta-release-bot@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/release-mantra-filter-v104.yml
          git commit -m 'Publish Mantra category subfilters and badge fix'
          git push
