name: Apply v0.90 management and sealed
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v090-management-sealed.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v0.90
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8',errors='ignore')

          css='<link rel="stylesheet" href="./management-v090.css?v=090">'
          if css not in s:
              s=s.replace('</head>',css+'\n</head>',1)

          # Rimuove i vecchi controller JS della Gestione: la v0.90 li sostituisce.
          s=re.sub(r'\s*<script src="\./management-v087\.js\?v=087"></script>\s*','\n',s)
          s=re.sub(r'\s*<script src="\./management-v088\.js\?v=088"></script>\s*','\n',s)

          s=s.replace('<script src="./sealed-v089.js?v=089"></script>','<script src="./sealed-v090.js?v=090"></script>')
          if '<script src="./sealed-v090.js?v=090"></script>' not in s:
              s=s.replace('</body>','<script src="./sealed-v090.js?v=090"></script>\n</body>',1)

          mg='<script src="./management-v090.js?v=090"></script>'
          if mg not in s:
              s=s.replace('</body>',mg+'\n</body>',1)

          s=s.replace('v0.89','v0.90').replace('V0.89','V0.90')
          s=s.replace('pwa-install.js?v=089','pwa-install.js?v=090')
          p.write_text(s,encoding='utf-8')

          p=Path('pwa-install.js')
          s=p.read_text(encoding='utf-8',errors='ignore')
          s=s.replace("document.title='v0.89 TEST';","document.title='v0.90 TEST';")
          s=s.replace('liveasta-v089-runtime-style','liveasta-v090-runtime-style')
          p.write_text(s,encoding='utf-8')

          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"liveasta-test-v\d+-pwa1","liveasta-test-v090-pwa1",s)
          p.write_text(s,encoding='utf-8')

          p=Path('manifest-v22.webmanifest')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'"start_url"\s*:\s*"[^"]*"','"start_url": "./?v=090-test"',s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pwa-install.js service-worker.js manifest-v22.webmanifest
          git diff --cached --quiet || (git commit -m "v0.90 fix sealed final3 and rebuild management UI" && git push)
