name: Fix player listone search
on:
  push:
    paths:
      - '.github/workflows/fix-player-listone-search.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply search fix
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path('scripts/list-filters.js'), Path('scripts/mantra-filter-ui.js')]
          old = "const search=document.querySelector('#list-filters-'+view+' .unified-search');"
          new = "const search=listFilterViews?.[view]?.search ? document.getElementById(listFilterViews[view].search) : document.querySelector('#list-filters-'+view+' .unified-search');"
          for path in files:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected search lookup not found in {path}')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          idx = Path('index.html')
          text = idx.read_text(encoding='utf-8')
          text = text.replace('./scripts/list-filters.js?v=113', './scripts/list-filters.js?v=119')
          text = text.replace('./scripts/mantra-filter-ui.js?v=109', './scripts/mantra-filter-ui.js?v=119')
          idx.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          text = sw.read_text(encoding='utf-8').replace("liveasta-v1.0-118", "liveasta-v1.0-119")
          sw.write_text(text, encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          node --check scripts/list-filters.js
          node --check scripts/mantra-filter-ui.js
      - name: Commit fix
        run: |
          git config user.name 'liveasta-release-bot'
          git config user.email 'liveasta-release-bot@users.noreply.github.com'
          git add scripts/list-filters.js scripts/mantra-filter-ui.js index.html service-worker.js
          git rm .github/workflows/fix-player-listone-search.yml
          git commit -m 'Fix player listone search input binding'
          git push
