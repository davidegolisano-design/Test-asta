name: Rebuild LIVEASTA Icon Pack

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rebuild-liveasta-icon-pack.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python3 -m pip install --upgrade pillow

      - name: Generate complete icon pack from canonical source
        shell: python
        run: |
          from PIL import Image
          from pathlib import Path
          import shutil

          src_path = Path("assets/liveasta-icon-source.webp")
          src = Image.open(src_path).convert("RGBA")
          src.load()
          assert src.size == (512, 512), src.size

          icons_dir = Path("assets/icons")
          icons_dir.mkdir(parents=True, exist_ok=True)

          # Rebuild a metadata-free canonical PNG from the uploaded artwork source.
          canonical = Image.frombytes("RGBA", src.size, src.tobytes())
          canonical.save(icons_dir / "liveasta-source-512.png", "PNG", optimize=False, compress_level=6)

          def exact(size, path):
              im = canonical.resize((size, size), Image.Resampling.LANCZOS)
              im.save(path, "PNG", optimize=False, compress_level=6)

          def padded(size, scale, path, background=None):
              canvas = Image.new("RGBA", (size, size), background or (0,0,0,0))
              inner = round(size * scale)
              art = canonical.resize((inner, inner), Image.Resampling.LANCZOS)
              x = (size - inner) // 2
              y = (size - inner) // 2
              canvas.alpha_composite(art, (x, y))
              canvas.save(path, "PNG", optimize=False, compress_level=6)

          # Complete reusable icon pack.
          for size in (32, 48, 72, 96, 120, 144, 152, 167, 180, 192, 256, 384, 512):
              exact(size, icons_dir / f"liveasta-{size}.png")

          # PWA "any": exact artwork from source; no extra crop or reinterpretation.
          exact(192, Path("icon-192.png"))
          exact(512, Path("icon-512.png"))

          # PWA maskable: same artwork, only reduced inside a black safe canvas.
          padded(192, 0.68, Path("icon-maskable-192.png"), (0,0,0,255))
          padded(512, 0.68, Path("icon-maskable-512.png"), (0,0,0,255))

          # Android adaptive foreground: same artwork inside Android safe zone.
          fg = Path("android-app/app/src/main/res/drawable-nodpi/ic_launcher_liveasta_foreground.png")
          fg.parent.mkdir(parents=True, exist_ok=True)
          padded(432, 0.64, fg)

          # Legacy Android launcher density set, directly from the same source.
          densities = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }
          for density, size in densities.items():
              target = Path(f"android-app/app/src/main/res/mipmap-{density}/ic_launcher_liveasta.png")
              target.parent.mkdir(parents=True, exist_ok=True)
              exact(size, target)

          # nodpi fallback as well.
          fallback = Path("android-app/app/src/main/res/mipmap-nodpi/ic_launcher_liveasta.png")
          fallback.parent.mkdir(parents=True, exist_ok=True)
          exact(512, fallback)

          # Remove previous experimental icon assets to prevent accidental reuse.
          for old in [
              "liveasta-icon-padded-192.png",
              "liveasta-icon-padded-512.png",
              "liveasta-icon-maskable-192.png",
              "liveasta-icon-maskable-512.png",
              "liveasta-icon-192-v2.png",
              "liveasta-icon-512-v2.png",
          ]:
              Path(old).unlink(missing_ok=True)

          print("Canonical source:", src_path, src.size)
          print("Generated complete icon pack from canonical source.")

      - name: Write Android adaptive icon resources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/res/mipmap-anydpi-v26

          cat > android-app/app/src/main/res/drawable/ic_launcher_liveasta_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#000000"/>
          </shape>
          EOF

          cat > android-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher_liveasta.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_liveasta_background"/>
              <foreground android:drawable="@drawable/ic_launcher_liveasta_foreground"/>
          </adaptive-icon>
          EOF

      - name: Update PWA references
        shell: python
        run: |
          from pathlib import Path
          import json, re

          manifest = {
              "id": "/",
              "name": "LIVEASTA",
              "short_name": "LIVEASTA",
              "description": "LIVEASTA - gestione aste fantacalcio in tempo reale",
              "start_url": "/",
              "scope": "/",
              "display": "standalone",
              "orientation": "portrait-primary",
              "background_color": "#11151B",
              "theme_color": "#11151B",
              "prefer_related_applications": False,
              "icons": [
                  {"src": "/icon-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any"},
                  {"src": "/icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any"},
                  {"src": "/icon-maskable-192.png", "sizes": "192x192", "type": "image/png", "purpose": "maskable"},
                  {"src": "/icon-maskable-512.png", "sizes": "512x512", "type": "image/png", "purpose": "maskable"},
              ],
          }
          Path("manifest.webmanifest").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          s = re.sub(
              r'<link rel="icon" type="image/png" sizes="192x192" href="[^"]+">',
              '<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=140">',
              s
          )
          # Add small favicon if not already present.
          if 'sizes="32x32"' not in s:
              s = s.replace(
                  '<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=140">',
                  '<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/liveasta-32.png?v=140">\n'
                  '    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=140">'
              )
          s = re.sub(
              r'<link rel="apple-touch-icon" href="[^"]+">',
              '<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/liveasta-180.png?v=140">',
              s
          )
          s = re.sub(
              r'<link rel="manifest" href="[^"]+">',
              '<link rel="manifest" href="/manifest.webmanifest?v=140">',
              s
          )
          s = re.sub(
              r'<script src="\./scripts/pwa\.js\?v=[^"]+"></script>',
              '<script src="./scripts/pwa.js?v=140-iconpack"></script>',
              s
          )
          p.write_text(s, encoding="utf-8")

          p = Path("scripts/pwa.js")
          s = p.read_text(encoding="utf-8")
          s = re.sub(
              r"navigator\.serviceWorker\.register\('/service-worker\.js\?v=\d+'",
              "navigator.serviceWorker.register('/service-worker.js?v=140'",
              s
          )
          p.write_text(s, encoding="utf-8")

          p = Path("service-worker.js")
          s = p.read_text(encoding="utf-8")
          s = re.sub(
              r"const CACHE = '[^']+';",
              "const CACHE = 'liveasta-v1.04-140-canonical-icon-pack';",
              s
          )
          p.write_text(s, encoding="utf-8")

      - name: Ensure splash uses adaptive foreground
        shell: python
        run: |
          from pathlib import Path
          p = Path("android-app/app/src/main/res/values-v31/styles.xml")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              '<item name="android:windowSplashScreenAnimatedIcon">@mipmap/ic_launcher_liveasta</item>',
              '<item name="android:windowSplashScreenAnimatedIcon">@drawable/ic_launcher_liveasta_foreground</item>'
          )
          p.write_text(s, encoding="utf-8")

      - name: Validate every generated icon
        shell: python
        run: |
          from PIL import Image
          from pathlib import Path

          checks = {
              "icon-192.png": (192,192),
              "icon-512.png": (512,512),
              "icon-maskable-192.png": (192,192),
              "icon-maskable-512.png": (512,512),
              "assets/icons/liveasta-32.png": (32,32),
              "assets/icons/liveasta-180.png": (180,180),
              "assets/icons/liveasta-source-512.png": (512,512),
              "android-app/app/src/main/res/drawable-nodpi/ic_launcher_liveasta_foreground.png": (432,432),
              "android-app/app/src/main/res/mipmap-mdpi/ic_launcher_liveasta.png": (48,48),
              "android-app/app/src/main/res/mipmap-hdpi/ic_launcher_liveasta.png": (72,72),
              "android-app/app/src/main/res/mipmap-xhdpi/ic_launcher_liveasta.png": (96,96),
              "android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher_liveasta.png": (144,144),
              "android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher_liveasta.png": (192,192),
          }
          for path, expected in checks.items():
              im = Image.open(path)
              im.load()
              assert im.size == expected, (path, im.size)
              print(path, im.mode, im.size)

      - name: Commit complete canonical icon pack
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Liveasta Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Replace all icons from canonical LIVEASTA artwork"
          git push origin HEAD:main

      - name: Wait for GitHub Pages
        shell: bash
        run: |
          set -euxo pipefail
          for i in $(seq 1 60); do
            body="$(curl -fsSL -H 'Cache-Control: no-cache' "https://liveasta.it/manifest.webmanifest?v=140&check=$i" || true)"
            if echo "$body" | grep -q '"src": "/icon-maskable-512.png"'; then
              echo "Canonical icon pack is live."
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify PWA icons with Chromium
        shell: bash
        run: |
          set -euxo pipefail
          npm install chrome-remote-interface@0.33.3
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:9222/json/version >/dev/null && break
            sleep 1
          done

          node <<'NODE'
          const CDP = require('chrome-remote-interface');
          const sleep = ms => new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const client = await CDP();
            const {Page, Runtime} = client;
            await Promise.all([Page.enable(), Runtime.enable()]);
            await Page.navigate({url:'https://liveasta.it/?canonical-icons=140'});
            await Page.loadEventFired();
            await sleep(8000);

            const manifest = await Page.getAppManifest();
            const errors = await Page.getInstallabilityErrors();
            console.log('MANIFEST ERRORS', JSON.stringify(manifest.errors,null,2));
            console.log('INSTALLABILITY', JSON.stringify(errors,null,2));

            const decode = await Runtime.evaluate({
              expression: `Promise.all(['/icon-192.png','/icon-512.png','/icon-maskable-192.png','/icon-maskable-512.png'].map(src=>fetch(src+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.blob()).then(async b=>{const bm=await createImageBitmap(b);const o={src,w:bm.width,h:bm.height,type:b.type,size:b.size};bm.close();return o;})))`,
              awaitPromise:true,
              returnByValue:true
            });
            console.log('ICON DECODE', JSON.stringify(decode.result.value,null,2));

            const bad = (errors.installabilityErrors || []).filter(e => e.errorId === 'no-acceptable-icon');
            if (bad.length) throw new Error('Chromium rejected the canonical PWA icons');
            if (manifest.errors?.length) throw new Error('Manifest has errors');
            await client.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
