name: Rebuild LIVEASTA Icon Pack

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rebuild-liveasta-icon-pack.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python3 -m pip install --upgrade pillow

      - name: Generate all icons from uploaded source
        shell: python
        run: |
          from PIL import Image
          from pathlib import Path
          import json, re, zipfile

          source = Path("liveasta-icon-source.png")
          if not source.exists():
              raise SystemExit("Missing liveasta-icon-source.png")

          src = Image.open(source).convert("RGBA")
          src.load()
          if src.size != (512, 512):
              raise SystemExit(f"Unexpected source size: {src.size}")

          icons = Path("assets/icons")
          icons.mkdir(parents=True, exist_ok=True)

          canonical = Image.frombytes("RGBA", src.size, src.tobytes())
          canonical.save(icons / "liveasta-source-512.png", "PNG", optimize=False, compress_level=6)
          canonical.save("assets/liveasta-icon-source.png", "PNG", optimize=False, compress_level=6)

          def exact(size, path):
              im = canonical.resize((size, size), Image.Resampling.LANCZOS)
              im = Image.frombytes("RGBA", im.size, im.tobytes())
              im.save(path, "PNG", optimize=False, compress_level=6)

          def padded(size, scale, path, transparent=False):
              bg = (0, 0, 0, 0) if transparent else (0, 0, 0, 255)
              canvas = Image.new("RGBA", (size, size), bg)
              inner = round(size * scale)
              art = canonical.resize((inner, inner), Image.Resampling.LANCZOS)
              art = Image.frombytes("RGBA", art.size, art.tobytes())
              xy = ((size-inner)//2, (size-inner)//2)
              canvas.alpha_composite(art, xy)
              canvas.save(path, "PNG", optimize=False, compress_level=6)

          # Reusable exact pack.
          for size in (32, 48, 72, 96, 120, 144, 152, 167, 180, 192, 256, 384, 512):
              exact(size, icons / f"liveasta-{size}.png")

          # Active PWA: same artwork, with safe border to prevent clipping.
          padded(192, 0.82, icons / "liveasta-pwa-any-192-v142.png")
          padded(512, 0.82, icons / "liveasta-pwa-any-512-v142.png")
          padded(192, 0.58, icons / "liveasta-pwa-maskable-192-v142.png")
          padded(512, 0.58, icons / "liveasta-pwa-maskable-512-v142.png")

          # Browser / Apple.
          exact(32, icons / "liveasta-favicon-32-v142.png")
          exact(48, icons / "liveasta-favicon-48-v142.png")
          padded(180, 0.82, icons / "liveasta-apple-touch-180-v142.png")

          # Android adaptive foreground.
          fg = Path("android-app/app/src/main/res/drawable-nodpi/ic_launcher_liveasta_foreground.png")
          fg.parent.mkdir(parents=True, exist_ok=True)
          padded(432, 0.58, fg, transparent=True)

          # Android legacy fallback + density set.
          fallback = Path("android-app/app/src/main/res/mipmap-nodpi/ic_launcher_liveasta.png")
          fallback.parent.mkdir(parents=True, exist_ok=True)
          padded(512, 0.80, fallback)

          densities = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }
          for density, size in densities.items():
              target = Path(f"android-app/app/src/main/res/mipmap-{density}/ic_launcher_liveasta.png")
              target.parent.mkdir(parents=True, exist_ok=True)
              padded(size, 0.80, target)

          # Android adaptive XML.
          Path("android-app/app/src/main/res/drawable/ic_launcher_liveasta_background.xml").write_text(
              """<?xml version="1.0" encoding="utf-8"?>
<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
    <solid android:color="#000000"/>
</shape>
""",
              encoding="utf-8"
          )
          Path("android-app/app/src/main/res/mipmap-anydpi-v26").mkdir(parents=True, exist_ok=True)
          Path("android-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher_liveasta.xml").write_text(
              """<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@drawable/ic_launcher_liveasta_background"/>
    <foreground android:drawable="@drawable/ic_launcher_liveasta_foreground"/>
</adaptive-icon>
""",
              encoding="utf-8"
          )

          # PWA manifest: new filenames force fresh icon download.
          manifest = {
              "id": "/",
              "name": "LIVEASTA",
              "short_name": "LIVEASTA",
              "description": "LIVEASTA - gestione aste fantacalcio in tempo reale",
              "start_url": "/",
              "scope": "/",
              "display": "standalone",
              "orientation": "portrait-primary",
              "background_color": "#11151B",
              "theme_color": "#11151B",
              "prefer_related_applications": False,
              "icons": [
                  {
                      "src": "/assets/icons/liveasta-pwa-any-192-v142.png",
                      "sizes": "192x192",
                      "type": "image/png",
                      "purpose": "any"
                  },
                  {
                      "src": "/assets/icons/liveasta-pwa-any-512-v142.png",
                      "sizes": "512x512",
                      "type": "image/png",
                      "purpose": "any"
                  },
                  {
                      "src": "/assets/icons/liveasta-pwa-maskable-192-v142.png",
                      "sizes": "192x192",
                      "type": "image/png",
                      "purpose": "maskable"
                  },
                  {
                      "src": "/assets/icons/liveasta-pwa-maskable-512-v142.png",
                      "sizes": "512x512",
                      "type": "image/png",
                      "purpose": "maskable"
                  }
              ]
          }
          Path("manifest.webmanifest").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )

          # HTML icon references.
          p = Path("index.html")
          html = p.read_text(encoding="utf-8")
          html = re.sub(
              r'<link rel="icon" type="image/png" sizes="32x32" href="[^"]+">',
              '<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/liveasta-favicon-32-v142.png">',
              html
          )
          html = re.sub(
              r'<link rel="icon" type="image/png" sizes="192x192" href="[^"]+">',
              '<link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/liveasta-pwa-any-192-v142.png">',
              html
          )
          html = re.sub(
              r'<link rel="apple-touch-icon"[^>]*>',
              '<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/liveasta-apple-touch-180-v142.png">',
              html
          )
          html = re.sub(
              r'<link rel="manifest" href="[^"]+">',
              '<link rel="manifest" href="/manifest.webmanifest?v=142">',
              html
          )
          html = re.sub(
              r'<script src="\./scripts/pwa\.js\?v=[^"]+"></script>',
              '<script src="./scripts/pwa.js?v=142-originalicon"></script>',
              html
          )
          p.write_text(html, encoding="utf-8")

          # Force PWA cache refresh.
          p = Path("scripts/pwa.js")
          js = p.read_text(encoding="utf-8")
          js = re.sub(
              r"navigator\.serviceWorker\.register\('/service-worker\.js\?v=\d+'",
              "navigator.serviceWorker.register('/service-worker.js?v=142'",
              js
          )
          p.write_text(js, encoding="utf-8")

          p = Path("service-worker.js")
          sw = p.read_text(encoding="utf-8")
          sw = re.sub(
              r"const CACHE = '[^']+';",
              "const CACHE = 'liveasta-v1.04-142-original-upload';",
              sw
          )
          p.write_text(sw, encoding="utf-8")

          # Android splash uses the same uploaded artwork.
          p = Path("android-app/app/src/main/res/values-v31/styles.xml")
          styles = p.read_text(encoding="utf-8")
          styles = re.sub(
              r'<item name="android:windowSplashScreenAnimatedIcon">[^<]+</item>',
              '<item name="android:windowSplashScreenAnimatedIcon">@drawable/ic_launcher_liveasta_foreground</item>',
              styles
          )
          p.write_text(styles, encoding="utf-8")

          # Downloadable package.
          readme = icons / "README.txt"
          readme.write_text(
              """LIVEASTA ICON PACK
Single source: /liveasta-icon-source.png

PWA:
- liveasta-pwa-any-192-v142.png
- liveasta-pwa-any-512-v142.png
- liveasta-pwa-maskable-192-v142.png
- liveasta-pwa-maskable-512-v142.png

Browser / Apple:
- liveasta-favicon-32-v142.png
- liveasta-favicon-48-v142.png
- liveasta-apple-touch-180-v142.png

Android:
- drawable-nodpi/ic_launcher_liveasta_foreground.png
- drawable/ic_launcher_liveasta_background.xml
- mipmap-anydpi-v26/ic_launcher_liveasta.xml
- mipmap-nodpi/ic_launcher_liveasta.png

All files are generated from the same uploaded artwork.
""",
              encoding="utf-8"
          )
          pack = icons / "liveasta-icon-pack-v142.zip"
          with zipfile.ZipFile(pack, "w", zipfile.ZIP_DEFLATED) as z:
              z.write(source, arcname="liveasta-icon-source.png")
              for f in sorted(icons.glob("*.png")):
                  z.write(f, arcname=f.name)
              z.write(readme, arcname="README.txt")
              z.write(fg, arcname="android/ic_launcher_liveasta_foreground.png")
              z.write(fallback, arcname="android/ic_launcher_liveasta_fallback.png")
              z.write(
                  "android-app/app/src/main/res/drawable/ic_launcher_liveasta_background.xml",
                  arcname="android/ic_launcher_liveasta_background.xml"
              )
              z.write(
                  "android-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher_liveasta.xml",
                  arcname="android/ic_launcher_liveasta.xml"
              )

          # Validation.
          checks = {
              "assets/icons/liveasta-pwa-any-192-v142.png": (192,192),
              "assets/icons/liveasta-pwa-any-512-v142.png": (512,512),
              "assets/icons/liveasta-pwa-maskable-192-v142.png": (192,192),
              "assets/icons/liveasta-pwa-maskable-512-v142.png": (512,512),
              "assets/icons/liveasta-apple-touch-180-v142.png": (180,180),
              "android-app/app/src/main/res/drawable-nodpi/ic_launcher_liveasta_foreground.png": (432,432),
              "android-app/app/src/main/res/mipmap-nodpi/ic_launcher_liveasta.png": (512,512),
          }
          for path, expected in checks.items():
              im = Image.open(path)
              im.load()
              if im.size != expected:
                  raise SystemExit(f"{path}: {im.size} != {expected}")
              print(path, im.mode, im.size)

      - name: Commit generated icon pack
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Liveasta Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Replace PWA and Android icons from uploaded artwork"
          git push origin HEAD:main
