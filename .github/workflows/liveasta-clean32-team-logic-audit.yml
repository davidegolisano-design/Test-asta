name: LIVEASTA DEV clean32 team logic audit
on:
  push:
    paths:
      - '.github/workflows/liveasta-clean32-team-logic-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: npm install --no-save espree
      - name: Run CLEAN-32 team logic audit
        run: node dev/tools/clean32_team_logic_audit.mjs
      - name: Validate sources
        run: |
          for f in dev/scripts/*.js; do node --check "$f"; done
          test -s dev/CLEANUP_AUDIT_CLEAN32_TEAM_LOGIC.txt
      - name: Commit report and self-remove
        run: |
          rm -f .github/workflows/liveasta-clean32-team-logic-audit.yml dev/tools/clean32_team_logic_audit.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/CLEANUP_AUDIT_CLEAN32_TEAM_LOGIC.txt .github/workflows/liveasta-clean32-team-logic-audit.yml dev/tools/clean32_team_logic_audit.mjs
          git commit -m "LIVEASTA DEV clean32 team logic dependency audit"
          git push
