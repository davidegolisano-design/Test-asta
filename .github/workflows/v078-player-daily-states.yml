name: Apply v0.78 player Daily states

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v078-player-daily-states.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch player light-theme preparation and win/lose states
        shell: python
        run: |
          from pathlib import Path

          p=Path('pwa-install.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("document.title='v0.77 TEST';","document.title='v0.78 TEST';",1)
          s=s.replace("style.id='liveasta-v077-runtime-style';","style.id='liveasta-v078-runtime-style';",1)

          marker='LIVEASTA v0.78 — PLAYER DAILY STATES'
          if marker not in s:
              needle='    @media (min-width:761px){'
              css=r'''
    /* LIVEASTA v0.78 — PLAYER DAILY STATES
       Solo temi chiari: preparazione leggibile + vincente verde + perdente rosso. */
    html:is(
      [data-live-theme="light-neutral"],
      [data-live-theme="light-blue"],
      [data-live-theme="light-sand"],
      [data-live-theme="ocean-daily"],
      [data-live-theme="sunset-daily"],
      [data-live-theme="royal-daily"]
    ) #screen-player-buzzer .phone-top-area.player-preparing #player-countdown,
    html:is(
      [data-live-theme="light-neutral"],
      [data-live-theme="light-blue"],
      [data-live-theme="light-sand"],
      [data-live-theme="ocean-daily"],
      [data-live-theme="sunset-daily"],
      [data-live-theme="royal-daily"]
    ) #screen-player-buzzer #player-countdown.prep-countdown{
      display:block!important;
      visibility:visible!important;
      opacity:1!important;
      color:var(--theme-number)!important;
      -webkit-text-fill-color:var(--theme-number)!important;
      text-shadow:none!important;
      background:transparent!important;
    }

    html:is(
      [data-live-theme="light-neutral"],
      [data-live-theme="light-blue"],
      [data-live-theme="light-sand"],
      [data-live-theme="ocean-daily"],
      [data-live-theme="sunset-daily"],
      [data-live-theme="royal-daily"]
    ) #screen-player-buzzer .phone-top-area.player-winning{
      background:var(--theme-card)!important;
      border-color:#17985F!important;
      box-shadow:0 0 0 2px rgba(23,152,95,.18),0 10px 26px rgba(23,152,95,.12)!important;
    }

    html:is(
      [data-live-theme="light-neutral"],
      [data-live-theme="light-blue"],
      [data-live-theme="light-sand"],
      [data-live-theme="ocean-daily"],
      [data-live-theme="sunset-daily"],
      [data-live-theme="royal-daily"]
    ) #screen-player-buzzer .phone-top-area.player-winning .player-live-side{
      background:linear-gradient(180deg,
        color-mix(in srgb,#38D486 22%,var(--theme-card)) 0%,
        color-mix(in srgb,#38D486 14%,var(--theme-panel)) 52%,
        color-mix(in srgb,#17985F 10%,var(--theme-card)) 100%)!important;
      border-left-color:#17985F!important;
      box-shadow:inset 0 0 0 1px rgba(23,152,95,.26)!important;
      color:var(--theme-text)!important;
    }

    html:is(
      [data-live-theme="light-neutral"],
      [data-live-theme="light-blue"],
      [data-live-theme="light-sand"],
      [data-live-theme="ocean-daily"],
      [data-live-theme="sunset-daily"],
      [data-live-theme="royal-daily"]
    ) #screen-player-buzzer .phone-top-area.player-winning .player-live-side::before{
      opacity:1!important;
      background:radial-gradient(circle at 50% 42%,rgba(56,212,134,.26) 0%,rgba(23,152,95,.14) 48%,transparent 78%)!important;
    }

    html:is(
      [data-live-theme="light-neutral"],
      [data-live-theme="light-blue"],
      [data-live-theme="light-sand"],
      [data-live-theme="ocean-daily"],
      [data-live-theme="sunset-daily"],
      [data-live-theme="royal-daily"]
    ) #screen-player-buzzer .phone-top-area.player-winning #player-current-winner{
      color:#117347!important;
      -webkit-text-fill-color:#117347!important;
      text-shadow:none!important;
    }

    html:is(
      [data-live-theme="light-neutral"],
      [data-live-theme="light-blue"],
      [data-live-theme="light-sand"],
      [data-live-theme="ocean-daily"],
      [data-live-theme="sunset-daily"],
      [data-live-theme="royal-daily"]
    ) #screen-player-buzzer .phone-top-area.player-losing{
      background:var(--theme-card)!important;
      border-color:#D6455A!important;
      box-shadow:0 0 0 2px rgba(214,69,90,.17),0 10px 26px rgba(214,69,90,.11)!important;
    }

    html:is(
      [data-live-theme="light-neutral"],
      [data-live-theme="light-blue"],
      [data-live-theme="light-sand"],
      [data-live-theme="ocean-daily"],
      [data-live-theme="sunset-daily"],
      [data-live-theme="royal-daily"]
    ) #screen-player-buzzer .phone-top-area.player-losing .player-live-side{
      background:linear-gradient(180deg,
        color-mix(in srgb,#FF667A 20%,var(--theme-card)) 0%,
        color-mix(in srgb,#FF667A 13%,var(--theme-panel)) 52%,
        color-mix(in srgb,#D6455A 9%,var(--theme-card)) 100%)!important;
      border-left-color:#D6455A!important;
      box-shadow:inset 0 0 0 1px rgba(214,69,90,.24)!important;
      color:var(--theme-text)!important;
    }

    html:is(
      [data-live-theme="light-neutral"],
      [data-live-theme="light-blue"],
      [data-live-theme="light-sand"],
      [data-live-theme="ocean-daily"],
      [data-live-theme="sunset-daily"],
      [data-live-theme="royal-daily"]
    ) #screen-player-buzzer .phone-top-area.player-losing .player-live-side::before{
      opacity:1!important;
      background:radial-gradient(circle at 50% 42%,rgba(255,102,122,.24) 0%,rgba(214,69,90,.13) 48%,transparent 78%)!important;
    }

    html:is(
      [data-live-theme="light-neutral"],
      [data-live-theme="light-blue"],
      [data-live-theme="light-sand"],
      [data-live-theme="ocean-daily"],
      [data-live-theme="sunset-daily"],
      [data-live-theme="royal-daily"]
    ) #screen-player-buzzer .phone-top-area.player-losing #player-current-winner{
      color:#B42F43!important;
      -webkit-text-fill-color:#B42F43!important;
      text-shadow:none!important;
    }
'''
              if needle not in s:
                  raise SystemExit('Punto inserimento CSS non trovato')
              s=s.replace(needle,css+'\n'+needle,1)

          p.write_text(s,encoding='utf-8')

      - name: Validate patch
        shell: python
        run: |
          from pathlib import Path
          s=Path('pwa-install.js').read_text(encoding='utf-8')
          required=[
            'v0.78 TEST',
            'LIVEASTA v0.78 — PLAYER DAILY STATES',
            'player-winning .player-live-side',
            'player-losing .player-live-side',
            'player-preparing #player-countdown',
            'ocean-daily','sunset-daily','royal-daily'
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Patch incompleta: '+', '.join(missing))

      - name: Commit v0.78
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pwa-install.js
          git commit -m 'v0.78 fix player preparation and win lose states on Daily themes'
          git push origin main
