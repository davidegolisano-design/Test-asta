name: LIVEASTA DEV clean06 overlap audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/liveasta-clean06-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install parser
        run: npm install --no-save postcss@8

      - name: Build CSS and JS overlap map
        run: |
          cat > clean06-audit.js <<'JS'
          const fs=require('fs');
          const path=require('path');
          const postcss=require('postcss');

          const cssDir='dev/styles';
          const jsDir='dev/scripts';
          const cssFiles=fs.readdirSync(cssDir).filter(x=>x.endsWith('.css')).sort();
          const jsFiles=fs.readdirSync(jsDir).filter(x=>x.endsWith('.js')).sort();

          function ctx(rule){
            const c=[]; let p=rule.parent;
            while(p&&p.type!=='root'){
              if(p.type==='atrule') c.unshift('@'+p.name+' '+String(p.params||'').trim());
              p=p.parent;
            }
            return c.join(' > ');
          }

          const groups=new Map();
          let importantCount=0, declCount=0, ruleCount=0;
          for(const file of cssFiles){
            const text=fs.readFileSync(path.join(cssDir,file),'utf8');
            const root=postcss.parse(text,{from:file});
            root.walkRules(rule=>{
              ruleCount++;
              const context=ctx(rule);
              rule.walkDecls(d=>{
                declCount++;
                if(d.important) importantCount++;
                const key=context+'\u0000'+rule.selector+'\u0000'+d.prop;
                if(!groups.has(key)) groups.set(key,[]);
                groups.get(key).push({file,line:d.source?.start?.line||0,value:d.value,important:!!d.important,selector:rule.selector,context,prop:d.prop});
              });
            });
          }

          const conflicts=[];
          for(const arr of groups.values()){
            if(arr.length<2) continue;
            const variants=[...new Set(arr.map(x=>(x.important?'!':'')+x.value))];
            if(variants.length<2) continue;
            conflicts.push({count:arr.length,variants:variants.length,arr});
          }
          conflicts.sort((a,b)=>b.count-a.count || b.variants-a.variants);

          // Basic JS global/function overlap scan. This is intentionally lexical, not a semantic rewrite tool.
          const jsNames=new Map();
          const reDecl=/\b(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(|\b(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*(?:async\s*)?(?:function\b|\([^)]*\)\s*=>|[A-Za-z_$][\w$]*\s*=>)|\bwindow\.([A-Za-z_$][\w$]*)\s*=|\bglobalThis\.([A-Za-z_$][\w$]*)\s*=/g;
          for(const file of jsFiles){
            const text=fs.readFileSync(path.join(jsDir,file),'utf8');
            const starts=[0]; for(let i=0;i<text.length;i++) if(text[i]=='\n') starts.push(i+1);
            let m; while((m=reDecl.exec(text))){
              const name=m[1]||m[2]||m[3]||m[4]; if(!name) continue;
              let lo=0,hi=starts.length; while(lo+1<hi){const mid=(lo+hi)>>1; if(starts[mid]<=m.index) lo=mid; else hi=mid;}
              if(!jsNames.has(name)) jsNames.set(name,[]);
              jsNames.get(name).push({file,line:lo+1});
            }
          }
          const jsOver=[...jsNames.entries()].filter(([,a])=>a.length>1).sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0]));

          const out=[];
          out.push('LIVEASTA CLEAN-06 - OVERLAP AUDIT');
          out.push('==================================');
          out.push('No application behavior is changed by this audit.');
          out.push('');
          out.push('CSS SUMMARY');
          out.push(`- files: ${cssFiles.length}`);
          out.push(`- rules: ${ruleCount}`);
          out.push(`- declarations: ${declCount}`);
          out.push(`- !important declarations: ${importantCount}`);
          out.push(`- selector/context/property groups with conflicting values: ${conflicts.length}`);
          out.push('');
          out.push('TOP CSS CONFLICTS');
          for(const c of conflicts.slice(0,180)){
            const a=c.arr[0];
            out.push(`\n[${c.count} declarations / ${c.variants} values] ${a.context?`(${a.context}) `:''}${a.selector} :: ${a.prop}`);
            for(const x of c.arr.slice(0,30)) out.push(`  - ${x.file}:${x.line} = ${x.value}${x.important?' !important':''}`);
            if(c.arr.length>30) out.push(`  - ... ${c.arr.length-30} more`);
          }
          out.push('');
          out.push('JS OVERLAP SUMMARY');
          out.push(`- files: ${jsFiles.length}`);
          out.push(`- names declared/assigned more than once: ${jsOver.length}`);
          for(const [name,locs] of jsOver.slice(0,120)) out.push(`- ${name} x${locs.length}: ${locs.map(x=>x.file+':'+x.line).join(', ')}`);
          fs.writeFileSync('dev/CLEANUP_REPORT_CLEAN06.txt',out.join('\n')+'\n','utf8');
          JS
          node clean06-audit.js
          rm clean06-audit.js

      - name: Validate application sources
        run: |
          set -e
          for f in dev/scripts/*.js; do node --check "$f"; done
          node - <<'JS'
          const fs=require('fs'),postcss=require('postcss');
          for(const f of fs.readdirSync('dev/styles').filter(x=>x.endsWith('.css'))){postcss.parse(fs.readFileSync('dev/styles/'+f,'utf8'));}
          console.log('CSS parse OK');
          JS
          test -s dev/CLEANUP_REPORT_CLEAN06.txt

      - name: Commit report and self-remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/liveasta-clean06-audit.yml
          git add dev/CLEANUP_REPORT_CLEAN06.txt .github/workflows/liveasta-clean06-audit.yml
          git diff --cached --quiet || (git commit -m "LIVEASTA DEV clean06 map CSS and JS overlaps" && git push)
